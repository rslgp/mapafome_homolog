# Roadmap UI/UX - MAPA FOME (rodada 1)
# Gerado pelo loop de UI/UX do loop-manager em 2026-07-02 via multiagents
# (a11y-architect + react-reviewer). Foco: acessibilidade WCAG 2.2 AA + UX de React.
# O loop avanca/atualiza este arquivo a cada acordada. NAO confundir com MILESTONES.yaml
# (roadmap de engenharia P1/P2/... da raiz, que NAO e deste loop).
rodada: 1
gerado_em: "2026-07-02"
fontes: [a11y-architect, react-reviewer]
milestones:
  - id: M1
    titulo: Substituir alert() nativo por erro inline acessivel no fluxo de endereco
    prioridade: alta
    objetivo: >
      Trocar window.alert() de erro de validacao e falha de gravacao por mensagem
      inline com role=alert, campo com aria-invalid + aria-describedby, e label visivel
      (nao so placeholder). Bloqueia doacao para leitor de tela e e diagnostico duplo (a11y + UX).
    arquivos: ["src/app/components/compatibility/components/googlesheets/endereco.js:94,159,177"]
    wcag: ["3.3.1", "3.3.3", "1.3.1", "4.1.3"]
    aceite: >
      Nenhum alert()/confirm() no fluxo de submissao; erro renderizado no DOM com role=alert
      proximo ao campo; input com aria-invalid e aria-describedby; label htmlFor visivel.
    status: pendente
  - id: M2
    titulo: Contexto acessivel nos botoes e icones do popup do mapa
    prioridade: alta
    objetivo: >
      Botoes de acao do popup (verificar CNPJ, excluir ponto, alimento entregue) recebem
      aria-label com o contexto do ponto; SVG decorativo recebe aria-hidden.
    arquivos: ["src/app/components/compatibility/components/PopupContent.js:57-102"]
    wcag: ["2.4.6", "4.1.2", "1.1.1"]
    aceite: >
      Cada botao de acao do popup carrega aria-label com o local/ponto; SVG puramente
      decorativo tem aria-hidden=true alem de focusable=false.
    status: pendente
  - id: M3
    titulo: Estado de submit robusto no formulario de endereco (anti-duplo-envio)
    prioridade: alta
    objetivo: >
      Durante o submit o botao fica disabled, mostra spinner/label de progresso, e volta
      ao normal ou mostra erro ao concluir; duplo clique nao grava duas vezes. Seguir o
      padrao ja maduro de PetReportSheet.
    arquivos: ["src/app/components/compatibility/components/googlesheets/endereco.js:78,97,163,174"]
    wcag: ["4.1.3"]
    aceite: >
      Botao disabled + indicador de progresso durante isLoading; um duplo clique nao dispara
      duas gravacoes; comportamento coberto por teste.
    status: pendente
  - id: M4
    titulo: Foco visivel consistente (anel) nos formularios de parceiros e cadastrar
    prioridade: media
    objetivo: >
      Aplicar o mesmo token de focus-ring (box-shadow) ja usado no resto do app aos inputs
      de /parceiros e /iniciativas/cadastrar, que hoje sinalizam foco so por cor de borda.
    arquivos: ["src/app/parceiros/parceiros.css:153-158", "src/app/iniciativas/cadastrar/register.css:62-65"]
    wcag: ["2.4.11", "2.4.7"]
    aceite: >
      Inputs dessas rotas usam --mdf-focus-ring com contraste >=3:1 contra o fundo adjacente,
      medido; anel de pelo menos 2px CSS no perimetro.
    status: pendente
  - id: M5
    titulo: Semantica de estrutura: h1 na home do mapa, fieldset nos filtros, hierarquia de headings
    prioridade: media
    objetivo: >
      Home do mapa ganha um h1 (pode ser sr-only); blocos de filtro em fieldset/legend;
      corrigir salto h3-sem-h2 no InfoPanel.
    arquivos: ["src/app/components/compatibility/App.js", "src/app/components/compatibility/components/MainControls.js:105-157", "src/app/components/compatibility/components/InfoPanel.js:170,333"]
    wcag: ["2.4.6", "1.3.1", "4.1.2"]
    aceite: >
      Exatamente um h1 por pagina; filtros em fieldset com legend; arvore de headings sequencial
      sem saltos, validado por npm run a11y sem regressao.
    status: pendente
  - id: M6
    titulo: Consolidar formularios de endereco duplicados e limpar codigo morto
    prioridade: media
    objetivo: >
      Unificar as variacoes de NameForm/formulario de endereco (form.js, googlesheets/form.js,
      endereco.js, mylocation.js) num componente reutilizavel com um unico contrato de
      loading/erro/sucesso; isolar/remover arquivos comprovadamente nao importados.
    arquivos: ["src/app/components/compatibility/components/form.js", "src/app/components/compatibility/components/googlesheets/form.js", "src/app/components/compatibility/components/googlesheets/mylocation.js"]
    wcag: []
    aceite: >
      Um componente de endereco reutilizavel com contrato unico de estados; arquivos nao
      importados removidos ou movidos para _legacy documentado; suite verde.
    status: pendente
