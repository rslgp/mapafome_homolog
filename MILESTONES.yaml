notes: |
  - Every completed pass ends with a what/why table (per CLAUDE.md): one row per file/logical change
    (File/Change · What · Why), plus a separate gate-results table when checks were run, and an honest
    list of deferred items.
  - All commits route through the git-commit-specialist agent — Conventional Commits
    (type(scope): subject) with the WHY in the body, atomic one-concern-per-commit splits, correct
    footers and the repo Co-Authored-By trailer; never hand-stage a grab-bag working tree.
  - This orchestrator EMITS the plan only; it does NOT edit source until the plan is approved.
  - The full repo gate is: npm run test, npm run build, npm run fitness, npm run lint, npm run a11y,
    npm run smoke200 (served-build render gate — always run after build, never skip), and for the
    backend cd asaas-backend && npm test. A milestone is done only when its listed gate(s) pass.
  - PARTIAL-FIT note: the roster is a SOLONE Defold/Lua mobile-GAME consultant set (coloring-ict6,
    competitive-balance, game-designer, softwareengineer, uiux-defold) routed onto a Next.js 16 /
    React 19 static-export web app + serverless asaas-backend; competitive-balance and game-designer
    have zero overlap and appear only as out_of_scope.
  - PHASE/order: independent slices (P11, P12, P15, P17, P18) run in parallel; dependent ones are
    sequential — P13 precedes P14 (the secret cutover); P19/P20 jointly harden the asaas-backend.
  - STATUS (as of 2026-06-09): SHIPPED = P1-P6, P11, P12, P13, P15, P16, P17, P18, P19, P20, P21
    (commit shas recorded per-milestone above). REMAINING: only P14 (later — the
    NEXT_PUBLIC_GOOGLE_PRIVATE_KEY client-bundle secret; a bug-bounty / secret-architecture handoff,
    NOT autonomous softwareengineer scope; its P13 groundwork is done). The P12 fetchSheetRows/
    useSheetReport seam was deferred (not a byte-identical dup; entangled with page React state) — a
    candidate for a future P-id if it recurs, not a blocker.
  - RAIL CONTRACT: the recurring rails are pix | cartao | boleto only. The earlier "débito automático"
    rail was removed (7513c10) — Asaas's subscription billingType enum has no bank-debit value, so it
    produced a runtime 400; P20's committed tests assert the 3-rail contract.
  - CARD FLOW (P21): the cartão rail uses the Asaas HOSTED checkout (invoiceUrl). The /assinar form
    no longer collects card number/CVV inline and the backend no longer accepts/forwards card data —
    no PAN/CVV touches our code (no PCI scope). asaasClient.js is unchanged (its CREDIT_CARD &&
    creditCard guard no-ops when card is absent). Do NOT re-add an inline card form.
