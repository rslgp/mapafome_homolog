# ──────────────────────────────────────────────────────────────────────────────
# TEST DESIGN CONVENTIONS (apply to every new spec so the suite stays honest)
# ──────────────────────────────────────────────────────────────────────────────
conventions:
  - "Stateless + independent per test so fullyParallel stays safe."
  - "Seed the returning-visitor cookie via dismissOnboardingTour(context) in beforeEach UNLESS the case is about the tour itself (onboarding suite)."
  - "Cookie shape: url-only (no path+url together) — Playwright 1.60 rejects both (see _helpers.js / memory mapafome-playwright-helper-cookie-bug)."
  - "INTL-gated cases MUST test.skip honestly when the country-flag control is not mounted — never false-fail."
  - "Mock all writes at the network boundary (page.route): sheets publish, Asaas backend, analytics. NEVER perform a live write or a live charge."
  - "Generous timeouts already set in playwright.parallel.yaml for the slow HDD; prefer web-first assertions (expect(locator)) over fixed waits."
  - "Filter benign console noise via captureConsoleErrors (favicon/gtag/devtools) — only real app errors fail a route."
  - "Where a behavior is fully proven in vitest (unit_ref), assert only the browser-only half here to keep the slow lane lean."
