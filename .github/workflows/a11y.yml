name: a11y

on:
  pull_request:
  push:
    branches: [main]

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pin a MATCHING Chrome + ChromeDriver pair from Chrome for Testing (CfT).
      # At `chrome-version: stable`, setup-chrome pulls Chrome from dl.google.com
      # (latest patch, e.g. .102) but ChromeDriver from CfT (which lags, e.g.
      # .55) — two SOURCES that desync whenever google-chrome's patch runs ahead
      # of CfT, giving "session not created: ChromeDriver only supports Chrome
      # 149" even though both are major 149. Pinning an explicit CfT version
      # makes BOTH the chrome binary and the driver come from the SAME CfT
      # snapshot, so they can never mismatch. Bump when CfT retires this build.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: '149.0.7827.55'
          install-chromedriver: true

      # @axe-core/cli (via selenium) launches the SYSTEM chrome at
      # /opt/google/chrome/chrome and ignores CHROME_PATH — so the matched CfT
      # ChromeDriver 149 was driving the runner's preinstalled chrome 148
      # ("ChromeDriver only supports Chrome 149; current browser is 148").
      # Repoint the system path at the matched CfT 149 binary so the launched
      # browser and the driver are the same build.
      - name: Point the launched chrome at the matched CfT build
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version

      # npm install (not npm ci): the lockfile is not kept in sync here, so
      # `npm ci` hard-fails the EUSAGE lock check. Revert once a CI-matching
      # lock is regenerated.
      - run: npm install --no-fund

      # Build the Next.js app. The project uses next build --webpack.
      - run: npm run build
        env:
          NEXT_PUBLIC_GOOGLESHEETID: ${{ secrets.NEXT_PUBLIC_GOOGLESHEETID }}
          NEXT_PUBLIC_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.NEXT_PUBLIC_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_GOOGLE_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PRIVATE_KEY }}
          NEXT_PUBLIC_CRYPTSEED: ${{ secrets.NEXT_PUBLIC_CRYPTSEED }}

      # Serve the built app in the background, then point axe at it.
      - name: Start app
        run: |
          npx --yes serve -l 3000 out &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      # Fail on serious + critical violations. WCAG 2.2 AA tags per M0 exit criteria.
      # Use the synced ChromeDriver from setup-chrome; CHROME_PATH points it at
      # the matching Chrome so it never falls back to the drifting system one.
      - name: Run axe-core
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          # --chrome-options no-sandbox/disable-dev-shm-usage: the CfT chrome
          # binary, launched as root on the runner, exits immediately without a
          # sandbox ("Chrome instance exited") — unlike the distro google-chrome
          # it replaced. These flags are standard for headless Chrome in CI.
          npx --yes @axe-core/cli http://localhost:3000 \
            --exit \
            --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" \
            --chrome-options="no-sandbox,disable-dev-shm-usage" \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa \
            --show-errors
