    owner: human-gated (release/CVE) + softwareengineer (bump)
    scope: "Include: atualizar next para o patch que corrige GHSA-8h8q-6873-q5fj (DoS via Server Components, afeta >=16.0.0 <16.2.5) e GHSA-26hh-7cqf-hhc6 (middleware/proxy bypass, afeta >=16.0.0 <16.2.6); rodar full gate pos-bump. Exclude: upgrade major (16->17)."
    why: "npm audit confirma 2 CVEs HIGH no range instalado, mais cache-poisoning e CSP-nonce XSS. Nenhum roadmap existente (MILESTONES/BACKLOG/ROADMAP_VERTENTES) rastreia isso. E o item de seguranca mais urgente do scan: risco de producao AGORA, nao hipotetico."
    gate: ["npm audit (CVEs fechados)", "npm run lint", "npm run test", "npm run build", "npm run smoke200"]
    status: pending
    human_gate: true
