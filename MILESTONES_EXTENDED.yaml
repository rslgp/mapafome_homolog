# MILESTONES_EXTENDED.yaml — extensive gap-scan milestones document.
#
# POR QUE ESTE ARQUIVO EXISTE
#   Complementa ROADMAP_VERTENTES.yaml (30 itens, tiers S+/S/A/B). Este arquivo
#   e um segundo pass, MAIS FUNDO e MAIS FINO: escala de 5 tiers (S+/S/S-/A+/A)
#   cobrindo areas que o primeiro pass nao tocou — testes, performance, error
#   handling, a11y avancado, integridade de dados, DX, observabilidade,
#   seguranca de dependencias, conteudo/i18n, build/deploy. Nenhum id duplica
#   os 30 ja trackeados (SEC-*, SEO-*, PET-*, PAY-*, I18N-*, INIT-*, PART-01,
#   REP-*, PWA-*, QA-*, FOME-*, GOV-01) nem os 43 de UIUX_MILESTONES.yaml.
#
# ESCALA DE TIER (5 niveis, mais fina que o S+/S/A/B do roadmap principal)
#   S+ : risco de producao AGORA (CVE conhecido explorável, dinheiro real, PII).
#   S  : alto impacto amplo (afeta toda uma vertente ou todo usuario).
#   S- : alto impacto mas mais estreito (1 fluxo, 1 persona, 1 locale).
#   A+ : valor solido, sem risco imediato, mas gap real e evidenciado.
#   A  : polimento/DX/higiene — vale fazer, nao urgente.
#   Trabalhar do maior pro menor. Mesmas regras de status/gate/commit do
#   ROADMAP_VERTENTES.yaml (shipped SO com gate verde lido; append-only).
#
# METODO
#   Gerado por 6 passes de scan de evidencia (Explore agent, read-only).
#   Pass 1 (10 areas): testes, performance, error-handling, a11y, integridade
#   de dados, DX, observabilidade, seguranca de deps, conteudo/i18n, build/deploy.
#   Pass 2 (8 areas, mais fundo): PWA install/offline edge cases, MapaPet vertical
#   (match/taxonomy/share), Asaas backend edge cases (validacao/CORS/replay),
#   geofence/bbox de paises, Leaflet map (cluster/tiles/perf), teclado mobile/
#   viewport, analytics/privacidade (LGPD), staleness de dependencias.
#   Pass 3 (8 areas): relatorios/marketing vertical depth (k-anonimizacao,
#   timezone), parceiros/sponsors/imprensa (badges enganosos, weight inerte),
#   validacao de formulario/UX, export CSV/injecao-de-formula, iniciativas/
#   cadastrar, links cross-app/integracao externa, timezone/data global, memory
#   leaks (timers/listeners sem cleanup).
#   Pass 4 (6 areas): arquitetura de design-token CSS (tokens mortos, drift de
#   spacing/radius sem gate), gaps de regra de lint, meta-gaps das PROPRIAS
#   fitness-functions (o que os 11 FFs existentes nao pegam), drift de
#   documentacao (loop.yaml desatualizado sobre o proprio goal-loop), governanca
#   do goal-loop (cap subiu sem re-autorizacao registrada), otimizacao de
#   imagem/asset (CLS por falta de width/height).
#   Pass 5 (6 areas): Google Sheets como banco de dados sob escala/concorrencia
#   (rate-limit 429, sem paginacao), corretude de criptografia (teatro de
#   seguranca confirmado na arquitetura, nao so dead-code), setState em
#   componente desmontado, stylesheet de impressao ausente, direitos do titular
#   de dados LGPD/GDPR (distinto do gap de CONSENTIMENTO ja encontrado), e a
#   RACE CONDITION entre usuarios DIFERENTES escrevendo concorrentemente na
#   mesma linha (distinta do gap de retry-idempotencia ja encontrado — aqui sao
#   2 requests honestos e simultaneos, nao o mesmo request repetido).
#   Pass 6 (6 areas): multi-tab/multi-janela (claim de pin nao propaga entre
#   abas), qualidade de mensagem de erro pro usuario (2 paginas vazam e.message
#   cru pro publico NAO-tecnico de MP/secretarias), Notification API (feature
#   100% inerte — pede permissao, salva prefs, nunca entrega nada), deploy
#   config do asaas-backend (sem regiao pinada), paridade de env dev/CI/prod (o
#   CI nunca exercita o path de geofence-ligado), acessibilidade de cluster de
#   marcadores (sem aria-label). Cada item cita file:line real — nenhum fato
#   inventado. Nao commitar nenhuma correcao sem antes reler o arquivo/linha
#   citado (pode ter mudado desde o scan).

