    scope: "Include: reverter ci.yml:49 de --audit-level=critical pra --audit-level=high SOMENTE apos EXT-SEC-03 (upgrade da cadeia google-spreadsheet/axios) fechar os findings HIGH atuais — senao o gate fica vermelho imediatamente. Exclude: mudar o audit-level antes da cadeia estar limpa."
    why: "ci.yml:40-48 documenta que o rebaixamento foi deliberado pra nao bloquear CI nos findings HIGH existentes (axios SSRF/CSRF/ReDoS via google-spreadsheet@3.0.10, follow-redirects, node-forge, lodash, picomatch, flatted, undici). Isso significa CI NAO bloqueia mais em HIGH — um novo CVE HIGH real passa sem alarme."
    gate: ["npm audit --audit-level=high (0 findings apos EXT-SEC-03)", "ci.yml atualizado", "1 CI run verde"]
    status: pending
    depends: [EXT-SEC-03]
    human_gate: true
    note: "E politica de CI (decisao do time), nao so codigo — Claude PROPOE a reversao, humano decide o timing."

