    area: SEC
    tier: S
    owner: softwareengineer
    scope: "Include: atualizar google-spreadsheet para uma major que nao dependa do axios legado (ou trocar por um client mais magro), reduzindo a cadeia de deps vulneraveis (axios, follow-redirects, node-forge, lodash, picomatch, flatted, undici, json-bigint, gcp-metadata) que hoje entra no BUNDLE CLIENTE (sheetsClient.js roda no browser). Exclude: mudar o schema/API do sheetsClient (contrato interno preservado)."
    why: "package.json:31 pina google-spreadsheet EXATO (sem ^), puxando axios@0.19.2 -- uma versao antiga com CVEs conhecidos, e ela roda NO BROWSER (nao so no servidor). E a raiz que bloqueia EXT-SEC-02 (restaurar o audit gate)."
