# ROADMAP_VERTENTES.yaml — roadmap MULTI-VERTENTE do MAPA FOME.
#
# POR QUE ESTE ARQUIVO EXISTE
#   UIUX_MILESTONES.yaml cobre SO a vertente UI/UX (43 itens). MILESTONES.yaml
#   cobre a P-series (refactor/pagamento). Este arquivo e o roadmap AMPLO: um
#   backlog tiered por VERTENTE do produto, derivado de uma analise profunda do
#   que o MAPA FOME faz (2026-07-04). Cada vertente e um eixo independente de
#   valor; itens de UI/UX continuam morando em UIUX_MILESTONES.yaml (nao duplicar).
#
# O QUE E O MAPA FOME (resumo da analise)
#   PWA Next.js 16 output:'export' (estatico, GitHub Pages + mapafome.com.br).
#   Tres superficies de produto:
#     - Mapa de doacao de alimento (raiz): reportar pin de necessidade, cor = urgencia
#       por idade (anel fresh/waiting/stale/done), filtro por categoria + recencia,
#       publicacao geofenced por pais, fila offline com quarentena de poison-pin.
#     - MapaPet (achados-e-perdidos de pets): reportar perdido/encontrado/avistado,
#       match etico (mesma especie, <=5km, <=30d), ciclo resolve/encerrar, foto
#       redimensionada+EXIF-strip client-side, contato reveal-on-tap, dedup (built,
#       nao ligado). PRE-LANCAMENTO: 0 linhas em producao.
#     - Assinatura de doacao recorrente (Asaas): rails pix|cartao|boleto, backend
#       serverless separado guarda a chave, webhook fail-closed timing-safe, idempotencia.
#   Suporte: 12 locales i18n (shards por dominio, paridade testada), relatorios
#   k-anonimizados (k=5) p/ MP/saude, press kit + parceiros + sponsors, SW/PWA com
#   janela de rollback, fitness-functions (11 invariantes), smoke200, geofence.
#
# FORMATO DA CASA (igual MILESTONES.yaml / UIUX_MILESTONES.yaml)
#   Cada item: id, title, vertente, tier, owner, scope (Include/Exclude), why, gate, status.
#   tier: S+ (move KPI/desbloqueia risco direto) > S > A > B. Trabalhar do maior pro menor.
#   status: pending -> in-progress -> shipped (SO com gate verde LIDO na sessao) | later | blocked-human.
#   "continue" = proximo pending de maior tier sem depends abertos.
#   Todo shipped ganha commit (hash + subject) + evidence. Append-only, nunca reescrever historico.
#   human_gate: true = acao/decisao do humano (deploy, endpoint, consentimento, chave). Claude PROPOE.
#   Gate minimo de item que toca src/: lint + test + fitness + build + smoke200 (+ a11y quando UI).
#   Log de execucao vive em CHANGES.md (cabecalho de acesso rapido no topo + corpo append-only).
#
# GOVERNADORES FIXOS (nao negociaveis por item, herdados do produto)
#   - Tom calmo / dignidade: nenhum padrao de pressao (pulse infinito, urgencia falsa).
#   - WCAG 2.2 AA e bloqueador de ship.
#   - Nunca versionar .claude/ (gitignored). Nunca push/PR/version-bump sem pedido explicito.
#   - A chave privada Google no bundle client (SEC-01) e a raiz de quase todo risco de abuso:
#     ate ela cair, todo write e spoofavel. E report-only / human-gated (era P14).

vertentes:
  - id: V1
    nome: "Mapa de doacao de alimento (core)"
  - id: V2
    nome: "MapaPet (achados-e-perdidos)"
  - id: V3
    nome: "Monetizacao / assinatura Asaas"
  - id: V4
    nome: "i18n / localizacao"
  - id: V5
    nome: "PWA / offline / service worker"
  - id: V6
    nome: "Relatorios / dados abertos"
  - id: V7
    nome: "Parceiros / imprensa / iniciativas"
  - id: V8
    nome: "SEO / descoberta"
  - id: V9
    nome: "Testes / arquitetura de qualidade"
  - id: V10
    nome: "Seguranca / privacidade"
  - id: V11
    nome: "Governanca / loop autonomo"

milestones:

  # ==================== V10 — SEGURANCA / PRIVACIDADE ====================
  - id: SEC-01
    title: "Proxy de escrita server-side: tirar a chave privada Google do bundle client"
    vertente: V10
    tier: S+
    owner: human-gated (arquitetura de segredo; era P14/MF-P14)
    scope: "Include: mover TODO write path (publicar pin fome + pet, resolve, flag, cleanold, relatorio-marketing) para um proxy serverless que guarde NEXT_PUBLIC_GOOGLE_PRIVATE_KEY como segredo de servidor (padrao ja provado no asaas-backend); o client passa a falar so com o proxy. Exclude: reescrever o formato da planilha; auth de usuario (item separado)."
    why: "Analise: a chave da service-account Google esta inline no bundle estatico (sheetsClient.js:43-44, appMainBootstrap.js:53-54, form.js, cleanold.js, relatorio-marketing/page.js:39). Qualquer visitante le e escreve na planilha. E a RAIZ que torna todo write (fome+pet publish/resolve/flag, rate-limit) spoofavel."
    gate: ["proxy: npm test verde", "client sem NEXT_PUBLIC_GOOGLE_PRIVATE_KEY (grep 0)", "npm run build", "npm run smoke200"]
    status: blocked-human
    human_gate: true
    note: "Report-only por decisao do produto (era P14, later). Groundwork P13 feito. NAO e escopo de softwareengineer autonomo: exige o humano escolher a arquitetura (Vercel function nova? reusar asaas-backend? Cloud Function?) e provisionar o segredo. Claude PROPOE o desenho, humano dirige."

  - id: SEC-02
    title: "Fitness function que falha o build se um segredo de servidor vazar para o bundle"
    vertente: V10
    tier: S
    owner: softwareengineer
    scope: "Include: nova FF (FF11) que varre out/ pos-build por padroes de chave privada (-----BEGIN PRIVATE KEY-----, PEM, JWT de service-account) e por NEXT_PUBLIC_ que casem uma allowlist de nomes-de-segredo; falha o gate se achar. Baseline: hoje ACHA a chave Google (SEC-01) — entao entra allowlisted-com-divida ate SEC-01 cair, mas pega VAZAMENTOS NOVOS. Exclude: remover a chave (isso e SEC-01)."
    why: "Analise: o vazamento da chave so foi pego por auditoria manual. Sem gate mecanico, o proximo NEXT_PUBLIC_ de segredo entra silencioso. Uma FF transforma 'auditoria de vez em quando' em 'bloqueador de todo build' (mesma logica do FF6 one-bbox-SOT)."
    gate: ["npm run fitness", "npm run build", "FF11 pega uma chave-isca injetada e falha"]
    status: pending

  - id: SEC-03
    title: "Endurecer a hygiene de pet.contact (control-char strip antes de gravar em Dados)"
    vertente: V10
    tier: A
    owner: softwareengineer
    scope: "Include: rodar pet.contact pelo mesmo strip de control-char/cap-length que os outros campos (petHygiene) ANTES de gravar em petBlob (petBlob.js:73-76 hoje pula de proposito). Preserva reveal-on-tap; so limpa o que persiste. Exclude: mudar o contrato de reveal."
    why: "Analise: pet.contact e deliberadamente NAO higienizado (tratado como acao de reveal), mas ele PERSISTE em Dados.contact — uma string forjada com control-chars/injection entra na planilha. Reveal-on-tap e sobre EXIBIR; gravar sujo e um vetor separado."
    gate: ["npm run test", "npm run lint", "teste novo: contact com control-char e limpo na gravacao"]
