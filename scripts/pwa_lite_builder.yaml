  standing_gates:   "LLM_BRAIN/solone/brainstorms/build_release_brainstorm.yaml (BREL-001 live probe, BREL-003 version parity, BREL-006 overlay drift sentinel, BREL-008 .bat/.sh parity)"
  rescue_sibling:   "LLM_BRAIN/solone/brainstorms/pwa_backcompat_brainstorm.yaml (trapped-user SW rescue — NOT built here)"
  cardinal_rule:    "LLM_BRAIN/solone/consultants/v1_0_principal_build_release_automation_solone.yaml (done == exit 0 AND artifact verified on disk; extended to live-URL by BREL-001)"

