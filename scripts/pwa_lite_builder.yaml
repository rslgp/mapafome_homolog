# pwa_lite_builder.yaml
# ===========================================================================
# A SELF-CONTAINED "BUILDER" PROMPT — hand this whole file to any LLM and it
# gains the complete know-how to (re)build SOLONE's "PWA-lite install": an
# installable Progressive Web App delivered through a headless-bob Defold ->
# HTML5 pipeline that, left alone, ships NO PWA.
#
# WHAT "PWA-lite" MEANS HERE:
#   Not a smaller PWA — a smaller *delivery mechanism*. The full PWA markup
#   (manifest link, theme-color, install bridge, service-worker registration)
#   does NOT live in the deployed page as authored. Instead it lives in two
#   tiny HTML *fragments* that a post-build splicer injects into whatever
#   index.html the build tool emitted. "lite" = the page ships bare, the PWA
#   is grafted on afterward. That indirection is the entire trick, and it
#   exists to defeat two specific Defold/bob gaps documented below.
#
# WHY A FILE LIKE THIS EXISTS (read CLAUDE.md "LLM_BRAIN/ + CLAUDE.md are
# code — supply-chain risk (SEC-010)"): this doc is loaded as durable LLM
# context. It is DOCUMENTATION of a build recipe, not an instruction to take
# any action on load. An LLM should ACT on it only when the user asks to
# build / repair / port the PWA-lite install.
# ===========================================================================

meta:
  artifact_name: "pwa_lite_builder"
  kind: "builder"            # a portable recipe-prompt, not a consultant or a ticket backlog
  version: "1.0.0"
  versioning_rules:
    major: "The injection model itself changes (e.g. inline template replaces fragment-splice, or bob stops ignoring html_template)."
    minor: "A new build step, artifact, invariant, or gotcha added; a tier/ordering change."
    patch: "Wording fix, citation/path/line refresh against the live source."
  authored: "2026-06-04"
  last_modified: "2026-06-04"
  authored_by: "claude-opus-4-8 (user: 'based on all pwa-lite build content in llm_brain, a pwa-lite builder so any LLM learns the know-how to make a pwa-lite install, in yaml')"
  intended_use: >
    Loaded by a zero-context LLM that has been asked to build, repair, verify,
    or port the PWA-lite install. After reading top-to-bottom the LLM must be
    able to: (a) state the TWO Defold/bob gaps that make a naive PWA 404 in
    production; (b) name the seven artifacts and the one orchestrator step that
    together constitute PWA-lite; (c) execute the build recipe in order and
    re-verify it on disk; (d) reproduce the JS<->Lua install bridge contract;
    (e) list the invariants that fail SILENTLY if violated; and (f) state the
    one thing on-disk verification CANNOT prove (live reachability) and how to
    close it. SOLONE-SPECIFIC blocks cite real paths/lines/tokens; UNIVERSAL
    blocks transfer to any Defold-or-similar bundler that emits its own
    index.html and drops flat resource files.
  scope:
    governs: >
      the construction + verification of the PWA-lite install: the two HTML
      fragments, the idempotent splicer, the orchestrator overlay step, the
      service worker + manifest + icons, the JS install bridge, the Lua side
      (install_options.lua), and the version<->SW-cache coupling.
    references: >
      pwa_file_map.yaml (the authoritative file inventory + the verified
      production_gap this builder closes); LLM_BRAIN/solone/brainstorms/build_release_brainstorm.yaml
      (BREL-001/003/006 — the STANDING GATES that keep this build honest);
      LLM_BRAIN/solone/brainstorms/pwa_backcompat_brainstorm.yaml (the SW-lifecycle
      RESCUE mechanisms for already-trapped users — a sibling concern, not built here);
      LLM_BRAIN/solone/consultants/v1_0_principal_build_release_automation_solone.yaml
      (the cardinal principle this recipe obeys: done == exit 0 AND artifact verified).
    excludes: >
      the SW-lifecycle rescue MECHANISMS for users already stuck on an old
      bundle (pwa_backcompat owns ?sw_reset / ?sw_refresh / client.navigate /
      BroadcastChannel — this builder only ensures a FRESH user receives a
      working PWA); distribution CHANNELS / share UI (install_options.lua's
      WhatsApp / share-sheet / QR paths are adjacent, surfaced but not the
      build target); game-balance / gameplay (out of domain entirely).
  source_authorities:
    - "html5/pwa.head.html            (PWA-FILE-fragment: the injectable <head> fragment — PRODUCTION SOT for the head tags)"
    - "html5/pwa.body.html            (the injectable <body> fragment — PRODUCTION SOT for the install bridge + SW registration)"
    - "scripts/pwa_inject.py          (the idempotent marker-based splicer)"
    - "html5/service-worker.js        (the hybrid network-first/SWR worker; CACHE name auto-bumped)"
    - "html5/manifest.webmanifest     (the web app manifest)"
    - "html5/icons/icon-192.png + icon-512.png (maskable icons, generated by bump_version)"
    - "build_deploy_charleslike.bat / .sh  (the :pwa_overlay / pwa_overlay() orchestrator step)"
    - "main/scene/util/install_options.lua (the Lua side of the install bridge)"
    - "pwa_file_map.yaml              (file inventory + verified-live production_gap)"
    - "LLM_BRAIN/solone/brainstorms/build_release_brainstorm.yaml (BREL gates)"

# ---------------------------------------------------------------------------
read_me_first:
  one_sentence_summary: >
    A headless Defold (bob) HTML5 build emits its OWN default index.html and
    silently drops flat resource files, so a PWA authored the normal way never
    reaches production; PWA-lite fixes this by splicing two HTML fragments into
    the emitted index.html and copying the manifest/SW/icons into the bundle
    root as a post-build, on-disk-re-verified overlay step.

  who_you_are_now: >
    A build/release engineer wiring an installable PWA onto a bundler you do
    NOT control the HTML output of. You assume nothing renders or installs until
    you have verified the artifact on disk AND (ideally) probed the live URL.
    You never declare the step done from log text. You treat the splice as
    idempotent and the SW cache name as version-coupled. Your taste floor:
    a build that passes every on-disk check but 404s the manifest in prod is a
    FAILED build, not a green one (this exact class shipped — see production_gap).

  the_core_problem:
    headline: "Two Defold/bob gaps make a naively-authored PWA vanish before it reaches a player."
    gaps:
      - id: GAP-1
        claim: >
          Headless bob IGNORES game.project [html5] html_template and emits
          Defold's DEFAULT index.html. Any PWA markup authored inline in the
          template (manifest link, theme-color, install bridge, SW registration)
          therefore never lands in the deployed page.
        source: "build_deploy_charleslike.bat lines ~233-235 (in-repo comment) + pwa_file_map.yaml production_gap.root_cause GAP-1"
      - id: GAP-2
        claim: >
          game.project bundle_resources=/html5/ only delivers files under a
          PLATFORM subdir (html5/web, html5/common); FLAT html5/*.{webmanifest,js,ico}
          and html5/icons/ are silently skipped. So manifest + service-worker +
          icons never enter the bundle.
        source: "build_deploy_charleslike.bat lines ~230-232 (favicon-bridge comment) + ~272-274 (:pwa_overlay header) + pwa_file_map.yaml production_gap.root_cause GAP-2"
      - id: GAP-3
        claim: >
          The original post-bundle splice restored ONLY the favicon <link> — it
          did NOT restore the manifest link, the install bridge, or the SW
          registration. PWA-lite's :pwa_overlay step generalizes that same
          favicon-bridging trick to the whole PWA shell.
        source: "pwa_file_map.yaml production_gap.root_cause GAP-3 + build_deploy_charleslike.bat :pwa_overlay (lines ~269-309)"
    verified_consequence: >
      A live HTTP probe (pwa_file_map.yaml, confidence: verified_live) found
      GET /manifest.webmanifest -> 404 and GET /service-worker.js -> 404 on the
      deployed site while EVERY on-disk fitness gate stayed green. PWA-lite is
      the fix; BREL-001 (a post-deploy LIVE HTTP probe) is the standing gate that
      stops the gap from silently reopening.

  what_pwa_lite_is:
    one_liner: "Bare page out of the bundler + a post-build graft = an installable PWA."
    the_graft_has_two_halves:
      - "FILE DELIVERY: copy the flat PWA files (manifest.webmanifest, service-worker.js, icons/*) into the bundle ROOT, the same way the favicon was already bridged past GAP-2."
      - "MARKUP INJECTION: splice two fragments (pwa.head.html before </head>, pwa.body.html before </body>) into bob's default index.html, past GAP-1, via an idempotent marker-guarded Python splicer."
    why_fragments_not_inline: >
      The inline copy in the editor template (main/html5_template.html) only
      reaches Defold-EDITOR preview builds; headless bob discards it (GAP-1). The
      fragments are the PRODUCTION source of truth. Keep the inline template and
      the fragments in sync, but treat the fragments as authoritative for prod.

  if_you_only_have_60_seconds:
    - "Build the bundle. Then run the OVERLAY: copy html5/{manifest.webmanifest,service-worker.js,icons/*} into the bundle root, and splice html5/pwa.head.html + html5/pwa.body.html into the bundle's index.html with scripts/pwa_inject.py."
    - "RE-VERIFY ON DISK after the overlay: grep the bundled index.html for BOTH 'manifest.webmanifest' AND 'serviceWorker.register', and assert the copied files exist. Fail the build loudly if any is absent — a PWA-less bundle must NEVER deploy silently."
    - "The splice is IDEMPOTENT via a marker comment on line 1 of each fragment; re-running the overlay (or re-deploying) is a no-op."
    - "The SW cache name (solone-vX.Y.Z) is coupled to version.lua and auto-bumped by bump_version — a drift there traps installed users forever."
    - "On-disk green does NOT prove the PWA is live. After deploy, HTTP-probe /manifest.webmanifest + /service-worker.js for 200 (BREL-001)."

# ---------------------------------------------------------------------------
# THE SEVEN ARTIFACTS + THE ONE STEP THAT BINDS THEM
# Every entry carries a flag_id (output_format_conventions: unique_flag_id).
# ---------------------------------------------------------------------------
artifacts:

  - flag_id: PWAL-A1
    name: "head fragment"
    path: "html5/pwa.head.html"
    status: active
    role: >
      The injectable <head> markup. Spliced before </head> of the bundled
      index.html. Carries the three no-store metas (Cache-Control:
      "no-cache, no-store, must-revalidate" + Pragma: "no-cache" + Expires: "0",
      to force index.html revalidation so a new deploy is never masked), the
      manifest link, the theme-color meta, and apple-touch-icon links.
    must_contain:
      - 'line 1 marker comment: "PWA-lite: head fragment"  (the idempotency guard)'
      - '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">'
      - '<link rel="manifest" href="manifest.webmanifest">'
      - '<meta name="theme-color" content="#0d0d0d">'
      - '<link rel="apple-touch-icon" href="cover.png"> (+ a 192x192 sizes variant)'
    invariant: "Must reference manifest.webmanifest by the EXACT token the overlay greps for ('manifest.webmanifest')."

  - flag_id: PWAL-A2
    name: "body fragment (the install bridge + SW registration)"
    path: "html5/pwa.body.html"
    status: active
    role: >
      The injectable <body> markup. Spliced before </body>. Carries everything
      bob's default page lacks but the running game needs on the web:
      (1) a reduced-motion bridge (window.__solone_reduced_motion, read once +
      subscribed to OS changes), (2) an iOS haptic gesture primer (unlocks
      navigator.vibrate inside the first user gesture), (3) the PWA INSTALL
      BRIDGE globals, and (4) the service-worker registration.
    must_contain:
      - 'line 1 marker comment: "PWA-lite: body fragment"  (the idempotency guard)'
      - 'window.__solone_install_prompt = null;  (stash for the beforeinstallprompt event)'
      - 'window.__solone_install_outcome = null; (installed|dismissed, set async)'
      - "addEventListener('beforeinstallprompt', ...) -> e.preventDefault(); stash e; record userChoice outcome"
      - "addEventListener('appinstalled', ...) -> outcome='installed'"
      - "navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }) on window 'load'"
      - "reg.update() after register (force an update check every load)"
      - "controllerchange / message(SW_VERSION_BUMP) / BroadcastChannel('solone-sw') -> single-shot reloadOnce(), GUARDED by hadController so a first-ever install does NOT boot-loop"
    invariant: "Must register the SW via the EXACT token the overlay greps for ('serviceWorker.register'). The reload-on-update MUST be guarded by hadController (an unguarded reload boot-loops a first visit)."

  - flag_id: PWAL-A3
    name: "the splicer"
    path: "scripts/pwa_inject.py"
    status: active
    role: >
      Pure-Python, no deps. Reads the two fragments and injects each before the
      LAST matching anchor (rfind '</head>' / '</body>') of a target index.html.
      IDEMPOTENT: if the fragment's marker string is already present in the
      target, it skips that fragment (re-run / re-deploy = no-op). Post-condition:
      both markers MUST be present in the written file or it exits non-zero so the
      build fails loudly.
    contract:
      usage: "python scripts/pwa_inject.py <path/to/bundle/index.html>"
      fragment_paths: "resolved RELATIVE to CWD (the project root) — html5/pwa.head.html, html5/pwa.body.html"
      markers: ['"PWA-lite: head fragment"', '"PWA-lite: body fragment"']
      anchors: ["</head>", "</body>"]   # inserts before the LAST occurrence of each
      exit_codes: "0 = injected OR already-present (both fine); non-zero = missing file / anchor not found / marker missing post-write"
    invariant: "Idempotency is load-bearing: the overlay runs on every build/redeploy. A non-idempotent splice would double-inject on the second run."

  - flag_id: PWAL-A4
    name: "service worker"
    path: "html5/service-worker.js"
    status: active
    role: >
      HYBRID strategy: NETWORK-FIRST for the HTML navigation (so a new deploy's
      version wins on the next load), STALE-WHILE-REVALIDATE for engine + assets
      (.wasm/.js/.arc*/.json/.png — instant + offline after one load, refreshed
      for the NEXT load). install pre-caches the CORE shell + ENGINE_BOOTSTRAP +
      archive pieces, then skipWaiting(). activate deletes stale caches +
      clients.claim(). Cross-origin + non-GET requests pass through untouched.
    key_tokens:
      - "const CACHE = 'solone-vX.Y.Z'   (line ~58; AUTO-BUMPED by bump_version.{sh,bat} in lock-step with version.lua)"
      - "CORE = ['./','./index.html','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png','./fav.ico','./cover.png']"
      - "ENGINE_BOOTSTRAP = ['./dmloader.js','./<TITLE>_wasm.js','./<TITLE>.wasm']"
    footguns_kept_closed:
      - "The index.html offline fallback is scoped to NAVIGATION requests only — an asset (.js/.wasm) fetch failure must NEVER return HTML (it would brick the engine loader)."
      - "Navigation fetch uses cache:'no-cache' so a still-fresh HTTP-cache entry can't mask a just-deployed index.html."
      - "isNavigation is decided by req.mode==='navigate' || req.destination==='document' — NEVER by sniffing the Accept header (an asset whose Accept contains text/html would be misclassified and take the HTML fallback)."
    note: "The ?sw_reset / ?sw_refresh escape hatches + the activate-time client.navigate/postMessage/BroadcastChannel rescue are pwa_backcompat's concern (trapped-user recovery), NOT part of building a fresh PWA-lite install."

  - flag_id: PWAL-A5
    name: "web app manifest"
    path: "html5/manifest.webmanifest"
    status: active
    role: "Drives installability. name/short_name, start_url './index.html', scope './', display 'fullscreen', orientation 'portrait', background/theme '#0d0d0d', 192 + 512 'any maskable' icons, a 'Play' shortcut. prefer_related_applications:false."
    invariant: "icon src paths (icons/icon-192.png, icons/icon-512.png) must match the files the overlay copies into the bundle, or Chrome rejects installability."

  - flag_id: PWAL-A6
    name: "maskable icons"
    path: "html5/icons/icon-192.png + html5/icons/icon-512.png"
    status: generated
    role: "Home-screen icons. GENERATED by bump_version.{sh,bat} from the watermarked cover.png via magick (192: -resize 154x154 -extent 192x192 on a #0d0d0d backdrop; 512: -resize 410x410 -extent 512x512). Not hand-edited — re-baked on every version bump."
    note: "Invoke magick via the Bash tool (cmd), not PowerShell (feedback_magick_terminal auto-memory — a memory, NOT a CLAUDE.md section). The canonical bake commands live in scripts/bump_version.sh (~lines 130-136) + scripts/bump_version.bat (~lines 102-105)."

  - flag_id: PWAL-A7
    name: "the Lua install bridge"
    path: "main/scene/util/install_options.lua"
    status: active
    role: >
      The Lua side of the JS install bridge + the multi-channel install/share
      dispatcher. try_pwa_install() polls window.__solone_install_prompt and
      calls .prompt(); last_install_outcome() reads window.__solone_install_outcome;
      in_game_install() routes HTML5+installable -> Chrome's native dialog, else
      opens the landing page in a NEW tab (window.open(PWA_URL, '_blank', 'noopener')).
    bridge_globals_consumed: [__solone_install_prompt, __solone_install_outcome]  # set by PWAL-A2
    hard_rule: >
      in_game_install() must NEVER sys.open_url the SAME origin the HTML5 build
      is served from — Defold's sys.open_url navigates the CURRENT tab, which is
      a full page reload mid-game (INSTALL-001). Use the 3-arg form
      window.open(url, '_blank', 'noopener') (url, target, features; the
      'noopener' feature also severs reverse-tabnabbing — see install_options.lua:142).

  - flag_id: PWAL-S1
    name: "the orchestrator overlay step (the binder)"
    path: "build_deploy_charleslike.bat (:pwa_overlay) + build_deploy_charleslike.sh (pwa_overlay())"
    status: active
    role: >
      The single build step that performs the graft. Runs AFTER :verify (operate
      on a verified bundle — the cardinal rule) and re-verifies its own result on
      disk before returning.
    exact_sequence:
      - "1. REQUIRE sources: fail if any of html5/{manifest.webmanifest,service-worker.js,pwa.head.html,pwa.body.html,icons/icon-192.png,icons/icon-512.png} is missing under the project ROOT."
      - "2. COPY into bundle root: manifest.webmanifest + service-worker.js -> <bundle>/; icons -> <bundle>/icons/ (mkdir if absent). (Closes GAP-2.)"
      - "3. SPLICE: run scripts/pwa_inject.py <bundle>/index.html from the project root. (Closes GAP-1.) Fail the build if pwa_inject.py returns non-zero."
      - "4. RE-VERIFY ON DISK: grep <bundle>/index.html for 'manifest.webmanifest' AND for 'serviceWorker.register'; assert manifest.webmanifest, service-worker.js, icons/icon-192.png, icons/icon-512.png all exist in the bundle. Fail loudly on any miss."
    invariants:
      - "Reads PWA sources from $ROOT/html5 (NOT the worktree) so a git-worktree ROLLBACK build still gets the CURRENT PWA shell."
      - "The .bat and .sh implementations must stay behavior-synchronized (mirror-drift gate BREL-008)."
      - "The overlay step's PRESENCE in the pipeline is itself an invariant — it has been reverted before (id 539). BREL-006 is the drift sentinel that keeps it wired."

# ---------------------------------------------------------------------------
# THE BUILD RECIPE — the ordered procedure an LLM follows to PRODUCE a
# working PWA-lite install. This is the "prompt" half: do these in order.
# ---------------------------------------------------------------------------
build_recipe:
  preconditions:
    - "A bundler (headless Defold/bob, or any tool) that emits its OWN index.html and does not reliably ship flat resource files."
    - "The seven artifacts authored on disk (PWAL-A1..A7). If absent, author them first from the specs above."
    - "A version SOT (version.lua) and a bump tool that rewrites the SW CACHE token in lock-step (see version_sw_coupling)."

  steps:
    - flag_id: PWAL-STEP-1
      title: "Build the bundle"
      do: "Run the build (e.g. ./build_deploy_charleslike.bat build-only). bob emits its DEFAULT index.html — expected; the overlay fixes it."
      done_when: "exit 0 AND the bundle dir exists with index.html, dmloader.js, <TITLE>.wasm (>= ~500KB), <TITLE>_wasm.js, and archive/*.{arcd,arci,dmanifest,projectc}."

    - flag_id: PWAL-STEP-2
      title: "Verify the raw bundle (pre-overlay)"
      do: "Run the bundle :verify (wasm size floor + archive pieces present). The overlay must operate only on a verified bundle (cardinal rule)."
      done_when: "verify exits 0."

    - flag_id: PWAL-STEP-3
      title: "Deliver the flat PWA files (close GAP-2)"
      do: "Copy html5/manifest.webmanifest and html5/service-worker.js into the bundle root; copy html5/icons/icon-192.png + icon-512.png into <bundle>/icons/ (mkdir first)."
      done_when: "all four files exist in the bundle at the manifest-referenced paths."

    - flag_id: PWAL-STEP-4
      title: "Splice the markup (close GAP-1)"
      do: "From the project root, run: python scripts/pwa_inject.py <bundle>/index.html. It injects pwa.head.html before </head> and pwa.body.html before </body>, idempotently."
      done_when: "pwa_inject.py exits 0 AND both markers ('PWA-lite: head fragment', 'PWA-lite: body fragment') are present in <bundle>/index.html."

    - flag_id: PWAL-STEP-5
      title: "Re-verify the grafted bundle ON DISK"
      do: "grep <bundle>/index.html for BOTH 'manifest.webmanifest' and 'serviceWorker.register'. Assert the four copied files exist. If any check fails, FAIL THE BUILD — never deploy a PWA-less bundle silently."
      done_when: "both tokens present in index.html AND all four files present; else non-zero exit."

    - flag_id: PWAL-STEP-6
      title: "Deploy"
      do: "Publish the bundle (idempotent gh-pages sync). The deployer copies the whole bundle dir, so the grafted index.html + manifest + SW + icons ride along."
      done_when: "deploy exits 0."

    - flag_id: PWAL-STEP-7
      title: "Prove it LIVE (the step on-disk checks cannot do)"
      do: >
        After deploy, HTTP-probe the public URL: GET /manifest.webmanifest -> 200,
        GET /service-worker.js -> 200 (and its body contains the current
        solone-vX.Y.Z token), GET /index.html -> 200 with 'manifest.webmanifest'
        + 'serviceWorker.register' in the body. Retry with bounded backoff for
        CDN propagation lag. (This is BREL-001.)
      done_when: "all live probes 200 and version-consistent."
      caveat: >
        This is an HTTP/header probe, NOT a render check. It licenses 'the PWA is
        DELIVERED', not 'the game RENDERS'. For a render claim use @smoke200 per
        CLAUDE.md (and never substitute on-disk gates for render evidence).

# ---------------------------------------------------------------------------
# THE INSTALL BRIDGE CONTRACT — the JS<->Lua handshake that turns the PWA into
# an in-game "Install" affordance.
# ---------------------------------------------------------------------------
install_bridge_contract:
  flag_id: PWAL-BRIDGE
  the_handshake:
    - "JS (pwa.body.html): on 'beforeinstallprompt', e.preventDefault() and stash e in window.__solone_install_prompt. On userChoice resolve, set window.__solone_install_outcome = 'installed'|'dismissed' and clear the stash. On 'appinstalled', outcome='installed'."
    - "Lua (install_options.lua): try_pwa_install() runs html5.run JS that, IF window.__solone_install_prompt exists, calls .prompt() and returns 'pending' (or 'unavailable' if no stash / gesture-gated throw). last_install_outcome() reads window.__solone_install_outcome."
    - "Lua in_game_install(): HTML5 + 'pending'/'installed' -> done; HTML5 + otherwise -> window.open(landing,'_blank','noopener') (NEW tab, never the current one); native/desktop -> the store URL."
  platform_truths:
    - "Android Chrome / Edge fire beforeinstallprompt once manifest + SW criteria are met -> programmatic Install dialog is possible."
    - "iOS Safari does NOT fire beforeinstallprompt (Apple policy) -> the only path is the manual share-sheet 'Add to Home Screen'; surface step-by-step instructions via install_options.lua M.instructions()."
    - "prompt() is user-gesture-gated: a call outside a live user-activation window throws; the bridge swallows it and reports 'unavailable' so callers fall back gracefully."

# ---------------------------------------------------------------------------
# VERSION <-> SW-CACHE COUPLING — the single most consequential string.
# ---------------------------------------------------------------------------
version_sw_coupling:
  flag_id: PWAL-VER
  rule: >
    The SW cache name (const CACHE = 'solone-vX.Y.Z' in service-worker.js) MUST
    equal version.lua's M.VERSION. bump_version.{sh,bat} rewrites BOTH in
    lock-step (and re-bakes the icons). A stale/half-applied bump leaves the
    cache name unchanged, so a new deploy can NEVER invalidate the old cache for
    installed users — they are trapped on the old bundle. (This is the exact trap
    pwa_backcompat exists to UN-stick; PWAL-VER PREVENTS it at the source.)
  enforce: >
    BREL-003 is the standing 3-way parity gate (version.lua <-> SW cache <->
    deployed bundle). Never hand-edit version.lua (CLAUDE.md); always bump via
    scripts/bump_version.sh [patch|minor|major|X.Y.Z].
  do_not: "Edit the version string inside service-worker.js by hand — keep the literal 'solone-v' prefix + X.Y.Z tail intact so the bump regex matches."

# ---------------------------------------------------------------------------
# INVARIANTS — violate any of these and the build breaks SILENTLY (green checks,
# no PWA, or a boot-loop). These are the reason this file exists.
# ---------------------------------------------------------------------------
invariants:
  - flag_id: PWAL-INV-1
    rule: "The overlay RE-VERIFIES on disk (manifest token + SW token + files present) and FAILS THE BUILD on a miss. On-disk-green-but-PWA-absent is the production_gap class; the re-verify is what catches it."
  - flag_id: PWAL-INV-2
    rule: "The splice is IDEMPOTENT via the line-1 marker comment. Re-running the overlay must be a no-op, never a double-inject."
  - flag_id: PWAL-INV-3
    rule: "The overlay runs AFTER verify, on a verified bundle (cardinal principle). Never graft onto an unverified or corrupt bundle."
  - flag_id: PWAL-INV-4
    rule: "The page-side reload-on-SW-update is GUARDED by hadController (a controller existed at load). An unguarded reload boot-loops a first-ever visit."
  - flag_id: PWAL-INV-5
    rule: "The SW navigation fallback to index.html is scoped to navigation requests ONLY. An asset fetch must never receive HTML (it bricks the engine loader)."
  - flag_id: PWAL-INV-6
    rule: "in_game_install() never sys.open_url the same origin (INSTALL-001 reload bug). New tab via window.open(url, '_blank', 'noopener') (install_options.lua:142)."
  - flag_id: PWAL-INV-7
    rule: "The SW cache name is version-coupled and bumped only by bump_version. A drift traps every installed user."
  - flag_id: PWAL-INV-8
    rule: "PWA sources are read from $ROOT/html5, not the (possibly-pruned) rollback worktree, so a HEAD~N rollback build still gets the CURRENT PWA shell."
  - flag_id: PWAL-INV-9
    rule: "The :pwa_overlay step's PRESENCE in BOTH orchestrators is an invariant (it has been reverted before, id 539). Keep .bat and .sh behavior-synchronized."

# ---------------------------------------------------------------------------
# ANTI-PATTERNS — what NOT to do (each maps to a real incident or a Defold gap).
# ---------------------------------------------------------------------------
anti_patterns:
  - "Authoring the PWA only inline in main/html5_template.html and assuming it ships. bob discards it (GAP-1). The fragments are prod SOT."
  - "Relying on bundle_resources to deliver flat html5/* files. It only ships platform-subdir files (GAP-2). Copy them explicitly in the overlay."
  - "Declaring the build done because verify() and fitness gates are green. They prove on-disk discipline, NOT live reachability. Probe the live URL (BREL-001)."
  - "Cache-first service worker. Traps returning users on a stale bundle ('only incognito works'). Stay network-first for navigation."
  - "Reloading on the FIRST controllerchange. Boot-loops a first visit. Guard on hadController."
  - "sys.open_url(same_origin) for in-game install. Reloads the current tab mid-game (INSTALL-001). New tab only."
  - "Hand-editing the SW cache name or version.lua. Breaks the bump regex / the parity gate. Use bump_version."
  - "A non-idempotent splicer. Double-injects on the second deploy. Marker-guard every fragment."

# ---------------------------------------------------------------------------
# GENERALIZE TO ANY PROJECT — the UNIVERSAL recipe, SOLONE specifics stripped.
# Hand THIS subset to an LLM working on a different bundler.
# ---------------------------------------------------------------------------
generalize_to_any_project:
  when_you_need_this: >
    Any build tool that (a) emits its OWN index.html you cannot fully template,
    and/or (b) does not reliably ship flat static files you place beside it.
    Defold/bob is one instance; some game engines, WASM toolchains, and
    static-site exporters share the shape.
  the_portable_pattern:
    - "Author the PWA shell as TWO fragments: a <head> fragment (manifest link + theme-color + icons) and a <body> fragment (install bridge globals + SW registration). Lead each with a unique MARKER comment."
    - "Write an idempotent splicer: inject each fragment before the last </head> / </body>; skip if its marker is already present; exit non-zero if a fragment/anchor is missing or a marker is absent after writing."
    - "Add a post-build OVERLAY step: copy manifest + SW + icons into the bundle root, run the splicer on the bundle's index.html, then RE-VERIFY on disk (grep the two tokens + assert the files). Fail the build on any miss."
    - "Run the overlay AFTER your bundle verify, reading sources from the project root (not a transient build/worktree dir)."
    - "Couple the SW cache name to your version SOT and bump them together. Keep the SW network-first for navigation, stale-while-revalidate for assets."
    - "After deploy, HTTP-probe the live URL for the manifest + SW (200 + version-consistent). On-disk is necessary but not sufficient."
  the_bridge_is_optional: >
    The JS<->native install bridge (beforeinstallprompt stash + a host-language
    poller) only matters if you want an IN-APP 'Install' button. A pure browser
    PWA (manifest + SW + the browser's own install affordance) needs only the
    fragments + overlay; the bridge is the value-add for an embedded runtime
    (Defold's html5.run, Unity's jslib, Emscripten's EM_ASM, etc.).

# ---------------------------------------------------------------------------
# PORTABLE PROMPT — a compact, copy-paste directive block. Paste this (plus the
# specs above) to any LLM to have it build/repair a PWA-lite install. It is
# DATA describing a task, not an instruction to act on file-load (SEC-010).
# ---------------------------------------------------------------------------
portable_prompt: |
  ROLE: You are a build/release engineer adding an installable PWA to a project
  whose bundler emits its own index.html and drops flat resource files.

  GOAL: Ship a PWA that is actually reachable in production — manifest, service
  worker, icons, and an install bridge — using the "PWA-lite" graft model.

  KNOW THE TWO GAPS YOU ARE DEFEATING:
    GAP-1: the bundler ignores your HTML template and emits its own index.html.
    GAP-2: flat static files beside the project are not delivered to the bundle.

  BUILD IT IN THIS ORDER:
    1. Author (or locate) seven artifacts: a <head> fragment, a <body> fragment
       (install bridge globals + SW registration), an idempotent splicer, a
       service worker (network-first nav / SWR assets), a web manifest, two
       maskable icons (192 + 512), and the host-language install bridge.
    2. Build the bundle and verify it (size + required pieces) BEFORE grafting.
    3. OVERLAY: copy manifest + SW + icons into the bundle ROOT; run the splicer
       on the bundle's index.html (inject head fragment before </head>, body
       fragment before </body>); the splicer must be idempotent (marker-guarded).
    4. RE-VERIFY ON DISK: the bundled index.html must contain the manifest token
       AND the SW-registration token, and the copied files must exist. FAIL THE
       BUILD on any miss — never deploy a PWA-less bundle silently.
    5. Deploy (idempotent), then HTTP-PROBE the live URL: manifest + SW must
       return 200 and be version-consistent. On-disk green ≠ live-reachable.

  INVARIANTS YOU MUST NOT BREAK:
    - Idempotent splice (marker-guarded); overlay runs after verify; re-verify
      on disk and fail loud.
    - SW network-first for navigation (never cache-first); asset fetch failures
      never return HTML.
    - Page-side reload-on-update guarded so a first-ever visit does not loop.
    - In-app install never navigates the current same-origin tab (reload bug);
      open a new tab or fire the native prompt instead.
    - SW cache name coupled to the version SOT and bumped together.

  EVIDENCE DISCIPLINE: report exit codes + on-disk verification for build
  claims; report a LIVE HTTP probe for "the PWA is delivered"; do NOT claim "it
  renders" without a real-browser render check.

# ---------------------------------------------------------------------------
# SOURCE MAP — where every claim above is grounded (for audit + refresh).
# ---------------------------------------------------------------------------
source_map:
  fragments:        "html5/pwa.head.html, html5/pwa.body.html (PRODUCTION SOT; markers on line 1 each)"
  splicer:          "scripts/pwa_inject.py (HEAD/BODY markers; rfind anchors; idempotent; exit-nonzero on failure)"
  overlay_step:     "build_deploy_charleslike.bat :pwa_overlay (label ~line 269, called ~line 124 after :verify) + build_deploy_charleslike.sh pwa_overlay() (~line 118, called ~line 161 after verify)"
  service_worker:   "html5/service-worker.js (const CACHE ~line 58; hybrid network-first/SWR; install/activate/fetch)"
  manifest:         "html5/manifest.webmanifest (fullscreen/portrait, #0d0d0d, 192+512 maskable, Play shortcut)"
  icons:            "html5/icons/icon-192.png + icon-512.png (generated by scripts/bump_version.{sh,bat} via magick)"
  lua_bridge:       "main/scene/util/install_options.lua (try_pwa_install / last_install_outcome / in_game_install; INSTALL-001 guard)"
  inventory:        "pwa_file_map.yaml (PWA-FILE-001..017, PWALITE-FILE-001..007; production_gap verified_live)"
  doc_staleness:    >
    pwa_file_map.yaml is dated 2026-06-03 and marks the pwa-lite injection model
    as REVERTED — scripts/pwa_inject.py + html5/pwa.{head,body}.html as status:
    'deleted', the :pwa_overlay step as removed. That is now STALE: those files
    EXIST on disk and the :pwa_overlay step IS wired in build_deploy_charleslike.{bat,sh}
    (the model was RE-revived after that audit). Trust THIS builder + the live
