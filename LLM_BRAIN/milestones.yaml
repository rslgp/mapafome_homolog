milestones:

  # ─────────────────────────────────────────────
  # META
  # ─────────────────────────────────────────────
  meta:
    version: "1.0"
    derived_from: "LLM_BRAIN/design_brief.yaml"
    project: "MAPA FOME"
    audience: >
      A large language model with zero prior knowledge of the project. Each
      milestone is self-contained: scope, dependencies, exit criteria, and
      explicit out-of-scope items. Execute in order. Never start milestone N+1
      while milestone N is below its exit criteria, unless the brief's
      stop_rules section says otherwise.
    ordering_principle: >
      The order is dictated by user value and dependency, not engineering
      preference. Dignity constraints (design_brief § dignity_constraints) and
      accessibility floor (§ accessibility) are present in EVERY milestone, not
      a separate one. The three-step promise (§ three_step_promise) is the
      single invariant; if any milestone would break it, the milestone changes,
      not the promise.
    stop_rules:
      - "If M1 ships and three_step_completion_rate < 50% within 2 weeks, halt all later milestones and redesign M1."
      - "If any milestone introduces a fourth required step in the reporter flow, the milestone is rejected — see design_brief § three_step_invariants."
      - "If a milestone violates any rule in design_brief § dignity_constraints, the milestone is rejected, regardless of value."

  # ─────────────────────────────────────────────
  # M0 — FOUNDATION
  # No user-visible feature. Prerequisite for every later milestone.
  # ─────────────────────────────────────────────
  m0_foundation:
    order: 0
    name: "Foundation: tokens, a11y floor, instrumentation"
    serves_user_types: ["all"]
    implements_brief_sections:
      - "visual_system (tokens)"
      - "accessibility (mandatory rules)"
      - "metrics (events_required scaffolding)"
      - "microcopy (rules: pt-BR, no English in UI)"
    scope:
      - "Create a single design tokens file (CSS custom properties) for color, spacing, radius, typography, motion, focus."
      - "Set <html lang='pt-BR'>."
      - "Add 'Pular para o mapa' skip link as first focusable element."
      - "Replace any framework default focus style with a visible 2px ring at 3:1 contrast minimum."
      - "Replace decorative or English placeholder text in the existing UI with brief.microcopy strings."
      - "Wire one analytics event (pin_report_started) end to end as a vertical proof of the events_required pipeline."
      - "Add axe-core (or equivalent) to CI; build fails on accessibility violations classified as serious or critical."
    out_of_scope:
      - "No new features."
      - "No copy rewrites beyond the strings already in microcopy."
      - "No marker redesign — that is M2."
    exit_criteria:
      - "Lighthouse accessibility score ≥ 95 on the home route."
      - "axe-core reports 0 serious/critical violations on home route."
      - "All hardcoded hex colors and px spacing in components removed (grep returns 0 matches in /components)."
      - "pin_report_started fires and is visible in the analytics dashboard."
    dependencies: []
    risks:
      - "Token migration touches many files — schedule before any visual work to avoid double rework."

  # ─────────────────────────────────────────────
  # M1 — THE THREE-STEP REPORTER FLOW
  # The product's core promise. Everything else is secondary.
  # ─────────────────────────────────────────────
  m1_three_step_reporter_flow:
    order: 1
    name: "Three-step reporter flow (click map → choose category → confirm)"
    serves_user_types: ["reporter"]
    implements_brief_sections:
      - "three_step_promise (steps 1, 2, 3)"
      - "screens.map_home"
      - "screens.report_sheet"
      - "microcopy.step_prompts"
      - "microcopy.optional_fields"
      - "microcopy.errors"
    scope:
      step_1_click_on_map:
        - "Map fills the viewport on landing. No splash, no modal, no carousel."
        - "Map auto-centers on user GPS after permission. Fallback: last viewed region, then Recife (PE)."
        - "Pill-shaped search bar at the top of the map for address lookup."
        - "Long-press OR a [Relatar] header button OR a mobile FAB (60×60, bottom-right) opens the report sheet at the tapped location."
        - "On tap, marker placeholder appears within 100ms with scale 0 → 1.1 → 1.0 over 240ms (ease-out-back)."
      step_2_category_sheet:
        - "Bottom sheet on mobile (70% initial height, draggable to 95%); right-side panel on desktop (400px)."
        - "Map remains visible behind the sheet at all times."
        - "Category chips are icon + label pairs, multi-select, with checked state shown by checkmark + filled background (not color alone)."
        - "Categories: comida, agua, roupa, higiene, abrigo (per brief.three_step_promise.step_2_click_on_category.categories)."
        - "Collapsed expander 'Adicionar detalhe (opcional)' with the placeholder example from microcopy."
        - "Collapsed expander 'Seu contato — opcional' with the helper line from microcopy.optional_fields.contact_helper."
        - "Reporter contact accepts phone, WhatsApp link, Instagram handle, or email with no rigid format validation."
      step_3_confirm:
        - "Single primary [Publicar ponto] button. Every other element on the sheet is secondary or tertiary weight."
        - "On tap: button immediately switches to 'Publicando…' state with inline spinner (within 100ms)."
        - "On success: button shows 'Publicado ✓' for 1.2s; sheet closes; map re-centers on the new pin with one ping-ring (600ms, no loop)."
        - "On failure: button reverts to 'Publicar ponto'; inline error above it uses microcopy.errors.publish_failed."
      validation:
        - "If user taps confirm with zero categories, show inline above the chips: microcopy.errors.at_least_one_category. Do not block the entire sheet."
    out_of_scope:
      - "Donor flow (claim, mark as attended) is M3."
      - "Marker urgency-age visual encoding is M2 — keep current markers for now."
      - "Initiatives registration is M6."
    exit_criteria:
      - "From cold landing to published pin completes in ≤ 5 taps and ≤ 40 seconds for a tester following the flow."
      - "three_step_completion_rate ≥ 75% across 100+ unique users in the first 14 days post-launch (brief.metrics.primary_success_metric)."
      - "pin_report_published event includes categories[], has_detail, has_contact, time_from_start_ms."
      - "Lighthouse mobile performance ≥ 80 on the report flow."
    dependencies: ["m0_foundation"]
    risks:
      - "Existing MainControls form has 6 radios + 3 dropdowns. Migrating without breaking the Google Sheets write path requires careful payload mapping."
      - "Bottom sheet UX on Leaflet maps requires preventing accidental map gestures behind the sheet — test on iOS Safari specifically."

  # ─────────────────────────────────────────────
  # M2 — MAP CLARITY (URGENCY-AGE, STATUS, TIME-SINCE)
  # ─────────────────────────────────────────────
  m2_map_clarity:
    order: 2
    name: "Map marker system: urgency-age, status, time-since"
    serves_user_types: ["donor", "reporter"]
    implements_brief_sections:
      - "visual_system.markers"
      - "microcopy.pin_detail (waiting / someone_going / attended_today)"
    scope:
      - "Two-axis marker encoding: urgency-age via ring thickness + color; type via interior glyph (circle = person, house = initiative)."
      - "Urgency thresholds: fresh < 2h (thin ring, urgency_fresh), waiting 2–6h (medium, urgency_waiting), stale > 6h (thick, urgency_stale), done (urgency_done at 40% opacity, persists 24h then archived)."
      - "Pin appearance motion: 240ms ease-out-back."
      - "Context bar above or below the map: 'X pontos em 2 km · Y aguardando há mais de 6h'."
      - "Tapping a pin opens a placeholder pin sheet (full content lands in M3)."
    out_of_scope:
      - "Heat maps, density overlays, aggregate visualizations — see anti_patterns.heat_map_of_poverty."
      - "Donor claim mechanics — that is M3."
    exit_criteria:
      - "User test (n=5) can correctly identify a stale pin vs a fresh pin without using color alone (verified by simulating monochrome rendering)."
      - "Marker rendering does not loop any animation (visual audit + automated check on the marker layer)."
      - "Context bar count updates live without page reload."
    dependencies: ["m1_three_step_reporter_flow"]
    risks:
      - "Time-based color rotation requires server time as the source of truth, not client clock. Otherwise off-clock users see wrong urgency."

  # ─────────────────────────────────────────────
  # M3 — DONOR RESPONSE (PIN DETAIL, CLAIM, ATTENDED)
  # ─────────────────────────────────────────────
  m3_donor_response:
    order: 3
    name: "Donor response: pin detail, soft claim, mark as attended"
    serves_user_types: ["donor"]
    implements_brief_sections:
      - "screens.pin_detail_sheet"
      - "microcopy.pin_detail"
    scope:
      - "Pin detail sheet content: category icons row, time since pinned (javascript-time-ago), walking distance + ETA, optional detail, reporter contact as tap-to-call/message button (never raw text)."
      - "Status chip: 'Aguardando' / 'Alguém a caminho' / 'Atendido hoje' — colors paired with text."
      - "Primary action [Estou indo agora] places a soft claim for 30 minutes. Visible claim count to all donors. Soft, not hard — multiple claims allowed by design."
      - "Secondary action [Como chegar] opens native maps with directions."
      - "After claim: [Marcar como atendido] replaces the primary action."
      - "After mark attended: pin desaturates + fades to 40% opacity over 400ms; persists 24h then archives. Toast: microcopy.pin_detail.after_mark_attended."
      - "No rating, no photo upload, no celebration after attended — see dignity_constraints.never_gamify."
    out_of_scope:
      - "Hard locks, exclusive claims, queue mechanics."
      - "Reviews or ratings of donors or pins."
    exit_criteria:
      - "pin_claim_started and pin_marked_attended events fire with the documented properties."
      - "Soft claim does not block a second donor from also acting on the same pin."
      - "Reporter contact appears only as a tap-to-action affordance, never as displayable PII text."
    dependencies: ["m2_map_clarity"]
    risks:
      - "Soft claim model accepts duplicate trips by design — communicate this to donors so they do not feel misled."

  # ─────────────────────────────────────────────
  # M4 — ACCESSIBLE ALTERNATIVE (LIST VIEW + KEYBOARD)
  # ─────────────────────────────────────────────
  m4_accessible_alternative:
    order: 4
    name: "Accessible list view + keyboard/screen reader path"
    serves_user_types: ["donor", "reporter"]
    implements_brief_sections:
      - "screens.list_view"
      - "accessibility (mandatory + accepted_deferrals)"
    scope:
      - "Tab on the context bar (or 'Lista' tab) opens a sorted list view: ranking = (distance × 0.6) + (age × 0.4)."
      - "Each row: category icons, distance, time-since, status chip, detail preview (truncated 80 chars), chevron."
      - "Tapping a row opens the same pin sheet from M3."
      - "Live updates announced via aria-live='polite' region: 'Novo ponto publicado' / 'Ponto atendido'."
      - "Bottom sheets and modals trap focus on open and return focus on close."
      - "Manual screen reader testing with NVDA (Windows) and VoiceOver (iOS)."
    out_of_scope:
      - "Full keyboard panning of the Leaflet map — list view is the documented alternative (accessibility.accepted_deferrals)."
    exit_criteria:
      - "axe-core reports 0 serious/critical violations on every screen."
      - "A keyboard-only user can: open the report flow, select a category, publish a pin; or open the list, pick a pin, claim it."
      - "Screen reader announces all status changes within 1 second of UI update."
    dependencies: ["m3_donor_response"]
    risks:
      - "Live region noise — limit announcements to events the donor needs to know about, not every pin update."

  # ─────────────────────────────────────────────
  # M5 — EMPTY AND ERROR STATES
  # ─────────────────────────────────────────────
  m5_empty_and_error_states:
    order: 5
    name: "Designed empty states and resilient errors"
    serves_user_types: ["all"]
    implements_brief_sections:
      - "microcopy.empty_states"
      - "microcopy.errors"
      - "implementation_protocol.mandatory_component_states"
    scope:
      - "Empty state in viewport with no pins: semi-transparent overlay using empty_states.no_pins_in_view + direct [Relatar] button."
      - "Empty state in fully empty product: empty_states.no_pins_anywhere."
      - "Empty state for zero search results: empty_states.search_zero_results."
      - "GPS denied: errors.gps_denied with action to use search input."
      - "Offline detection: errors.offline; queue the publish for retry when connection returns (no service worker required for queue, just session memory)."
      - "Sheets API timeout (>10s): errors.server_slow; prevent double-submit via idempotency check before any retry."
      - "Every async action has loading state within 100ms; no infinite spinner — 10s timeout falls back to error with retry."
    out_of_scope:
      - "Full PWA offline support — that is M7."
    exit_criteria:
      - "Every empty container in the product has a designed empty state with context, reason, and a next action."
      - "Disconnecting the network during publish does not lose user input. Reconnecting offers retry."
      - "No spinner in the product runs longer than 10 seconds without a fallback."
    dependencies: ["m4_accessible_alternative"]
    risks:
      - "Idempotency requires a client-side key on the publish payload — coordinate with the Sheets write layer."

  # ─────────────────────────────────────────────
  # M6 — SOLIDARITY INITIATIVES
  # ─────────────────────────────────────────────
  m6_solidarity_initiatives:
    order: 6
    name: "Initiatives registration and visibility"
    serves_user_types: ["initiative"]
    implements_brief_sections:
      - "screens.initiatives_register"
      - "users.initiative"
    scope:
      - "Route /iniciativas/cadastrar with fields: nome, categorias, endereço/localização no mapa, dias e horários, contato (WhatsApp/Instagram/email)."
      - "Initiative pins use the house silhouette glyph from M2 (visual_system.markers.type_axis)."
      - "Link from footer and from a dedicated section in the info page. Never in the primary header — Hick's Law (anti_patterns reasoning)."
      - "Initiative detail sheet shows schedule, contact, and a [Como chegar] button."
    out_of_scope:
      - "Initiative ratings or reviews — see dignity_constraints.never_rank_worth."
      - "Initiative accounts with login — defer until volume justifies."
    exit_criteria:
      - "An initiative can complete registration in ≤ 6 fields with no email verification required."
      - "Initiative pins are visually distinguishable from individual person pins without color alone."
    dependencies: ["m5_empty_and_error_states"]
    risks:
      - "No moderation layer in MVP — accept that initiatives self-declare and document this clearly."

  # ─────────────────────────────────────────────
  # M7 — OFFLINE / PWA
  # ─────────────────────────────────────────────
  m7_offline_pwa:
    order: 7
    name: "Offline-resilient publishing and PWA install"
    serves_user_types: ["reporter", "donor"]
    implements_brief_sections:
      - "users.reporter (device: 'sometimes in motion, sometimes emotional, often on mobile data')"
    scope:
      - "Service worker caches the app shell, map tiles within the user's last viewport, and pin data."
      - "Publish queue persists in IndexedDB; flushes when online; success/failure surfaces a toast on next foreground."
      - "Web app manifest enables 'Add to home screen' with the wordmark icon."
    out_of_scope:
      - "Native iOS/Android apps."
      - "Background sync push notifications — that is M8."
    exit_criteria:
      - "User can open the app without network, tap the map, fill the sheet, and the pin publishes within 60s of reconnection."
      - "Lighthouse PWA score ≥ 90."
    dependencies: ["m6_solidarity_initiatives"]
    risks:
      - "Map tile caching has licensing implications — verify against the OSM tile usage policy referenced in the existing code (operations.osmfoundation.org)."

  # ─────────────────────────────────────────────
  # M8 — OPT-IN PUSH NOTIFICATIONS
  # ─────────────────────────────────────────────
  m8_opt_in_notifications:
    order: 8
    name: "Donor opt-in notifications (radius, frequency)"
    serves_user_types: ["donor"]
    implements_brief_sections:
      - "anti_patterns.push_notifications_by_default (the inverse of)"
    scope:
      - "Donor explicit opt-in screen with per-radius (1–10 km) and per-frequency (immediate, hourly digest, daily digest) controls."
      - "Default state: OFF."
      - "Each notification deep-links to the pin detail sheet, one tap to act."
    out_of_scope:
      - "Notifications to reporters (would re-engage anonymous users — out of model)."
    exit_criteria:
      - "Notifications are off by default for every new donor."
      - "Opt-out is reachable in ≤ 2 taps from any received notification."
    dependencies: ["m7_offline_pwa"]
    risks:
      - "Permission prompt fatigue — only request permission after a donor has acted on at least one pin."

  # ─────────────────────────────────────────────
  # M9 — i18n SCAFFOLDING (DEFERRED)
  # ─────────────────────────────────────────────
  m9_i18n_scaffolding:
    order: 9
    name: "Internationalization scaffolding (Spanish first)"
    serves_user_types: ["all"]
    implements_brief_sections:
      - "product_essence.primary_language (Portuguese remains primary)"
    scope:
      - "Extract all strings from microcopy into a typed dictionary keyed by id."
      - "Add a runtime locale switch (default pt-BR, no auto-detect to avoid dignity-tone mismatch in machine translation)."
      - "Ship Spanish (es) as the second locale, professionally translated, never machine-translated."
    out_of_scope:
      - "Right-to-left languages until concrete demand surfaces."
    exit_criteria:
      - "100% of UI strings sourced from the dictionary; grep for inline Portuguese strings in components returns 0 hits."
      - "Locale switch persists across sessions."
    dependencies: ["m8_opt_in_notifications"]
    risks:
      - "Machine translation of dignity-sensitive copy will produce harmful tone — budget for human translation."

  # ─────────────────────────────────────────────
  # ALWAYS-ON CONSTRAINTS
  # These are not milestones. They apply to every milestone above.
  # ─────────────────────────────────────────────
  always_on:
    dignity:
      - "Never collect photos, names, age, gender, or health status of mapped people."
      - "Never display reporter identity publicly."
      - "Never gamify (no badges, streaks, leaderboards, share prompts after action)."
      - "Never let a user-selected urgency level rank human worth."
    accessibility:
      - "WCAG 2.2 floor on every milestone, not retrofitted."
      - "axe-core in CI blocks deployment on serious/critical violations."
    performance:
      - "Lighthouse mobile performance ≥ 80 maintained at every milestone."
      - "First Contentful Paint ≤ 2s on a mid-tier Android over 3G."
    measurement:
      - "Every milestone defines its success metric before any code is written."
      - "If a milestone ships and the metric does not move within 2 weeks, redesign or remove."
