v5_milestones:

  # ─────────────────────────────────────────────
  # META
  # ─────────────────────────────────────────────
  meta:
    version: "1.0"
    derived_from: "LLM_BRAIN/v5_0_compact_software_engineer_principles.yaml"
    audit_input: "LLM_BRAIN/v5_audit.yaml"
    sequenced_after: "LLM_BRAIN/milestones.yaml (M0–M9 product) and bugfixes.yaml (B1–B19)"
    project: "MAPA FOME"
    purpose: >
      Sequenced engineering-quality milestones derived from v5 principles
      and the current LOC inventory. Distinct from milestones.yaml (product
      features) and bugfixes.yaml (defect tracking). Each VM milestone has
      one v5 section as primary anchor, measurable exit criteria, and
      explicit dependencies on prior milestones.
    ordering_principle: >
      v5 § implementation_order is the source of ordering. Testing & error
      handling (1) come before architecture (2). Architecture before
      security retrofits (3). DRY/KISS/Naming (4) before defensive
      programming (5). TD management (6) before CI/CD (7). Observability
      (8) before API standards (9). Each milestone is a Type-2 reversible
      decision unless flagged Type-1 (needs ADR per § decision_frameworks).
    stop_rules:
      - "If a milestone would increase TD density >10%, stop and re-plan (v5 § technical_debt.workflow)."
      - "If a milestone breaks the M1 three-step reporter promise, the milestone is rejected (milestones.yaml § stop_rules)."
      - "If a milestone takes >2 weeks of single-engineer time, decompose further."

  # ─────────────────────────────────────────────
  # LOC INVENTORY (snapshot)
  # ─────────────────────────────────────────────
  loc_snapshot:
    captured: "2026-04-25, after v5_audit pass_2"
    method: "wc -l on src/ + public/ excluding node_modules/.next, sorted desc"
    over_ideal_500:
      - { path: "src/app/components/compatibility/App.js", loc: 1206 }
      - { path: "src/app/components/compatibility/App.css", loc: 655 }
    in_warning_300_500:
      - { path: "src/app/components/compatibility/components/ux/reports.js", loc: 470 }
      - { path: "src/app/components/compatibility/components/ux/ReportSheet.css", loc: 416 }
      - { path: "src/app/components/compatibility/components/InfoPanel.css", loc: 397 }
      - { path: "src/app/relatorios/page.js", loc: 394 }
      - { path: "src/app/components/compatibility/components/ux/GuidedTutorial.js", loc: 368 }
      - { path: "src/app/components/compatibility/components/map.js", loc: 321 }
      - { path: "src/app/components/compatibility/components/ux/ReportSheet.js", loc: 311 }
    healthy_under_300: "All other files (≤300 LOC) — no v5 size action this cycle."
    repo_total_tracked_loc: 13257

  # ─────────────────────────────────────────────
  # VM0 — TEST SCAFFOLDING (PREREQUISITE)
  # v5 § implementation_order step 1 — Testing & error handling
  # v5 § refactoring_patterns.principle: pass test suite before refactoring
  # v5 § context_adjustments.legacy: characterization tests first
  # ─────────────────────────────────────────────
  vm0_test_scaffolding:
    order: 0
    status: "shipped (partial)"
    shipped_in_pass:
      - "package.json: vitest, @testing-library/react, @testing-library/dom, jsdom, @vitest/coverage-v8 added; scripts test/test:watch/test:coverage/fitness wired"
      - "vitest.config.mjs with jsdom env + coverage thresholds (70%) on googlesheets/sponsors/regionResolver"
      - "test/setup.js: stubs visualViewport, matchMedia, IntersectionObserver"
      - "test/sheetsClient.test.js: 7 characterization tests covering appendRow auth dedupe, getSheet bounds, updatePinDadosByCoords mutation/null/malformed JSON paths"
      - "test/sponsors.test.js: parseDate + isActiveNow + isInsideReach"
      - "test/sheetsValidators.test.js: VM6 validators"
      - "test/domain.test.js: VM10 Coordinates + Telefone"
    pending:
      - "Run npm install + npm test on a clean clone to confirm green"
      - "Characterization tests for handleClickMap, writePinToSheets, componentDidMount fetch — these unblock VM1+ extraction"
    name: "Vitest + RTL + characterization tests for the M1 reporter hot path"
    v5_anchors:
      - "§ testing_strategy.first_principles (F.I.R.S.T)"
      - "§ refactoring_patterns.safety_practices.run_full_test_suite_between_each_step"
      - "§ context_adjustments.legacy"
    rationale: >
      Every later VM milestone depends on a passing test suite. Without it,
      v5 § refactoring_patterns.principle is violated and the recent iOS
      regression cycle (changelog.yaml § ios_blue_pin_misplaced_fix) repeats.
    scope:
      - "Add devDependencies: vitest, @testing-library/react, @testing-library/dom, jsdom, @vitest/ui"
      - "vitest.config.js with jsdom env, jsx transform, alias for @ → src/app"
      - "Smoke tests: App component mounts; map renders; FAB visible"
      - "Characterization tests for sheetsClient.js (mock GoogleSpreadsheet, assert appendRow + updatePinDadosByCoords behavior)"
      - "Characterization tests for the 4 remaining auth-block callsites in App.js (handleClickMap, writePinToSheets×2, componentDidMount fetch) — record current behavior including error paths"
      - "CI step: `npm test` blocks PR merge on failure"
    out_of_scope:
      - "E2E / Playwright (defer to VM7 once API surfaces stabilize)"
      - "Visual regression (Percy/Chromatic) — too much overhead for current scale"
    exit_criteria:
      - "vitest run completes <30s green on a clean clone"
      - "Coverage on src/app/components/compatibility/components/googlesheets/ ≥ 80% (v5 § critical_metrics.testing.coverage)"
      - "Smoke test asserts App mounts without throwing (catches the SponsorSlot TDZ-class bug we just hit)"
      - "GitHub Actions runs vitest on every push to homolog/main"
    dependencies: []
    estimated_effort: "2-3 days"
    risk_level: "low (additive, no production code modified)"
    type: "Type-2 (reversible)"

  # ─────────────────────────────────────────────
  # VM1 — FINISH SHEET I/O EXTRACTION
  # v5 § DRY (rule_of_three), § anti_patterns.copy_paste
  # ─────────────────────────────────────────────
  vm1_finish_sheets_extraction:
    order: 1
    status: "deferred — pending VM0 tests to be proven green by `npm install && npm test`"
    why_deferred: >
      The 4 remaining auth blocks (handleClickMap, writePinToSheets×2,
      componentDidMount fetch) are the M1 reporter hot path. v5 §
      refactoring_patterns.principle requires a passing test suite.
      Tests are written (VM0 shipped) but not yet executed against the
      actual codebase in this pass.
    name: "Eliminate the remaining 4 useServiceAccountAuth blocks in App.js"
    v5_anchors:
      - "§ refactoring_patterns.when_to_refactor.rule_of_three"
      - "§ critical_metrics.maintainability.duplication (<3%)"
      - "§ solid_quick.SRP"
    rationale: >
      v5_audit pass_1 + pass_2 closed 9 of 13 callsites. The remaining 4
      (handleClickMap, writePinToSheets×2, componentDidMount fetch) live in
      the M1 reporter hot path. With VM0's tests in place, this becomes
      mechanical.
    scope:
      - "Migrate handleClickMap publish flow to sheetsAppendRow(0, row)"
      - "Migrate writePinToSheets to use sheetsAppendRow + preserve existing 10s timeout via Promise.race wrapper"
      - "Migrate componentDidMount initial fetch to sheetsGetSheet(0).getRows() — keep the envVariables.rows cache"
    out_of_scope:
      - "Rewriting the reporter publish flow itself (that is VM3)"
      - "Changing idempotency_key semantics (covered by bugfixes.yaml B12)"
    exit_criteria:
      - "grep -c useServiceAccountAuth src/app/components/compatibility/App.js → 0"
      - "All VM0 tests still green"
      - "App.js LOC < 1150 (down from 1206)"
    dependencies: ["vm0_test_scaffolding"]
    estimated_effort: "1 day"
    risk_level: "medium (touches publish hot path)"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM2 — APP.JS BOOTSTRAP DECOMPOSITION
  # v5 § solid_quick.SRP, § architecture_boundaries.humble_object_pattern
  # ─────────────────────────────────────────────
  vm2_bootstrap_decomposition:
    order: 2
    status: "deferred — high-risk extraction blocked on VM0 green + VM1"
    why_deferred: "componentDidMount is 480 LOC and wires geolocation, sheets, sponsors, tour, debug helpers, SW registration. Per v5 § refactoring_patterns.safety_practices, this needs the full test suite running between each step."
    name: "Extract componentDidMount → appBootstrap.js services"
    v5_anchors:
      - "§ critical_metrics.size.functions (current componentDidMount ~480 LOC, hard limit 100)"
      - "§ architecture_boundaries.humble_object_pattern"
      - "§ solid_quick.SRP"
      - "§ refactoring_patterns.code_smells_catalog.long_method"
    rationale: >
      A 480-LOC method exceeds v5 hard limit by ~5x. It mixes geolocation,
      IP→region detection, cookie hydration, sheet preload, sponsor init,
      tour state, debug-helper installation, and service worker registration.
      Each is its own concern.
    scope:
      - "Create src/app/components/compatibility/services/appBootstrap.js"
      - "Extract: geolocateUser(state) — wraps navigator.geolocation, returns Promise<[lat,lng] | null>"
      - "Extract: hydrateFromCookies() — reads pontosAvaliados cookie etc., returns initial state slice"
      - "Extract: preloadSheets() — primes envVariables.rows via sheetsClient"
      - "Extract: installDebugHelpers(envVariables) — moves window.fixarPonto/window.stats out of componentDidMount"
      - "componentDidMount becomes an orchestrator: <40 LOC, calling each service sequentially"
    out_of_scope:
      - "Moving to functional component (that is VM4)"
      - "Replacing window.geolocation with a permission-prompt UI (defer)"
    exit_criteria:
      - "componentDidMount ≤ 40 LOC (v5 § critical_metrics.size.functions ideal ≤20)"
      - "appBootstrap.js exports ≥4 named services, each ≤65 LOC"
      - "VM0 tests green; smoke test still asserts App mount"
      - "App.js < 850 LOC"
    dependencies: ["vm0_test_scaffolding", "vm1_finish_sheets_extraction"]
    estimated_effort: "3-4 days"
    risk_level: "high (touches the boot path that wires everything)"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM3 — REPORTER PUBLISH FLOW EXTRACTION
  # v5 § humble_object_pattern, § solid_quick.SRP
  # ─────────────────────────────────────────────
  vm3_publish_flow_extraction:
    order: 3
    status: "deferred — M1 reporter promise depends on this; needs tests + VM1"
    why_deferred: "handleClickMap is ~94 LOC mixing UI ping, region check, sheet write, idempotency. The recent iOS regression cycle (changelog.yaml § ios_blue_pin_misplaced_fix) shows how brittle this path is — tests must come first."
    name: "Extract handleClickMap publish flow → publishPinFromMap.js"
    v5_anchors:
      - "§ architecture_boundaries.humble_object_pattern (separate UI from publish logic)"
      - "§ solid_quick.SRP"
      - "§ critical_metrics.size.functions (handleClickMap ~94 LOC, ≤65 good)"
    rationale: >
      handleClickMap mixes coordinate resolution, regional bounds check,
      sheet write, idempotency tracking, error toast, and pingCoords UI.
      Per Humble Object pattern, the testable publish logic should live
      separately from the React state side.
    scope:
      - "Create src/app/components/compatibility/services/publishPinFromMap.js"
      - "publishPin({ coords, payload, onSuccess, onError, onTimeout }) — pure-ish function"
      - "App.handleClickMap reduces to: validate → call publishPin → reflect result in state"
    out_of_scope:
      - "Changing the payload schema (still { Roaster, Categorias, ... })"
    exit_criteria:
      - "handleClickMap ≤ 30 LOC"
      - "publishPinFromMap.js has unit tests covering: success, network timeout, region-out-of-bounds, idempotency dedupe (paired with B12)"
    dependencies: ["vm0_test_scaffolding", "vm1_finish_sheets_extraction"]
    estimated_effort: "2 days"
    risk_level: "high (M1 promise depends on this)"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM4 — APP CLASS → FUNCTIONAL OR STATE-MACHINE
  # v5 § decision_frameworks.type1_type2 (Type 1 — needs ADR)
  # ─────────────────────────────────────────────
  vm4_app_paradigm_change:
    order: 4
    status: "deferred — Type-1 decision; ADR-002 drafted but not yet Accepted"
    why_deferred: "v5 § decision_frameworks.type1_type2 — irreversible direction. ADR-002 is now Proposed; Acceptance gates execution. Recommended Option B (functional with hooks) but only after VM0-VM3 land."
    name: "App component paradigm: class → functional, or hand-rolled state machine"
    v5_anchors:
      - "§ decision_frameworks.type1_type2 (Type-1)"
      - "§ adrs"
      - "§ rfc_process"
    rationale: >
      App.js is a 1206-LOC class. After VM2 + VM3 extractions it should
      be ~600-700 LOC, but the class boilerplate (binding, this references,
      lifecycle methods) still adds friction. Functional component with
      hooks aligns with React 19 idioms. A state machine (XState or
      hand-rolled) would also formalize the implicit state transitions
      already embedded in this.state.
    scope:
      - "Author ADR-002 (already proposed in v5_audit.yaml). Three alternatives: (a) keep class + extract more services, (b) port to functional with hooks, (c) hand-rolled state machine module"
      - "Write RFC if estimated effort >6 months (v5 § rfc_process.when)"
      - "Implementation only after ADR is Accepted"
    out_of_scope:
      - "XState dependency without explicit ADR signoff (Type-1 framework choice)"
    exit_criteria:
      - "ADR-002 Accepted with min 2 alternatives + trade-offs (v5 § adrs.format)"
      - "VM0 tests still green after migration"
      - "App.js LOC ≤ 500 (v5 § critical_metrics.size.files ideal)"
    dependencies: ["vm2_bootstrap_decomposition", "vm3_publish_flow_extraction"]
    estimated_effort: "5-7 days post-ADR"
    risk_level: "high"
    type: "Type-1 (irreversible)"

  # ─────────────────────────────────────────────
  # VM5 — APP.CSS DECOMPOSITION
  # v5 § critical_metrics.size.files; § anti_patterns.shotgun_surgery
  # ─────────────────────────────────────────────
  vm5_app_css_decomposition:
    order: 5
    status: "deferred — needs visual regression coverage before CSS surgery"
    why_deferred: "App.css mixes leaflet overrides + main layout + mobile breakpoints. Without screenshot diffs we can't safely split. VM0 ships unit tests, not visual. Defer until either Percy/Chromatic budget is approved OR a manual smoke checklist is documented."
    name: "App.css 655 LOC → per-feature CSS files"
    v5_anchors:
      - "§ critical_metrics.size.files (>500 = over ideal)"
      - "§ refactoring_patterns.code_smells_catalog.divergent_change"
      - "§ solid_quick.SRP"
    rationale: >
      App.css collects rules for header, map container, leaflet overrides,
      footer, mobile breakpoints, FAB, and several feature-specific selectors.
      Per Divergent Change smell, one CSS file changing for many reasons.
    scope:
      - "Move .leaflet-* rules to leafletOverrides.css imported by map.js"
      - "Move .mdf-main and main layout rules to a layout.css imported by App.js"
      - "Move mobile breakpoint section to media-queries.css OR colocate per component"
      - "Verify visual regression manually on home, /relatorios, /parceiros"
    out_of_scope:
      - "Migration to CSS-in-JS or CSS Modules (Type-1 — defer)"
      - "Replacing the design tokens (already in tokens.css)"
    exit_criteria:
      - "App.css ≤ 300 LOC"
      - "No file under src/app/components/ exceeds 500 LOC"
      - "Manual smoke test: home, /relatorios, /parceiros visually unchanged"
    dependencies: ["vm0_test_scaffolding"]
    estimated_effort: "2 days"
    risk_level: "low (CSS only, easy to revert)"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM6 — DEFENSIVE BARRICADE FOR SHEET INPUTS
  # v5 § defensive_programming.barricade_pattern
  # ─────────────────────────────────────────────
  vm6_input_barricade:
    order: 6
    status: "shipped (validators in place; consumers still bypass)"
    shipped_in_pass:
      - "sheetsClient.js: SheetsValidationError, validateCoordinatePair (BR bbox), validateRating (1-5), validateTelefoneBR (10/11 digits, +55 stripping), validatePinPayload"
      - "test/sheetsValidators.test.js: 4 describe blocks covering accept + reject paths"
    pending:
      - "Wire validatePinPayload into appendRow (currently just exported; callers don't invoke yet) — needs VM0 tests proven green first to avoid a regression in the publish path"
    name: "Input validation barricade at sheet-write boundary"
    v5_anchors:
      - "§ defensive_programming.barricade_pattern"
      - "§ defensive_programming.practices"
      - "§ best_practices.error_handling"
      - "bugfixes.yaml B15 (telefone format)"
    rationale: >
      sheet I/O accepts whatever App.js passes today. Phone numbers, ratings,
      categories — none are validated at the boundary. Per v5 § defensive_programming,
      a barricade at the module entry sanitizes once. Eliminates a class of
      bad-data-into-Sheets bugs.
    scope:
      - "Add validators in sheetsClient.js: validatePinPayload, validateRating, validateCoordinatePair"
      - "appendRow / updatePinDadosByCoords reject with a typed error if validation fails"
      - "Callers either fix-up before calling or surface a pt-BR error toast"
      - "Bake B15 phone validation into validatePinPayload"
    exit_criteria:
      - "100% of sheet writes pass through a validator"
      - "Unit tests cover: missing Coordinates, malformed JSON Dados, out-of-range rating, invalid telefone"
      - "Reports.js k-anonymity counts no longer inflate due to bad rows (manual audit on 1k row sample)"
    dependencies: ["vm0_test_scaffolding", "vm1_finish_sheets_extraction"]
    estimated_effort: "1-2 days"
    risk_level: "low"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM7 — OBSERVABILITY BASELINE
  # v5 § observability, § implementation_order step 8
  # ─────────────────────────────────────────────
  vm7_observability_baseline:
    order: 7
    status: "shipped (partial — App.js paths wired)"
    shipped_in_pass:
      - "analytics.js: trackError(category, error, props) — strips token-shaped substrings, mirrors to console.error, fires structured 'error' event with category"
      - "App.js: contabilizarClicado, clicouTelefone, entregarAlimento — 3 silent .catch blocks now call trackError('pin_update', ...) with a per-op label"
    pending:
      - "Wire trackError into the 4 remaining auth-block callsites once VM1 lands"
      - "Define the 3 SLIs (publish success rate, tap→pin <500ms, sheet read success rate) on a dashboard"
      - "Pick log aggregation: Sentry free tier OR sheet-backed errors sheet"
    name: "Structured client-side analytics + error logs (not full telemetry)"
    v5_anchors:
      - "§ observability.three_pillars.logs"
      - "§ observability.alerting.principle (alert on symptoms)"
      - "§ outcomes.observability (60% MTTR reduction)"
      - "§ best_practices.error_handling — never swallow exceptions silently"
    rationale: >
      The codebase uses console.log/console.error sporadically; many
      sheet-I/O catch blocks log nothing. After bug-hunt cycles like the
      iOS map regressions, lack of structured events meant we relied on
      user reports. Per v5 § outcomes.observability, structured logging
      reduces MTTR 60%.
    scope:
      - "Define analytics.fireEvent({ name, props }) — already exists; ensure all sheet-I/O failures fire pin_publish_failed / pin_update_failed events"
      - "Adopt one log aggregation: Sentry (free tier covers this scale) OR a Sheets-backed errors sheet (zero infra, fits the no-backend pattern)"
      - "Define 3 SLIs: pin publish success rate, map-tap → blue pin <500ms, sheet read success rate"
      - "Do NOT add OpenTelemetry / Jaeger — overkill for static-export scale"
    out_of_scope:
      - "Full SLO + error budget process (defer until traffic justifies it)"
    exit_criteria:
      - "Every catch{} block in src/app/components/compatibility either logs structured event OR has a comment justifying the silence"
      - "3 SLIs measurable from a single dashboard URL"
      - "Manual fault injection: kill network, observe pin_publish_failed event lands in dashboard within 30s"
    dependencies: ["vm6_input_barricade"]
    estimated_effort: "2-3 days"
    risk_level: "low (additive)"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM8 — ADR-001: PUBLIC SHEETS CREDENTIALS
  # v5 § secrets_management — currently NEVER violated
  # v5 § decision_frameworks.type1_type2 (Type-1)
  # ─────────────────────────────────────────────
  vm8_secrets_adr:
    order: 8
    status: "shipped (ADR drafted, awaiting Acceptance)"
    shipped_in_pass:
      - "LLM_BRAIN/adr/ADR-001-public-sheets-credentials.md — full STRIDE pass, 3 options, recommended Option A (accept-with-controls) with 6 action items + 6-month re-evaluation triggers"
      - "LLM_BRAIN/adr/ADR-002-app-paradigm.md — class vs functional vs state-machine, recommended Option B (functional) gated on VM0-VM3 prerequisites"
    pending:
      - "Acceptance signoff (status: Proposed → Accepted)"
      - "Execute the 6 ADR-001 action items: gitleaks hook, copy audit, daily key rotation Action, append-only audit sheet, quota canary, recovery runbook"
    name: "ADR-001: NEXT_PUBLIC_GOOGLE_PRIVATE_KEY — accepted risk vs migration to backend proxy"
    v5_anchors:
      - "§ security_engineering.secrets_management.never"
      - "§ security_engineering.threat_modeling.stride_model"
      - "§ corrections.security_phases — retrofitting security costs 30x more"
      - "§ decision_frameworks.type1_type2 (Type-1)"
      - "v5_audit V8"
    rationale: >
      Service-account credentials are exposed via NEXT_PUBLIC_* — every
      browser session can read+write the Sheets backing store. v5 calls this
      a 'never'. The original design choice was 'no backend, free hosting,
      community-edit model'. We need an explicit ADR documenting threat
      model + mitigations (sheet-level scopes, rate limits, append-only
      audit sheets) OR a plan to introduce a thin backend proxy.
    scope:
      - "Author ADR-001 with STRIDE pass on the current architecture"
      - "Document mitigating controls: sheet read/write scopes, daily rotation, separate sheet for audit"
      - "Decision: accept-with-controls vs migrate-to-proxy"
      - "If migrate: outline a Vercel Edge Function or Cloudflare Worker proxy as the smallest viable backend"
    exit_criteria:
      - "ADR-001 Accepted with explicit threat model + accepted risks"
      - "If accept-with-controls: gitleaks pre-commit hook installed (v5 § security_engineering.security_in_cicd.secrets_management)"
      - "If migrate: RFC + execution plan, separate VM"
    dependencies: []
    estimated_effort: "1-2 days for ADR; migration is its own multi-VM effort"
    risk_level: "high (architectural)"
    type: "Type-1"

  # ─────────────────────────────────────────────
  # VM9 — CI/CD + FITNESS FUNCTIONS
  # v5 § cicd, § evolutionary_architecture.fitness_functions
  # ─────────────────────────────────────────────
  vm9_cicd_fitness_functions:
    order: 9
    status: "shipped"
    shipped_in_pass:
      - ".github/workflows/ci.yml: install → lint → test → fitness → npm audit → build, all gating, with stub env vars for the build step"
      - "scripts/fitness-functions.mjs: FF1 file LOC ≤1000 hard limit, FF2 function LOC ≤100, FF4 TODO/FIXME density ≤50"
      - "package.json: npm run fitness invokes the script"
    pending:
      - "FF3 bundle size budget — needs a `next build` baseline first"
      - "Confirm CI green on first push after VM0 deps install"
    name: "CI gates: tests, lint, dep audit, fitness functions"
    v5_anchors:
      - "§ cicd.accelerate_capabilities"
      - "§ cicd.security_gates"
      - "§ evolutionary_architecture.fitness_functions"
      - "§ implementation_order step 7"
    rationale: >
      Currently zero CI gates. Per v5 § dora_metrics.technical_practices_that_predict_performance,
      'Continuous integration (build + test on every commit)' is one of the
      24 capabilities predicting elite delivery. Fitness functions
      formalize the v5 thresholds we've been auditing manually.
    scope:
      - "GitHub Actions workflow: install → lint (eslint) → test (vitest) → build (next build)"
      - "Dep audit gate: npm audit --audit-level=high — blocks on HIGH or CRITICAL"
      - "Fitness function 1: no JS file in src/ exceeds 1000 LOC (hard limit)"
      - "Fitness function 2: no function exceeds 100 LOC (parsed via @babel/parser)"
      - "Fitness function 3: bundle size budget — next build output <500KB gzipped first-load JS"
      - "Fitness function 4: zero gitleaks findings (pre-commit + CI)"
      - "Block PR merge on any fitness-function regression"
    exit_criteria:
      - "All 4 fitness functions run on every PR"
      - "First green run on main demonstrates no current regressions"
      - "DORA: lead time measurable (push → merge → deploy)"
    dependencies: ["vm0_test_scaffolding"]
    estimated_effort: "2 days"
    risk_level: "low"
    type: "Type-2"

  # ─────────────────────────────────────────────
  # VM10 — ANEMIC DOMAIN → DDD VALUE OBJECTS (OPTIONAL)
  # v5 § domain_driven_design.tactical_patterns.value_object
  # v5 § anti_patterns.architectural.anemic_domain
  # v5 § corrections.primitive_obsession (best_practices.naming)
  # ─────────────────────────────────────────────
  vm10_value_objects:
    order: 10
    status: "shipped (modules + tests; consumer migration deferred)"
    shipped_in_pass:
      - "src/app/components/compatibility/domain/Coordinates.js: frozen value object with fromTuple/parse/toTuple/distanceKmTo/isInsideBR/equals; throws TypeError on bad input"
      - "src/app/components/compatibility/domain/Telefone.js: BR-format value object with +55 stripping, isMobile/ddd/body/waMeUrl/formattedBR; tryParse for soft validation"
