v5_0_Compact_Software_Engineering_Guidelines:
  meta:
    version: "5.0-compact"
    last_updated: "2026-04"
    purpose: >
      Compact LLM guidelines for code generation and review — L7/L8 Staff/Principal perspective,
      security engineering, data systems, mobile/game context, and DDD/evolutionary architecture.
    base_source: "v4_0_compact_software_engineer_principles.yaml"
    changelog_from_v4_1:
      - "Added security_engineering section (OWASP Top 10, threat modeling, secure-by-default)"
      - "Added data_engineering section (DDIA: replication, partitioning, CAP, consistency models)"
      - "Added mobile_game_specific section (Defold patterns, game loop, mobile performance)"
      - "Expanded llm_prompts with L7/L8 checklist (RFC, ADR, fitness function, toil budget)"
      - "Added greenfield_vs_legacy decision matrix in context_adjustments"
      - "Updated tier_reference: staff_principal_engineering and domain_driven_design are S-tier at L7+"
      - "Clarified canonical_sources with edition/year"
    canonical_sources:
      clean_architecture: "Clean Architecture - Robert C. Martin (2017)"
      clean_code: "Clean Code - Robert C. Martin (2008)"
      code_complete: "Code Complete 2nd Ed. - Steve McConnell (2004)"
      api_design_patterns: "API Design Patterns - JJ Geewax (2021)"
      accelerate: "Accelerate - Forsgren, Humble, Kim (2018)"
      observability_engineering: "Observability Engineering - Majors, Fong-Jones, Miranda (2022)"
      refactoring: "Refactoring 2nd Ed. - Martin Fowler (2018)"
      building_microservices: "Building Microservices 2nd Ed. - Sam Newman (2021)"
      goos: "Growing Object-Oriented Software, Guided by Tests - Freeman & Pryce (2009)"
      ddia: "Designing Data-Intensive Applications - Martin Kleppmann (2017)"
      staff_engineer: "Staff Engineer - Tanya Reilly (2021)"
      team_topologies: "Team Topologies - Skelton & Pais (2019)"
      evolutionary_architecture: "Evolutionary Architecture - Ford, Parsons, Kua (2022)"
      elegant_puzzle: "An Elegant Puzzle - Will Larson (2019)"
      ddd: "Domain-Driven Design - Evans (2003)"
      implementing_ddd: "Implementing DDD - Vernon (2013)"
      owasp: "OWASP Top 10 (2021) — owasp.org"
      threat_modeling: "Threat Modeling: Designing for Security - Shostack (2014)"
      game_programming_patterns: "Game Programming Patterns - Robert Nystrom (2014)"

  # ─────────────────────────────────────────────
  # TIER REFERENCE (UPDATED v5)
  # ─────────────────────────────────────────────
  tier_reference:
    S_plus: ["SRP", "DRY", "Testing & Error Handling", "Architecture Boundaries", "Security by Default"]
    S:
      all_levels: ["OCP", "LSP", "ISP", "DIP", "KISS", "Separation of Concerns", "Naming",
                   "Small Functions", "TD Management", "Defensive Programming"]
      L7_plus: ["Staff/Principal Engineering", "Domain-Driven Design", "Evolutionary Architecture",
                "Threat Modeling", "Fitness Functions", "ADRs + RFCs"]
    S_minus: ["Clarity", "Consistent Style", "CI/CD", "Maintainability Index",
              "API Design", "SLO/SLI Observability", "Data Consistency Models"]
    A_plus: ["Self-Documenting Code", "Continuous Improvement", "Refactoring",
             "Observability", "DORA Metrics", "Mobile Performance Budgets"]
    A: ["Microservices", "IaC", "AI-Assisted Dev", "CQRS/Event Sourcing"]
    note: "L7/L8 engineers apply all tiers simultaneously; staff concerns are S-tier, not optional extras."

  # ─────────────────────────────────────────────
  # CRITICAL METRICS
  # Sources: Code Complete ch.19-24, Clean Code ch.3-10
  # ─────────────────────────────────────────────
  critical_metrics:
    book_references:
      - "Code Complete: complexity budgets, variable scope, routine cohesion"
      - "Clean Code: function size, naming quality, class cohesion"
    complexity:
      cyclomatic: "≤10 good, ≤15 acceptable, >15 refactor"
      cognitive: "≤15 good, ≤25 acceptable, >25 immediate attention"
      nesting: "≤3 levels (Code Complete: deep nesting = design smell)"
      accidental_vs_essential: >
        Distinguish accidental complexity (reducible by better design) from
        essential complexity (inherent to the problem). Eliminate accidental first.
        (Code Complete ch.5)
    size:
      functions: "≤20 ideal, ≤65 good, 100 hard limit (Clean Code ch.3)"
      classes: "≤200 ideal, ≤500 acceptable"
      files: "≤500 ideal, ≤1000 acceptable"
      routine_rationale: >
        McConnell (Code Complete ch.7): routines 1-200 lines are defensible.
        Below 3 lines loses abstraction value. Above 200 is a signal to decompose.
    cohesion:
      class_cohesion: ">0.5"
      wmc: "≤14 good, ≤47 acceptable"
      coupling: "≤5 low, ≤9 moderate (stable dependencies point inward - Clean Architecture)"
    testing:
      coverage: "70-80% branch (not 100%)"
      pyramid: "70% unit, 20% integration, 10% E2E"
      mutation_score: ">60% critical code (use cautiously)"
      flaky_rate: "<5%"
    technical_debt:
      density: "<30 min/KLOC new code"
      sprint_allocation: "15-20% capacity"
      reduction_target: "35% over 2 years"
    maintainability:
      index: "≥85 good, 65-85 moderate, <65 difficult"
      duplication: "<3%"
    variable_scope:
      principle: "Minimize variable scope (Code Complete ch.10): declare close to first use"
      span: "Prefer ≤10 lines between declaration and last use"
      live_time: "Minimize live time; short live time = fewer interference points"

  # ─────────────────────────────────────────────
  # SOLID AT A GLANCE
  # Source: Clean Architecture Part III, Clean Code
  # ─────────────────────────────────────────────
  solid_quick:
    book_reference: "Clean Architecture ch.7-11: each principle with architectural consequence"
    SRP: >
      One class, one responsibility. Cohesion >0.5, WMC ≤14/47.
      Martin (Clean Architecture): a module should be responsible to one and only one
      actor. Violations appear as merge conflicts between teams.
    OCP: >
      Open for extension, closed for modification. Use interfaces and composition.
      Plugin model: new behavior added by adding new code, not modifying existing.
    LSP: >
      Subtypes must substitute base types without breaking behavior.
      Violations break the Rectangle/Square contract; enforce via interface contracts.
    ISP: >
      Small role-specific interfaces, not fat interfaces.
      Clean Architecture: fat interfaces create unnecessary coupling across modules.
    DIP: >
      Depend on abstractions, inject dependencies. High-level policies must not
      depend on low-level details. The Dependency Rule: source code dependencies
      point only inward. (Clean Architecture ch.5, ch.11)

  # ─────────────────────────────────────────────
  # ARCHITECTURE BOUNDARIES
  # Source: Clean Architecture Part V, VI
  # ─────────────────────────────────────────────
  architecture_boundaries:
    book_reference: "Clean Architecture ch.17-25"
    dependency_rule: >
      Source code dependencies must always point inward, toward higher-level policies.
      Nothing in an inner circle may know anything about an outer circle.
    concentric_circles:
      entities: "Enterprise business rules - most stable, least likely to change"
      use_cases: "Application-specific business rules - orchestrate entities"
      interface_adapters: "Controllers, presenters, gateways - translate between use cases and frameworks"
      frameworks_drivers: "Databases, UI, external frameworks - outermost, most volatile"
    screaming_architecture: >
      The architecture should scream the intent of the system (e.g., healthcare system,
      inventory system), not the framework (e.g., Rails app, Spring app).
      Frameworks are details. Use cases are the architecture.
    stable_dependencies_principle: >
      Depend in the direction of stability. A component should not depend on
      components that are more volatile than itself.
    stable_abstractions_principle: >
      Stable components should be abstract. Volatile components should be concrete.
      Allows stable components to be extended without modification (OCP).
    humble_object_pattern: >
      Separate hard-to-test behavior (UI, DB, external services) from easy-to-test
      logic. Puts the seam at the architectural boundary, maximizing testability.
    plugin_model: >
      Business rules are the core. Everything else (DB, UI, frameworks) is a plugin.
      Design so that external details can be replaced without touching business logic.

  # ─────────────────────────────────────────────
  # DEFENSIVE PROGRAMMING
  # Source: Code Complete ch.8
  # ─────────────────────────────────────────────
  defensive_programming:
    book_reference: "Code Complete ch.8: Defensive Programming"
    principle: >
      Protect your routines from invalid inputs. Assume callers will pass anything.
      Do not let invalid data propagate through the system.
    practices:
      - "Validate all inputs at system/module boundaries, not deep inside logic"
      - "Use assertions for conditions that should never be false (dev/test only)"
      - "Use error handling for conditions that may occur in production"
      - "Never return null - prefer Optional, Result types, or empty collections"
      - "Fail fast: surface errors at origin, not at side effect"
      - "Use barricades: validate externally-sourced data at a designated boundary layer"
    assertion_guidelines:
      - "Assert pre-conditions: what must be true on entry"
      - "Assert post-conditions: what must be true on exit"
      - "Assert invariants: what must always be true"
      - "Disable assertions in production only if performance-critical and heavily tested"
    error_handling_vs_assertions:
      assertions: "Bugs - conditions that should never occur"
      error_handling: "Anomalies - conditions expected to occur occasionally (bad input, I/O failure)"
    barricade_pattern: >
      Designate a perimeter (e.g., input validation layer, API boundary).
      Data outside is dirty. Data inside is clean. Only the barricade does sanitization.

  # ─────────────────────────────────────────────
  # SECURITY ENGINEERING (NEW IN v5)
  # Sources: OWASP Top 10 (2021), Threat Modeling - Shostack (2014)
  # ─────────────────────────────────────────────
  security_engineering:
    book_references:
      - "OWASP Top 10 (2021): most critical web application security risks"
      - "Threat Modeling: Designing for Security - Shostack (2014)"
    secure_by_default:
      principle: >
        Security must be a first-class design input, not a post-launch retrofit.
        Default configurations should be the most secure option.
        Explicit opt-in for weaker security; never opt-in for stronger.
      deny_by_default: "No access unless explicitly granted. Start closed, open as needed."
      least_privilege: "Processes, users, and services operate with the minimum rights needed."
      defense_in_depth: "Multiple independent security layers. No single point of failure."
      fail_secure: "On failure, default to the more restrictive state (deny, not allow)."
    owasp_top_10_2021:
      A01_broken_access_control:
        risk: "Attackers access resources beyond their authorization"
        mitigations:
          - "Deny all access by default; whitelist explicit grants"
          - "Enforce ownership checks at the data layer, not just the route"
          - "Log all access control failures and alert on bursts"
      A02_cryptographic_failures:
        risk: "Sensitive data exposed via weak or missing encryption"
        mitigations:
          - "TLS 1.2+ everywhere, HSTS headers, no HTTP fallback"
          - "Bcrypt/Argon2 for passwords, never MD5/SHA1 for secrets"
          - "Encrypt at rest for PII, payment, health data"
          - "Never log sensitive data (tokens, passwords, PII)"
      A03_injection:
        risk: "SQL, NoSQL, OS, LDAP, command injection via untrusted data"
        mitigations:
          - "Parameterized queries / prepared statements — never string concatenation for SQL"
          - "ORM where possible; raw SQL only with explicit binding"
          - "Shell commands: never pass user input without strict allowlist validation"
      A04_insecure_design:
        risk: "Missing or ineffective security controls at design level"
        mitigations:
          - "Threat model every new feature: STRIDE or attack tree"
          - "Security user stories alongside functional ones"
          - "Secure design patterns: rate limiting, anti-CSRF, secure cookie flags"
      A05_security_misconfiguration:
        risk: "Default configs, unnecessary features, verbose errors expose vulnerabilities"
        mitigations:
          - "Harden defaults: disable unused endpoints, remove default credentials"
          - "Generic error messages to users; detailed errors to logs only"
          - "Dependency scanning in CI/CD (Snyk, Dependabot, OWASP Dependency-Check)"
      A06_vulnerable_components:
        risk: "Known CVEs in libraries, frameworks, or containers"
        mitigations:
          - "Automated dependency updates with security alerts (Dependabot)"
          - "SBOM (Software Bill of Materials) for supply chain visibility"
          - "Retire.js / npm audit / pip-audit / trivy in CI gate"
      A07_auth_failures:
        risk: "Broken authentication allowing account compromise"
        mitigations:
          - "Use proven auth libraries — never roll your own auth"
          - "MFA for privileged access"
          - "Short-lived JWTs, refresh token rotation, revocation list"
          - "Brute-force protection: lockout or progressive delay"
      A08_integrity_failures:
        risk: "Unsigned software updates, insecure deserialization, CI/CD compromise"
        mitigations:
          - "Verify signatures of dependencies and build artifacts"
          - "Never deserialize untrusted data into objects (use DTO with explicit mapping)"
          - "Protect CI/CD pipeline: least privilege, secrets manager, audit logs"
      A09_logging_failures:
        risk: "Insufficient logging makes attacks invisible and unrecoverable"
        mitigations:
          - "Log authentication events, access control failures, input validation errors"
          - "Centralized log aggregation with retention policy"
          - "Alert on anomalous patterns (brute force, mass export, privilege escalation)"
      A10_ssrf:
        risk: "Server-Side Request Forgery — server fetches attacker-controlled URLs"
        mitigations:
          - "Allowlist valid URL schemes, domains, and IP ranges"
          - "Deny requests to private IP ranges (10.x, 172.16.x, 192.168.x, 169.254.x)"
          - "Never use raw user input as a URL in server-side HTTP calls"
    threat_modeling:
      definition: >
        Structured process to identify threats, vulnerabilities, and countermeasures before
        building. Shift-left security — cheapest to fix at design time.
      stride_model:
        Spoofing: "Identity — mitigate with authentication"
        Tampering: "Data integrity — mitigate with authorization and signing"
        Repudiation: "Audit trails — mitigate with logging and non-repudiation"
        Information_Disclosure: "Confidentiality — mitigate with encryption and access control"
        Denial_of_Service: "Availability — mitigate with rate limiting and redundancy"
        Elevation_of_Privilege: "Authorization — mitigate with least privilege and role checks"
      when: "For every new service, major feature, auth change, or third-party integration."
      output: "Threat model doc per component: assets, threats, mitigations, accepted risks + rationale."
    secrets_management:
      never: "Hardcode secrets in source code, config files, or Docker images"
      use: "Environment variables (12-factor), vault (HashiCorp Vault, AWS Secrets Manager)"
      rotation: "Rotate secrets on schedule and immediately on suspected exposure"
      scanning: "git-secrets, truffleHog, gitleaks in pre-commit hooks and CI"
    security_in_cicd:
      sast: "Static analysis: Semgrep, CodeQL, SonarQube security rules (every PR)"
      dast: "Dynamic analysis: OWASP ZAP against staging (every release)"
      dependency_scan: "npm audit / Snyk / trivy (every PR, block on HIGH/CRITICAL)"
      container_scan: "Trivy or Clair scan of Docker images (every build)"
      iac_scan: "Checkov, tfsec for Terraform/CloudFormation (every PR)"

  # ─────────────────────────────────────────────
  # DATA ENGINEERING & DISTRIBUTED SYSTEMS (NEW IN v5)
  # Source: Designing Data-Intensive Applications - Kleppmann (2017)
  # ─────────────────────────────────────────────
  data_engineering:
    book_reference: "Designing Data-Intensive Applications - Kleppmann (2017)"
    reliability_scalability_maintainability:
      reliability: "Continue working correctly even under faults and errors"
      scalability: "Reasonable ways to deal with growth (data, traffic, complexity)"
      maintainability: "Future engineers can operate, adapt, and extend the system"
    replication:
      purpose: "Redundancy (fault tolerance), latency reduction, read scaling"
      single_leader:
        writes: "Only to leader. Reads from followers (may lag)."
        use: "Most relational DBs (Postgres, MySQL streaming replication)"
        lag_risk: "Follower lag = stale reads. Use read-your-writes or sync replication for critical paths."
      multi_leader:
        writes: "Any leader. Conflict resolution required."
        use: "Multi-datacenter writes, offline-capable clients. Avoid if possible."
      leaderless:
        writes: "W nodes must confirm. Reads from R nodes. W+R>N = quorum."
        use: "Cassandra, DynamoDB. Eventual consistency by default."
    partitioning:
      purpose: "Scalability — data volume or query load exceeds one machine"
      by_key_range: "Natural ordering, range scans, but hotspot risk on sequential keys"
      by_hash: "Uniform distribution, no ordering, use for write-heavy workloads"
      secondary_indexes:
        document_partitioned: "Local index per partition. Scatter/gather reads — expensive."
        term_partitioned: "Global index by term. Efficient reads, more complex writes."
      rebalancing: "Fixed partitions > fixed nodes. Move partitions, not keys."
    transactions:
      acid:
        Atomicity: "All or nothing — on failure, all writes rolled back"
        Consistency: "DB invariants preserved before and after transaction"
        Isolation: "Concurrent transactions see committed state (varies by level)"
        Durability: "Committed data survives crashes (WAL, fsync)"
      isolation_levels:
        read_uncommitted: "See dirty reads. Almost never use."
        read_committed: "No dirty reads. Most common default."
        repeatable_read: "No non-repeatable reads. Phantom reads may occur."
        serializable: "Full isolation. Expensive. Use only where correctness demands it."
      distributed_transactions: >
        Two-Phase Commit (2PC) provides atomicity across nodes but blocks on coordinator failure.
        Prefer saga pattern (compensating transactions) or idempotent writes with at-least-once.
    consistency_models:
      linearizability: >
        Strongest consistency. Behaves as if one copy of data. Every operation takes effect
        atomically between invocation and response. Required for: leader election, uniqueness
        constraints, cross-channel coordination.
        Cost: high latency, unavailable under partitions (CAP).
      eventual_consistency: >
        Writes propagate asynchronously. Replicas converge given no new writes.
        Use for: user activity feeds, caches, analytics, non-critical counters.
        Handle conflict: last-write-wins, CRDTs, application-level merge.
      causal_consistency: >
        Operations that are causally related are seen in order everywhere.
        Stronger than eventual, weaker than linearizable. Practical sweet spot.
    cap_theorem:
      statement: "A distributed system can guarantee at most two of: Consistency, Availability, Partition tolerance."
      reality: >
        Partition tolerance is not optional in real networks. Choose CA during normal ops;
        choose C or A during partitions. Most systems choose AP with bounded staleness.
      pacelc: >
        PACELC (Abadi 2012) adds the else-case: during normal operation, tradeoff is
        Latency vs Consistency (L/C), not just C/A during partitions.
        Modern design: choose C/L based on the specific operation, not the entire system.
    stream_processing:
      vs_batch: "Stream: low latency, incremental. Batch: high throughput, reprocessable."
      log_based_message_broker: >
        Kafka: durable, replayable log. Consumers maintain their own offset.
        Enables event sourcing, replay-on-bug, fan-out without coupling.
      processing_semantics:
        at_most_once: "May lose records. Fast."
        at_least_once: "May duplicate. Idempotent consumers required."
        exactly_once: "No loss, no duplicate. Kafka transactions + idempotent producers."
      stateful_operations: "Joins, aggregations, windows require state store. Use RocksDB-backed stores."
    encoding_and_evolution:
      forward_compatibility: "Old code can read data written by new code"
      backward_compatibility: "New code can read data written by old code"
      preferred_formats: "Avro, Protobuf, Thrift — schema evolution with field defaults"
      avoid: "Java serialization, language-specific binary formats — not cross-platform evolvable"
    database_selection:
      relational: "Complex queries, transactions, strong consistency. Postgres first choice."
      document: "Flexible schema, nested data, JSON-native. MongoDB, Couchbase."
      wide_column: "High write throughput, time-series, sparse attributes. Cassandra, HBase."
      graph: "Highly connected data, multi-hop relationships. Neo4j, Amazon Neptune."
      key_value: "Ultra-low latency lookup. Redis (cache/session), DynamoDB (ops simplicity)."
      search: "Full-text, faceted search, relevance ranking. Elasticsearch, Opensearch."
      rule: "Use the simplest DB that meets requirements. Never use a specialized DB to appear sophisticated."

  # ─────────────────────────────────────────────
  # MOBILE & GAME SPECIFIC (NEW IN v5)
  # Sources: Game Programming Patterns - Nystrom (2014)
  #          Defold engine patterns (from SOLONE project)
  # ─────────────────────────────────────────────
  mobile_game_specific:
    book_references:
      - "Game Programming Patterns - Nystrom (2014): patterns calibrated to game loops"
    game_loop:
      canonical_form: >
        while running:
          process_input()
          update(delta_time)
          render()
      delta_time: >
        All movement, physics, and timers must multiply by dt (delta time).
        Never hardcode frame-dependent values. Variable timestep with a clamp
        (dt = min(dt, MAX_DT)) prevents spiral-of-death on hitches.
      fixed_timestep: >
        For physics-heavy or deterministic-network games: accumulate dt until
        >= FIXED_DT, step physics N times. Interpolate render.
        Overkill for simple arcade mobile games.
    game_patterns:
      update_method: >
        Each entity has an update(dt) method called by the game loop.
        Separates entity behavior from the loop. (Nystrom ch.10)
      component_pattern: >
        Decompose entity behavior into small, composable components.
        Avoids deep inheritance hierarchies. Most game engines (Unity, Defold) enforce this.
      event_queue: >
        Decouple event dispatch from processing. Prevents cascading updates mid-frame.
        In Defold: msg.post() is the canonical event queue — messages are processed
        on the next frame, not immediately. Design around this, don't fight it.
      object_pool: >
        Pre-allocate a fixed set of objects and recycle. Eliminates GC spikes from
        frequent alloc/dealloc. Essential for bullets, particles, enemies.
        In Defold: use factory.create() + msg.post("kill") recycling.
      spatial_partition: >
        Accelerate proximity queries with spatial structures (grid, quadtree).
        For 2D mobile: uniform grid is simplest and sufficient under 500 objects.
      flyweight: >
        Share immutable data across instances. Sprite sheets, tilemap definitions.
        In Defold: multiple GOs referencing same .go prototype share all static data.
      state_machine: >
        Explicit states for entity behavior. Prevents multi-boolean explosion.
        Finite State Machine (FSM) for simple AI; Behavior Tree for complex AI.
    defold_patterns:
      message_passing: >
        msg.post(url, message_id, data) is async: message arrives next frame.
        Never assume a game object has processed a message in the same frame it was sent.
        Design logic to be resilient to one-frame delays.
      url_addressing: >
        go.get_id() returns the instance hash. msg.post takes a URL string or hash.
        URL forms: "#component" (local), "go_id#component" (sibling), "/path/go#comp" (absolute).
        tostring(id) is required when using IDs as table keys.
      factory_pattern: >
        factory.create(factory_url, position, rotation, properties) spawns a new GO.
        Track spawned IDs in a table for lifecycle management.
        On despawn: msg.post(id, "kill") then remove from table on "enemy_died" confirmation.
      zero_false_serialization_bug: >
        CRITICAL Defold bug: msg.post does NOT serialize fields with value 0 or false.
        Workaround: wrap in a subtable or use a non-zero sentinel, OR set defaults in on_message
        before reading. Always defend against missing numeric fields.
      input_focus: >
        Only one script can process input at a time (acquire_input_focus).
        Player script acquires on init. GUI scripts acquire when a menu opens.
        Release on final() to allow cleanup without input orphans.
      collision_setup: >
        Collision objects: group (what I am) + mask (what I collide with).
        Asymmetric by design: only ONE side needs to mask the other.
        Kinematic vs Dynamic vs Static: Kinematic = script-controlled movement.
    mobile_performance:
      frame_budget_60fps: "16.67ms total. Target ≤10ms for game logic. Reserve 6ms for render."
      frame_budget_30fps: "33.33ms total. Mobile minimum for acceptable feel."
      draw_call_budget: "≤100 draw calls per frame on mid-range mobile. Batch sprites by atlas."
      memory_budget: "≤150MB RAM on low-end devices. Profile on target device, not dev machine."
      texture_compression: "Use PVRTC (iOS), ETC2 (Android), or ASTC (modern) — not raw PNG in atlas."
      gc_spikes: "Pre-allocate; avoid table creation inside update() — reuse pooled tables."
      battery: "Cap framerate when idle/menu. 60fps constant drains battery and heats device."
      profile_first: "Never optimize without profiler data. Most mobile perf issues are 1-3 hotspots."
    mobile_ux:
      touch_target: "Minimum 44×44pt touch target (Apple HIG). Err larger."
      feedback_latency: "Audio + visual response within 1 frame of touch. No perceived delay."
      orientation: "Lock to portrait or landscape in project settings; do not support both unless designed."
      safe_areas: "Respect device notch/home indicator on iOS. Test on iPhone with notch."
      offline_first: "Core gameplay must work without network. Network for scores/sync."

  # ─────────────────────────────────────────────
  # TESTING STRATEGY
  # Sources: GOOS, Clean Code, Accelerate
  # ─────────────────────────────────────────────
  testing_strategy:
    book_references:
      - "GOOS ch.1-5: test-driven OO design, listening to tests"
      - "Clean Code ch.9: F.I.R.S.T. principles"
      - "Accelerate ch.4: continuous testing as a key predictor of delivery performance"
    philosophy:
      tdd_cycle: "Red (failing test) -> Green (minimal passing code) -> Refactor (clean)"
      listen_to_tests: >
        GOOS: if a test is hard to write, the design is telling you something.
        Difficulty in testing is a design signal, not a test problem.
      outside_in_tdd: >
        Start with acceptance/integration tests that define behavior from the outside.
        Let integration tests drive the need for unit tests on collaborators.
    first_principles:
      fast: "Unit tests run in milliseconds; slow tests are skipped"
      independent: "No test depends on state left by another test"
      repeatable: "Same result regardless of environment or order"
      self_validating: "Pass or fail - no manual verification"
      timely: "Written with or before production code, not after"
    test_doubles:
      stub: "Returns canned answers; used to isolate the subject from collaborators"
      mock: "Verifies interaction expectations; use sparingly - tests behavior, not implementation"
      fake: "Working implementation with shortcuts (e.g., in-memory DB)"
      spy: "Records calls for later assertion"
      guideline: "Prefer stubs over mocks (GOOS: mocks can couple tests to implementation)"
    pyramid:
      unit: "70% - isolated, fast, test one concept"
      integration: "20% - real collaborators, real I/O boundaries"
      e2e: "10% - full stack, smoke coverage of critical paths"
    accelerate_link: >
      Continuous testing (automated, run on commit) is one of 24 capabilities
      that predict high software delivery performance. (Accelerate ch.4)
    anti_patterns:
      - "Testing implementation details instead of behavior"
      - "Mocking everything (overspecification)"
      - "Tests that pass when code is broken (false green)"
      - "Shared mutable state between tests"
      - "Testing getters/setters in isolation"

  # ─────────────────────────────────────────────
  # REFACTORING PATTERNS
  # Source: Refactoring 2nd Ed. - Fowler
  # ─────────────────────────────────────────────
  refactoring_patterns:
    book_reference: "Refactoring 2nd Ed. - Fowler: catalog of 60+ mechanics"
    principle: >
      Refactoring = changing internal structure without changing observable behavior.
      Always have a passing test suite before starting. Small, safe steps.
    when_to_refactor:
      rule_of_three: "First time: do it. Second time: duplicate. Third time: refactor."
      preparatory: "Refactor before adding a feature to make adding it easier"
      comprehension: "Refactor when reading code to understand it"
      litter_pickup: "Boy Scout Rule: leave it better than you found it"
      planned: "Only when justified by data (high-change area, high TD density)"
    key_mechanics:
      extract_function: "Move code fragment to a named function (most used refactoring)"
      inline_function: "Replace trivial function with its body to remove indirection"
      extract_variable: "Name a sub-expression to improve readability"
      move_function: "Relocate to the class/module that uses it most"
      replace_conditional_with_polymorphism: "OCP in practice"
      introduce_parameter_object: "Group related parameters into a value object"
      replace_primitive_with_object: "Encapsulate primitives that have behavior"
      decompose_conditional: "Extract complex conditions into named functions"
    code_smells_catalog:
      long_method: "CC >10, >65 LOC - extract function"
      large_class: ">500 LOC, WMC >47 - extract class"
      long_parameter_list: ">4 params - introduce parameter object or preserve whole object"
      divergent_change: "One class changed for different reasons - violates SRP, split"
      shotgun_surgery: "One change touches many classes - consolidate"
      feature_envy: "Method uses another object's data more than its own - move method"
      data_clumps: "Same data fields appear together - extract class"
      primitive_obsession: "Using primitives for domain concepts - replace with object"
      switch_statements: "Same switch in multiple places - use polymorphism"
      parallel_inheritance: "Every subclass in A needs a subclass in B - merge"
      comments: "Comment explains WHAT not WHY - the code should explain WHAT"
    safety_practices:
      - "Run full test suite between each refactoring step"
      - "Commit after each safe step (atomic commits)"
      - "Never mix refactoring and feature work in the same commit"
      - "Separate refactoring PRs from feature PRs"

  # ─────────────────────────────────────────────
  # API DESIGN
  # Source: API Design Patterns - Geewax
  # ─────────────────────────────────────────────
  api_design:
    book_reference: "API Design Patterns - Geewax: resource-oriented design, AIP standards"
    resource_oriented_design:
      principle: >
        APIs should be organized around resources (nouns), not actions (verbs).
        Resources are the things your API manages.
      hierarchy: "Collection > Resource > Sub-collection > Sub-resource"
      naming:
        - "Collections: plural nouns (e.g., /users, /orders)"
        - "Resources: singular noun with ID (e.g., /users/{userId})"
        - "Use camelCase for JSON fields, kebab-case for URL paths"
    standard_methods:
      get: "Retrieve a resource or collection. Idempotent. No side effects."
      list: "List a collection. Support pagination (cursor-based preferred over offset)."
      create: "Create a new resource. Return 201 + Location header."
      update: "Full or partial update. Prefer PATCH with field mask over PUT."
      delete: "Soft-delete preferred for audit trails. Return 204 or the deleted resource."
    versioning:
      strategies:
        url_path: "/v1/users (most explicit, most common for breaking changes)"
        header: "Accept: application/vnd.api+json;version=1"
      compatibility:
        backward_compatible: "Adding optional fields, adding endpoints, relaxing constraints"
        breaking: "Removing fields, renaming fields, changing types, tightening constraints"
      guideline: "Never break v1. Add v2 only for genuine semantic incompatibility."
    pagination:
      preferred: "Cursor-based (opaque token): consistent under mutations, O(1) DB query"
      avoid: "Offset-based for large or frequently-mutated collections"
      response_shape: "{ data: [...], nextPageToken: 'abc', totalSize: 1000 }"
    error_design:
      format: "{ code: 404, message: 'User not found', details: [...] }"
      http_semantics:
        "400": "Bad request - client error in input"
        "401": "Unauthenticated - no valid credentials"
        "403": "Unauthorized - valid credentials, insufficient permissions"
        "404": "Not found"
        "409": "Conflict - resource state prevents operation"
        "429": "Rate limited - include Retry-After header"
        "500": "Server error - never expose stack traces"
    idempotency:
      principle: "GET, PUT, DELETE should be idempotent. POST should use Idempotency-Key header."
      key: "Client provides UUID key; server returns same response for duplicate keys within TTL"

  # ─────────────────────────────────────────────
  # DORA METRICS AND LEAN DELIVERY
  # Source: Accelerate - Forsgren, Humble, Kim
  # ─────────────────────────────────────────────
  dora_metrics:
    book_reference: "Accelerate ch.2: Four Key Metrics of software delivery performance"
    four_keys:
      deployment_frequency:
        definition: "How often the organization deploys to production"
        elite: "On demand (multiple times/day)"
        high: "Between once/day and once/week"
      lead_time_for_changes:
        definition: "Time from code commit to production deployment"
        elite: "<1 hour"
        high: "<1 day"
      mean_time_to_restore:
        definition: "Time to restore service after a production incident"
        elite: "<1 hour"
        high: "<1 day"
      change_failure_rate:
        definition: "Percentage of deployments causing incidents requiring hotfix"
        elite: "0-15%"
        low: "46-60%"
    technical_practices_that_predict_performance:
      - "Trunk-based development (short-lived branches <1 day)"
      - "Continuous integration (build + test on every commit)"
      - "Test automation (unit, integration, acceptance)"
      - "Deployment automation (no manual steps)"
      - "Shift left on security (automated security testing in pipeline)"
      - "Loosely coupled architecture (teams deploy independently)"
      - "Feature flags (decouple deploy from release)"
      - "Monitoring and observability (detect issues before users do)"
    westrum_model:
      generative: "Performance-oriented; information actively sought; failure leads to inquiry"
      finding: "Generative culture predicts better software delivery AND org performance."

  # ─────────────────────────────────────────────
  # OBSERVABILITY
  # Source: Observability Engineering - Majors, Fong-Jones, Miranda
  # ─────────────────────────────────────────────
  observability:
    book_reference: "Observability Engineering: beyond 3 pillars to structured events and SLOs"
    definition: >
      Observability is the ability to understand the internal state of a system
      from its external outputs alone. Exploring unknown unknowns, not just monitoring
      known failure modes. (Observability Engineering ch.1)
    structured_events:
      principle: "Wide JSON event per request — captures everything for exploratory debugging"
      cardinality: "Preserve high-cardinality fields (userId, requestId). Use Honeycomb, Tempo, Jaeger."
    three_pillars:
      logs: "Structured JSON. ERROR/WARN/INFO/DEBUG. Every line carries trace_id + span_id."
      metrics: "Counter, Gauge, Histogram. Golden signals: Latency, Traffic, Errors, Saturation."
      traces: "W3C TraceContext headers. OpenTelemetry SDK → Jaeger / Tempo."
    slo_sli_sla:
      sli: "Quantitative measure: success rate, p99 latency, freshness"
      slo: "Target value for SLI over 30-day window (e.g., 99.9% requests succeed)"
      error_budget: "100% minus SLO. Exhausted budget = freeze features, fix reliability."
    alerting:
      principle: "Alert on symptoms (SLO burn rate), not causes (CPU >80%)"
      runbooks: "Every alert has a linked runbook. No runbook = do not alert."
    roi: "60% MTTR reduction with proper observability implementation"

  # ─────────────────────────────────────────────
  # MICROSERVICES DECISION FRAMEWORK
  # Source: Building Microservices - Newman
  # ─────────────────────────────────────────────
  microservices:
    book_reference: "Building Microservices 2nd Ed. - Newman"
    when: "Only with >10 developers and clear bounded contexts. Default to modular monolith first."
    service_communication:
      sync: "REST or gRPC for request-response. Avoid sync chains >3 deep."
      async: "Events via message broker for temporal decoupling. Default for cross-service ops."
    patterns:
      strangler_fig: "100% adoption for migrations. Intercept + redirect + remove iteratively."
      api_gateway: "100% adoption. Handles auth, rate-limit, routing."
      saga: "Distributed transactions via choreography (events) or orchestration (coordinator)."
      outbox: "Reliably publish events alongside DB writes without 2PC."
    data_isolation: "Each service owns its data. No shared databases."
    maturity_model:
      1_modular_monolith: "Start here."
      2_service_extraction: "Extract only services under independent load or change cadence."
      3_full_microservices: "Only after proving independent deployability in step 2."

  # ─────────────────────────────────────────────
  # ANTI-PATTERNS
  # ─────────────────────────────────────────────
  anti_patterns:
    structural:
      god_object: ">500 LOC, >20 methods, >10 deps, WMC >47"
      spaghetti: "CC >15, nesting >4, Cognitive >25"
      copy_paste: ">10 line duplicates, >3% duplication"
      magic_literals: "Hardcoded numbers/strings in business logic"
      primitive_obsession: "Using string/int for domain concepts (email, money, userId)"
    process:
      premature_opt: "Complex code without profiling data (Knuth: root of all evil)"
      no_tests: "Shipping without test suite — no safety net for refactoring"
    architectural:
      distributed_monolith: "Services always deployed together, shared DBs, sync chains >3"
      framework_core: "Framework is the architecture (violates screaming architecture)"
      anemic_domain: "Domain objects are just data holders; all logic in services"
      big_ball_of_mud: "No discernible architecture; changes everywhere affect everywhere"
    security_anti_patterns:
      security_by_obscurity: "Hiding implementation instead of fixing vulnerability"
      rolling_own_crypto: "Custom encryption instead of vetted libraries (OpenSSL, libsodium)"
      over_permissive_cors: "Access-Control-Allow-Origin: * on authenticated endpoints"
      logging_secrets: "Writing tokens, passwords, PII to logs"
      eval_from_input: "eval() or dynamic code execution from user-controlled data"

  # ─────────────────────────────────────────────
  # BEST PRACTICES RAPID CHECKLIST
  # ─────────────────────────────────────────────
  best_practices:
    functions:
      - "≤20 lines ideal, single level of abstraction (Clean Code ch.3)"
      - "Descriptive names, verb-based (Clean Code ch.2)"
      - "≤3-4 parameters; use parameter objects beyond that"
      - "No side effects; command-query separation"
      - "Never return null; use Optional, Result, or empty collections"
    classes:
      - "Single responsibility, high cohesion (Clean Architecture ch.7)"
      - "≤200 LOC ideal"
      - "Composition over inheritance"
      - "Depend on abstractions, not concretions (DIP)"
    testing:
      - "Write tests alongside code (TDD/BDD)"
      - "F.I.R.S.T: Fast, Independent, Repeatable, Self-validating, Timely"
      - "Test error paths as thoroughly as happy paths"
      - "Listen to tests: hard to test = design problem (GOOS)"
    error_handling:
      - "Use exceptions, not return codes (Clean Code ch.7)"
      - "Explicit error types, fail fast"
      - "Never swallow exceptions silently"
      - "Validate at system boundaries (defensive programming)"
    naming:
      - "Reveal intent, searchable, pronounceable (Clean Code ch.2)"
      - "Domain vocabulary (ubiquitous language)"
      - "No abbreviations, no noise words (Manager, Processor, Info)"
    security:
      - "Never trust user input — validate and sanitize at every boundary"
      - "Parameterized queries only — never string-concat SQL"
      - "Secrets in vault/env vars, never in source code"
      - "OWASP Top 10 checklist on every new feature review"

  # ─────────────────────────────────────────────
  # TECHNICAL DEBT MANAGEMENT
  # ─────────────────────────────────────────────
  technical_debt:
    book_reference: "Refactoring 2nd Ed: when to refactor; Accelerate: TD as velocity predictor"
    allocation: "15-20% sprint capacity + quarterly refactoring sprint"
    prioritization: "Value 35%, Complaints 22%, Principal 18%, Interest 15%, Risk 10%"
    critical_findings:
      - "Only 7% admitted TD actually resolved without dedicated allocation"
      - "Dedicated refactoring commits: 42% bug reduction vs 12% mixed"
      - "Unmanaged TD grows 23% yearly with 15% maintenance overhead"
    workflow:
      - "Track in issue system with business impact (not just technical description)"
      - "CI/CD gates block if TD density increases >10%"
      - "Boy Scout Rule: leave code better (Clean Code)"
      - "Separate refactoring from features (Refactoring 2nd Ed.)"

  # ─────────────────────────────────────────────
  # CI/CD ESSENTIALS
  # Source: Accelerate ch.4, ch.5
  # ─────────────────────────────────────────────
  cicd:
    book_reference: "Accelerate ch.4-5: continuous delivery as a key capability cluster"
    metrics: "Build <10min, Deploy daily, Lead time <24h, MTTR <1h"
    accelerate_capabilities:
      - "Version control for all artifacts"
      - "Deployment automation (zero manual steps)"
      - "Continuous integration (build+test on every commit to trunk)"
      - "Trunk-based development (short-lived branches)"
      - "Shift left on security"
    security_gates:
      - "SAST scan (Semgrep, CodeQL) — block on HIGH"
      - "Dependency vulnerability scan — block on CRITICAL"
      - "Container image scan (Trivy) — block on HIGH+"
      - "Secrets scan (gitleaks) — block on any match"
    practices:
      - "Feature flags for release decoupling"
      - "Canary or blue-green deployments"
      - "Build once, deploy same artifact"
    outcomes: "200x deployment frequency, 50-63% fewer failures (Accelerate ch.2)"

  # ─────────────────────────────────────────────
  # AI-ASSISTED DEVELOPMENT
  # ─────────────────────────────────────────────
  ai_assisted:
    effectiveness:
      good_for: "Boilerplate, unit tests, documentation: 55.8% faster for simple tasks"
      poor_for: "Complex algorithms, novel architecture, mature codebases: 19% SLOWER"
    metrics: "Acceptance rate >30% indicates value; monitor with SPACE framework"
    practices:
      - "Always review generated code (especially error handling and edge cases)"
      - "Provide rich context: architecture decisions, constraints, domain model"
      - "Never blind trust for security-critical or concurrency code"
      - "Validate generated tests actually test the right behavior (not just coverage)"
      - "Generated code must pass OWASP review — LLMs reproduce common vulnerabilities"

  # ─────────────────────────────────────────────
  # CODE REVIEW
  # ─────────────────────────────────────────────
  code_review:
    primary_purpose: "Knowledge transfer (not just defect finding)"
    best_practices:
      - "PRs <400 LOC"
      - "Rich context in descriptions (what, why, how to test)"
      - "Security review checklist on auth/data/external-facing PRs"
      - "Separate refactoring PRs from feature PRs (Refactoring 2nd Ed.)"
    llm_tools: "[Inference] 73.8% automated comment resolution, but 41% longer PR times - augment not replace"

  # ─────────────────────────────────────────────
  # LLM PROMPTS / CHECKLIST (EXPANDED IN v5)
  # ─────────────────────────────────────────────
  llm_prompts:
    before_writing:
      - "Is this one responsibility? (SRP)"
      - "Can it be simpler? (KISS)"
      - "Am I repeating myself? (DRY)"
      - "Will this be testable? (DIP, Humble Object)"
      - "Is the name clear? (Clean Code - Naming)"
      - "Does the architecture scream the intent? (Screaming Architecture)"
      - "Are boundaries respected? (Dependency Rule)"
      - "Are there security implications? (OWASP Top 10 self-check)"
    during_review:
      - "CC/Cognitive >15/25? (Complexity)"
      - "Function >65 LOC? (Size)"
      - "Test coverage <70%? (Testing)"
      - "Duplication >3%? (DRY)"
      - "Clear error handling? (Defensive Programming)"
      - "Variable scope minimized? (Code Complete ch.10)"
      - "Any code smell from Fowler catalog? (Refactoring 2nd Ed.)"
      - "Any OWASP Top 10 risk introduced? (Security)"
      - "Secrets or PII handled correctly? (Security Engineering)"
    api_review:
      - "Resource-oriented naming? (API Design Patterns)"
      - "Backward-compatible change? (versioning)"
      - "Auth and authorization on every endpoint? (OWASP A01)"
      - "Error response shape consistent and non-leaking? (API Design Patterns)"
    technical_debt:
      - "Is this tracked with business impact?"
      - "Will this increase TD density >10%? (CI Gate)"
      - "DORA metrics impacted? Lead time, CFR? (Accelerate)"
    l7_l8_checklist:
      - "Does this require an RFC? (cross-cutting, affects multiple teams, lasts >6 months)"
      - "Does this require an ADR? (Type 1 decision: persistence, auth, API style, framework)"
      - "Are fitness functions covering the affected architectural characteristics?"
      - "Is there a team cognitive load concern? (Team Topologies)"
      - "Does this increase or decrease toil? Is there an elimination plan?"
      - "Does the team structure enable or resist this architecture? (Inverse Conway)"
      - "Is this a Type 1 (irreversible) or Type 2 (reversible) decision? Size effort accordingly."
      - "Have alternatives been documented? (ADR: min 2 alternatives considered)"
    data_engineering_review:
      - "What are the consistency requirements? (linearizable vs eventual)"
      - "Is this query bounded? No unbounded full-table scans."
      - "Will this query scale with data volume? Add index analysis."
      - "Is schema forward/backward compatible? (Avro/Protobuf field rules)"
      - "What happens during a network partition? Explicit availability/consistency choice."

  # ─────────────────────────────────────────────
  # STAFF / PRINCIPAL ENGINEERING (L7–L8)
  # Sources: Staff Engineer, Team Topologies, Evolutionary Architecture, Elegant Puzzle
  # ─────────────────────────────────────────────
  staff_principal_engineering:
    book_references:
      - "Staff Engineer - Tanya Reilly (2021)"
      - "Team Topologies - Skelton & Pais (2019)"
      - "Evolutionary Architecture - Ford, Parsons, Kua (2022)"
      - "An Elegant Puzzle - Will Larson (2019)"
    role_definition:
      L7_staff: "Scope = multiple teams or a significant system. Multiplies team output."
      L8_principal: "Scope = org-wide or multi-year technical direction. Sets technical vision."
      leverage_principle: >
        The unit of contribution shifts from personal output to impact on others.
        Staff/Principal who is 10x more productive individually but does not multiply
        others is misallocated. (Reilly: leverage > heroics)
    archetypes:
      tech_lead: "Guides technical direction of a team or product area. Most common archetype."
      architect: "Owns architecture across a domain; sets technical constraints and standards."
      solver: "Parachutes into deep, undefined problems; delivers clarity then moves on."
      right_hand: "Extends a senior leader's reach; amplifies org effectiveness."
    decision_frameworks:
      type1_type2:
        type1: "Irreversible — one-way doors. Slow down, build consensus, use ADRs."
        type2: "Reversible — two-way doors. Decide fast, learn, iterate. Most decisions are Type 2."
        failure_mode: "Treating all decisions as Type 1 creates bottlenecks and learned helplessness."
      adrs:
        what: "Architecture Decision Records — one Markdown doc per architectural decision."
        when: "Any Type 1 decision: persistence layer, API style, auth mechanism, framework choice."
        format: |
          # ADR-NNN: Short title
          Status: Proposed | Accepted | Superseded by ADR-NNN
          Context: Why is this decision needed?
          Decision: What we chose and why.
          Consequences: What becomes easier, harder, or impossible.
    engineering_leverage:
      levers:
        - "Fewer large PRs; more design docs and RFCs"
        - "Debug less; invest in observability so the team can debug itself"
        - "Ship less new code; reduce the codebase (deletion is positive delta)"
        - "Answer fewer questions; write the doc that prevents the question"
        - "Fix fewer bugs; eliminate the class via type safety, invariants, testing standards"
    conways_law_and_teams:
      conways_law: "Organizations produce architectures that mirror their communication structures."
      inverse_conway: "Design team structures to produce the architecture you want. (Team Topologies ch.2)"
      team_types:
        stream_aligned: "Owns a flow of user value end-to-end. Primary team type."
        platform: "Reduces cognitive load via self-service capabilities."
        enabling: "Temporary; brings capability in, then exits."
        complicated_subsystem: "Deep expertise. High cognitive cost; keep small."
      cognitive_load: "Team owning too many services = excessive cognitive load. Split or simplify."
    technical_strategy:
      horizon_model:
        H1: "0-12 months: execution quality, delivery velocity"
        H2: "12-24 months: architectural debt, rearchitecture candidates"
        H3: "24-36 months: technology bets, platform, tooling, hiring"
      tech_radar: "Quarterly: Adopt / Trial / Assess / Hold. Staff+ engineers drive this."
      make_or_buy: >
        Build: core differentiator, deep customization needed, or lock-in risk critical.
        Buy/OSS: commodity capability, active community.
    postmortems_and_incidents:
      blameless_principle: "People operate in systems that produce failures. Fix the system."
      five_whys: "Ask 'why' 5 levels deep before proposing a fix."
      follow_through: "Postmortems without completed action items are theater."
    influence_without_authority:
      rfc_process:
        when: "Any decision affecting multiple teams or lasting >6 months."
        format: |
          ## Problem Statement
          ## Proposed Solution
          ## Alternatives Considered (min 2)
          ## Trade-offs
          ## Open Questions
          ## Migration Plan (if applicable)
      sponsorship: "Actively create visibility for strong engineers. Advocacy, not just coaching."
      disagree_and_commit: "Engage fully in the decision. Once decided, execute with full commitment."
    toil_reduction:
      definition: "Repetitive, automatable, tactical work that scales with traffic. Keep below 50%."
      toil_ratio: "Target <30% of engineering time."
      elimination_order: ["Automate it", "Eliminate root cause", "Hand off to platform team", "Accept with plan+owner"]
    evolutionary_architecture:
      fitness_functions: >
        Automated checks that verify architectural characteristics.
        Examples: p99 latency <200ms, no circular deps, coverage >70%, bundle size <300KB.
        Run in CI/CD. Failing fitness function blocks deployment.
      last_responsible_moment: "Defer irreversible decisions until last responsible moment. More context = better decisions."
    staff_anti_patterns:
      ivory_tower_architect: "Designs systems they never implement or operate."
      brilliant_jerk: "Technically excellent, organizationally destructive. Net negative."
      hero_mode: "Rescues every incident; never builds systems that prevent them."
      scope_hoarding: "Accumulates work to stay relevant instead of delegating with growth intent."
      consensus_paralysis: "Seeks 100% agreement before deciding. Type 2 needs 70% alignment."
      resume_driven_development: "Chooses technology for career value, not problem fit."

  # ─────────────────────────────────────────────
  # DOMAIN-DRIVEN DESIGN — STRATEGIC + TACTICAL
  # Sources: DDD - Evans (2003), Implementing DDD - Vernon (2013)
  # ─────────────────────────────────────────────
  domain_driven_design:
    book_references:
      - "Domain-Driven Design - Evans (2003)"
      - "Implementing DDD - Vernon (2013)"
    strategic_patterns:
      bounded_context: "Primary DDD unit. A boundary within which a particular domain model applies."
      ubiquitous_language: "Shared vocab used by developers AND domain experts. Code names must match domain words."
      context_mapping:
        anticorruption_layer: "Downstream insulates from upstream via translation. Preferred for legacy."
        open_host_service: "Upstream publishes stable, documented integration protocol."
        published_language: "Formal exchange language (JSON Schema, Protobuf, OpenAPI)."
        shared_kernel: "Two contexts share a small agreed model. High coupling — use rarely."
        conformist: "Downstream adopts upstream model wholesale."
        partnership: "Two contexts evolve together. Only for truly inseparable domains."
    tactical_patterns:
      aggregate: "Cluster treated as one unit. One Aggregate Root. Keep small (1-3 entities)."
      domain_event: "Something that happened (OrderPlaced). Immutable. Past tense. Enables eventual consistency."
      value_object: "Defined by attributes only. No identity. Immutable. (Money, Email, DateRange)"
      repository: "Abstracts persistence. One per aggregate root."
      domain_service: "Stateless op with no natural home. Use sparingly — often signals a missing concept."
    when_to_apply: >
      DDD is most valuable in complex domains with rich business rules.
      For CRUD-heavy systems, simpler patterns (Active Record, Transaction Script) fit better.

  # ─────────────────────────────────────────────
  # IMPLEMENTATION PRIORITY ORDER
  # ─────────────────────────────────────────────
  implementation_order:
    1: "Testing & error handling (immediate safety, highest ROI)"
    2: "Architecture boundaries + SOLID (structural quality foundation)"
    3: "Security by default + OWASP Top 10 (non-negotiable at any scale)"
    4: "DRY + KISS + Naming (reduce cognitive load)"
    5: "Defensive programming (protect system boundaries)"
    6: "TD management + refactoring mechanics"
    7: "CI/CD + DORA metrics + security gates"
    8: "Observability + SLOs (reduce MTTR 60%)"
    9: "API design standards (stable contracts)"
    10: "Data engineering: consistency models + partitioning strategy"
    11: "Advanced patterns: microservices, CQRS, Saga, event sourcing (context-dependent)"
    l7_l8_overlay: >
      At L7/L8, items 1-11 are table stakes. The unique contribution is:
      ADRs + RFCs, fitness functions, Conway-aware team design, toil elimination,
      evolutionary architecture, DDD strategic mapping, cross-team unblocking.

  # ─────────────────────────────────────────────
  # CONTEXT ADJUSTMENTS (EXPANDED IN v5)
  # ─────────────────────────────────────────────
  context_adjustments:
    startup_mvp:
      - "Coverage 50% initially; track TD for later (Accelerate: do not defer indefinitely)"
      - "Modular monolith. No microservices until justified."
      - "Basic security: parameterized queries, bcrypt passwords, HTTPS. Not full threat model."
      - "Simple observability: structured logs + one dashboard."
    enterprise_critical:
      - "Coverage >80% critical paths"
      - "Full observability with SLOs, error budgets, runbooks"
      - "Formal threat modeling per feature. SAST/DAST in CI."
      - "DORA elite tier as target (Accelerate)"
    legacy_modernization:
      - "Strangler Fig pattern for safe extraction (Newman)"
      - "Write characterization tests before touching legacy code"
      - "Refactor high-change areas first (Boy Scout Rule + Fowler)"
      - "Introduce observability early so you can see what is breaking"
      - "Anticorruption layer at legacy boundary (DDD context mapping)"
    greenfield_vs_legacy:
      greenfield:
        strengths: "No constraints. Can apply architecture correctly from day 1."
        risks: "Over-engineering. Solving imaginary scale problems. Premature optimization."
        guidance: >
          Start modular monolith. Apply screaming architecture. Set up CI/CD and
          security gates before writing domain code. Architecture decisions need ADRs.
          Avoid 'we might need to scale' microservices.
      legacy:
        strengths: "Real users. Real traffic. Real requirements. Revenue at risk = political will to change."
        risks: "Unknown invariants. Tests don't exist. Any change may break something."
        guidance: >
          Characterization tests first. Strangler Fig for extraction.
          No big rewrites — big rewrites fail. Anticorruption layers between old and new.
          Observability first — you can't improve what you can't see.
      maintenance_mode:
        strengths: "Stable. Known behavior."
        risks: "Entropy accumulation. No investment = growing attack surface + TD."
        guidance: >
          Security patches must flow in. Boy Scout Rule for incidental improvement.
          TD tracked even if not funded. Sunset plan documented.
    mobile_game:
      - "Game loop performance is non-negotiable. Profile before any optimization."
      - "60fps target on mid-range device. Degrade gracefully on low-end."
      - "Object pooling for frequently spawned entities (enemies, bullets, particles)."
      - "Message-passing async: Defold messages arrive next frame. Design for this."
      - "Security: server-side validation for all scores/leaderboards. Never trust client."
      - "Observability: analytics events (level_start, powerup_used, player_died) + server error logs."

