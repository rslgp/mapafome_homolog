# tap_visibility_robustness.yaml
#
# Plan for the second half of the tap-to-mark contract: making sure
# users on ANY device can clearly SEE where the marker will land before
# they press "Confirmar ponto". Complements map_click_compatibility.yaml
# (input pipeline) — this plan covers the visual feedback half.
#
# Failure mode to eliminate end-to-end:
#   User taps map → marker drops "somewhere" → user can't tell if/where
#   it landed (finger covering pin, low contrast on satellite tile,
#   tiny 20×20 icon, no acknowledgment) → presses "Confirmar ponto" →
#   wrong location submitted, OR user re-taps repeatedly chasing visual
#   confirmation that's never coming.
#
# Sibling files:
#   map_click_compatibility.yaml          → input pipeline (covered)
#   v5_0_compact_software_engineer_principles.yaml → quality bar
#   bugfixes.yaml                          → device-specific issues
#   changelog.yaml                         → completed work history

meta:
  version: 1
  last_updated: "2026-04-29"
  scope: "Visual + workflow feedback for the tap-to-mark flow"
  out_of_scope: "Input pipeline robustness (covered by map_click_compatibility.yaml)"
  related_docs:
    - LLM_BRAIN/map_click_compatibility.yaml
    - LLM_BRAIN/design_brief.yaml
    - LLM_BRAIN/v5_0_compact_software_engineer_principles.yaml
  files_in_scope:
    - src/app/components/compatibility/components/mapComponents.js
    - src/app/components/compatibility/components/map.js
    - src/app/components/compatibility/components/MainControls.js
    - src/app/components/compatibility/components/mapConstants.js
    - src/app/components/compatibility/App.js
    - src/app/components/compatibility/App.css
    - src/app/globals.css


# ─── Goal ─────────────────────────────────────────────────────────────────

goal: >
  On every device class (small phone → desktop), tapping the map MUST
  produce three signals before "Confirmar ponto" is reached:
    1) Visual — the user can see exactly where the pin landed, even
       through their own finger or on a busy tile background.
    2) Stateful — the "Confirmar ponto" button reflects the readiness
       to submit (idle vs marker-ready vs submitting).
    3) Verifiable — the resolved coordinates are surfaced somewhere
       the user can read before submitting.

success_criteria:
  - "On any device, the user can place a marker and confidently tell where it is BEFORE pressing Confirmar ponto."
  - "If the tap pipeline degrades (e.g., a fallback path fired) the user still sees the same confirmation."
  - "Zero submit-the-wrong-spot incidents in user reports."
  - "Lighthouse a11y score ≥ 95 (WCAG 2.1 AA on the tap-to-confirm flow)."


# ─── Current state (audit) ────────────────────────────────────────────────

current_state:
  input_pipeline:
    status: "hardened"
    primary_path: "PointerEvent (pointerdown→up) on the leaflet container"
    fallback_paths:
      - "Leaflet native click event (rslgp/mapafome legacy path)"
      - "Leaflet contextmenu (desktop right-click + Android long-press)"
    cross_device_features:
      - "isPrimary multitouch filter"
      - "setPointerCapture / lostpointercapture recovery"
      - "passive pointermove for scroll perf"
      - "visibilitychange cleanup for backgrounded tabs"
      - "matchMedia (pointer: coarse) → 14px tolerance vs 10px fine"
      - "isFiniteLatLng defensive guard at boundary"
      - "touch-action: manipulation on .leaflet-container"
    public_signal: "mdf:marker-placed CustomEvent on document"
    tracking: "trackMapTap, trackMapLongPress, trackMapTapSkipped"
    file: "src/app/components/compatibility/components/mapComponents.js"

  visual_feedback:
    marker_icon: "ICONS.CURRENT_LOCATION_SMALL — 20×20 small blue dot"
    drop_animation:
      class: ".mdf-dropped-pin"
      effect: "scale 0 → 1.1 → 1.0 over 240ms ease-out-back"
      file: "src/app/components/compatibility/App.css"
    persistent_marker: "L.marker stored in lastMarkedRef + envVariables.lastMarked"

  confirmar_ponto_button:
    file: "src/app/components/compatibility/components/MainControls.js:244-250"
    current_state: "Plain native button, always enabled, no marker awareness"
    handler: "App.js:386 handleClickMap — reads envVariables.lastMarked.getLatLng()"
    fallbacks_in_handler:
      - "Marker present → use marker latlng"
      - "No marker, GPS available → confirm() prompt then use GPS"
      - "Neither → friendly alert"


# ─── Gap analysis (what's missing for SEE) ────────────────────────────────

gaps:
  - id: G1
    severity: high
    description: >
      The 20×20 pin is smaller than the average fingertip (40–50px on
      small phones). On the device that matters most for our humanitarian
      use case (mid/low-range Android, e.g. Samsung A23/A54, mid-range
      iPhones), the user's finger covers the marker entirely.
    affects: "All touchscreens, especially small phones"
    user_visible_symptom: "User taps and isn't sure if/where the pin landed"

  - id: G2
    severity: high
    description: >
      No haptic feedback. iOS Safari (PWA only) and Android Chrome
      support navigator.vibrate(); a 30–50ms pulse is the cheapest
      cross-device confirmation that an action was registered.
    affects: "Touchscreens with vibration motors (effectively every phone)"

  - id: G3
    severity: high
    description: >
      The "Confirmar ponto" button shows the same UI whether or not a
      marker is set. Users on devices with intermittent tap quirks
      cannot distinguish "I tapped but the system didn't notice" from
      "I tapped and it worked, just press confirm".
    affects: "All devices"

  - id: G4
    severity: medium
    description: >
      The resolved coordinates are not displayed anywhere. Power users
      and developers cannot verify which lat/lng will be submitted.
      Also blocks accurate user reports ("I tapped at the corner of X
      and Y but it submitted Z").
    affects: "All devices"

  - id: G5
    severity: medium
    description: >
      No screen-reader announcement on tap. Per WCAG 2.1 SC 4.1.3
      Status Messages, the marker drop is a status change that should
      be announced via aria-live.
    affects: "VoiceOver (iOS), TalkBack (Android), NVDA/JAWS (Windows)"

  - id: G6
    severity: medium
    description: >
      No way to clear/reset the marker without dragging or page reload.
      A wrong tap is sticky until either a new tap or the page reload.
      "Reset" affordance reduces frustration on coarse-pointer hardware.
    affects: "Touchscreens (coarse pointer, mistap likelihood higher)"

  - id: G7
    severity: low
    description: >
      The blue pin can blend into the satellite tile layer (water bodies,
      dark urban backgrounds). A 1px white stroke + drop shadow lifts it
      off any background.
    affects: "All devices when satellite tile layer is selected"

  - id: G8
    severity: low
    description: >
      No 'undo' for accidental long-press. Once ReportSheet opens, user
      committed; closing the sheet doesn't remove the marker. Minor.
    affects: "All touchscreens"


# ─── Phased plan ──────────────────────────────────────────────────────────
# Each phase is independently shippable. P1 has the highest visibility
# return per LOC; P4 covers the long tail.

phases:
  # ───────────────────────────────────────────────────────────────────────
  P1_immediate_visibility:
    rationale: >
      The fastest path to "user can SEE where their pin landed" is making
      the pin survive the finger occlusion. Two changes — a pulse halo
      and haptic feedback — collectively address G1 and G2 in <1 day.
    items:
      - id: TV-1
        title: "Pulsing halo around the dropped pin"
        gap: G1
        priority: P0
        type: visual
        estimate: "2 hours"
        approach: >
          Reuse the existing .mdf-ping-ring pattern (already in
          map.js post-publish ring). Mount a second non-interactive
          L.divIcon marker at the dropped pin's coords with a 600ms
          ease-out animation that pulses 0px → 80px circle with
          opacity 1 → 0. The ring expands past the finger (~50px),
          remains visible after the finger lifts, then fades.
        files_changed:
          - src/app/components/compatibility/components/map.js (handleMapClick)
          - src/app/components/compatibility/App.css (.mdf-marker-pulse animation)
        acceptance:
          - "Tapping the map produces a visible expanding ring even with finger held down"
          - "Ring fades by 600ms — does not clutter subsequent taps"
          - "Ring is below the marker icon (z-index) so it does not steal interactivity"
          - "Reuse the existing ping-ring CSS structure (DRY)"

      - id: TV-2
        title: "Haptic vibration on successful tap"
        gap: G2
        priority: P0
        type: tactile
        estimate: "30 minutes"
        approach: >
          In mapComponents.js dispatchMarkerPlaced (already centralized),
          call navigator.vibrate(40) when available. Defensive feature
          detection (typeof navigator.vibrate === 'function') because
          iOS Safari (non-PWA) lacks the API. Long-press already has
          its own haptic via ReportSheet open animation.
        files_changed:
          - src/app/components/compatibility/components/mapComponents.js
        acceptance:
          - "Android Chrome: 40ms vibration on every successful tap"
          - "iOS PWA: 40ms vibration"
          - "iOS Safari (non-PWA): silent no-op (no error in console)"
          - "Desktop: silent no-op (mouse pointerType skipped to avoid spam on bluetooth phones in use)"
        risks:
          - "Aggressive vibration drains battery — keep at 40ms, single pulse"
          - "Some users disable vibration system-wide — feature is purely additive"

  # ───────────────────────────────────────────────────────────────────────
  P2_coord_confirmation:
    rationale: >
      Once the marker is visible, surface the actual lat/lng + the
      reverse-geocoded short label so the user can verify before
      submitting. Closes G4.
    items:
      - id: TV-3
        title: "Live coordinate readout pill"
        gap: G4
        priority: P1
        type: ui
        estimate: "3 hours"
        approach: >
          Small fixed-position pill above MainControls (or floating
          bottom-right of the map) showing "📍 -8.067, -34.876" the
          moment a marker is placed. Listens to the public
          mdf:marker-placed CustomEvent — no prop drilling. Replaced
          by reverse-geocoded city/neighborhood name once
          leaflet-geosearch completes (already wired).
        files_changed:
          - src/app/components/compatibility/components/PinReadout.js (new, ~40 LOC)
          - src/app/components/compatibility/components/InfoPanel.js or App.js (mount)
          - src/app/components/compatibility/App.css (pill styling)
        acceptance:
          - "Pill appears within 100ms of every marker placement"
          - "Pill text updates with reverse geocoding when available"
          - "Pill uses high-contrast tokens — readable on all tile layers"
          - "Pill is read-only (no copy button on small screens — keep KISS)"
          - "Pill clears when marker is removed (TV-7 reset flow)"

      - id: TV-4
        title: "Tap-on-pill copies coords to clipboard"
        gap: G4
        priority: P3
        type: ui
        estimate: "1 hour"
        status: in_review
        shipped: >
          PinReadout coord text is now a <button>. Click → clipboard write
          via navigator.clipboard.writeText with a fallback to
          document.execCommand('copy') for legacy webviews. On success the
          label flips to "✓ copiado" for 1500 ms then reverts. Defensive
          three-tier fallback (modern → legacy → silent no-op) means the
          feature works on every clipboard-capable device and degrades
          silently on the rest.
        files_changed:
          - src/app/components/compatibility/components/PinReadout.js
          - src/app/components/compatibility/App.css (.mdf-pin-readout__coords button styling)
        acceptance_met:
          - "[done] Modern clipboard API path"
          - "[done] Legacy execCommand fallback for old webviews"
          - "[done] Visible 'copiado' feedback with timed revert"
          - "[done] aria-label includes the actual coords for screen readers"

  # ───────────────────────────────────────────────────────────────────────
  P3_workflow_state:
    rationale: >
      Make the entire workflow legible: button reflects readiness,
      reset is reachable. Closes G3 + G6.
    items:
      - id: TV-5
        title: "Confirmar ponto reflects marker state"
        gap: G3
        priority: P1
        type: ui_state
        estimate: "2 hours"
        approach: >
          Subscribe MainControls (or App.js) to mdf:marker-placed
          CustomEvent. Maintain a local hasMarker boolean. When
          false, render the button with:
            • aria-disabled="true" (semantics, not full disable —
              keep clickable so the GPS-fallback prompt path still
              works for users who never tap the map)
            • Visually subdued styling (lower contrast)
            • Updated label "Toque no mapa primeiro" or kept label
              with subtitle
          When true: button highlights with primary color + ✓ icon.
        files_changed:
          - src/app/components/compatibility/components/MainControls.js
          - src/app/components/compatibility/App.css
        acceptance:
          - "Button is visually subdued before any tap"
          - "Button highlights immediately after first successful tap"
          - "Button still triggers handleClickMap when subdued (GPS fallback intact)"
          - "Screen reader announces state via aria-disabled change"
        anti_patterns_to_avoid:
          - "Hard disable={!hasMarker} — would break the GPS fallback path"
          - "Hiding the button when no marker — loses discoverability"

      - id: TV-6
        title: "Reset / clear marker affordance"
        gap: G6
        priority: P2
        type: ui
        estimate: "1.5 hours"
        approach: >
          Tiny 'Limpar' link/button next to the coordinate pill (TV-3).
          On click: removes the lastMarked marker via marker.remove(),
          clears envVariables.lastMarked, dispatches a
          mdf:marker-cleared CustomEvent (counterpart to placed).
          Receivers (Confirmar ponto button) flip back to subdued.
        files_changed:
          - src/app/components/compatibility/components/PinReadout.js (add reset button)
          - src/app/components/compatibility/components/mapComponents.js (export MARKER_CLEARED_EVENT)
          - src/app/components/compatibility/components/map.js (expose clear via ref or handler)
        acceptance:
          - "Reset link present when marker exists, hidden otherwise"
          - "Click clears marker, pill, button state in one operation"
          - "No visible flash / layout shift on clear"

  # ───────────────────────────────────────────────────────────────────────
  P4_accessibility_and_long_tail:
    rationale: >
      Final mile: WCAG compliance + tile-layer edge cases.
    items:
      - id: TV-7
        title: "aria-live announcement on tap"
        gap: G5
        priority: P2
        type: a11y
        estimate: "1 hour"
        approach: >
          Single aria-live='polite' element (visually hidden) elsewhere
          in App.js. Subscribe to mdf:marker-placed; set its text to
          'Ponto marcado em [reverse-geocoded label]' for screen
          readers. Throttle to 1 announcement per 500ms to avoid
          spamming on rapid re-taps.
        files_changed:
          - src/app/components/compatibility/App.js (add hidden live region)
        acceptance:
          - "VoiceOver, TalkBack, NVDA all announce after tap"
          - "Visually hidden (sr-only) — no layout impact"
          - "Throttled — multiple rapid taps do not queue 5 announcements"
          - "Lighthouse a11y score does not regress"

      - id: TV-8
        title: "Pin halo + drop shadow for tile-agnostic visibility"
        gap: G7
        priority: P3
        type: visual
        estimate: "30 minutes"
        approach: >
          Add a 1px white stroke + 0 0 4px rgba(0,0,0,0.3) drop shadow
          to .leaflet-marker-icon.current-location-small via App.css.
          Lifts the pin off any tile color (water, dark urban, satellite
          imagery). Same fix used by Google Maps' My Location pin.
        files_changed:
          - src/app/components/compatibility/App.css
        acceptance:
          - "Pin readable on Waze, OSM, and Satellite tile layers"
          - "No regression on existing icons (scoped class selector)"

      - id: TV-9
        title: "Long-press undo affordance"
        gap: G8
        priority: P3
        type: ui
        status: covered_by_TV-6
        rationale: >
          With TV-6 shipped, the long-press case is already handled.
          Long-press → handleMapLongPress → onPinDropped opens ReportSheet
          AND drops a marker (handleMapClick is invoked too via the same
          path). Once the marker exists, the PinReadout pill renders with
          the "Limpar" reset button. If the user closes the sheet without
          publishing, they can tap "Limpar" to remove the stray marker.
          That is the practical undo affordance G8 was asking for, and
          it costs zero new code. The deeper "ReportSheet exit clears
          marker automatically" concern stays in design_brief.yaml as a
          separate UX call.
        files_changed: []
        acceptance_met:
          - "[done] User can clear an unwanted long-press marker via Limpar (TV-6)"
          - "[deferred] Auto-clear on ReportSheet close — design_brief decision"


# ─── Cross-device verification matrix ─────────────────────────────────────
# Maps each device class to which TV-* items are critical for that device.

device_verification:
  - device_class: "Small Android (Samsung A23, A54, Xiaomi Redmi)"
    critical_items: [TV-1, TV-2, TV-5]
    verification_steps:
      - "T1 from map_click_compatibility.yaml"
      - "Tap with thumb, hold finger down — confirm pulse halo (TV-1) is visible"
      - "Lift finger — confirm vibration occurred (TV-2)"
      - "Confirm Confirmar ponto button changed appearance (TV-5)"
    notes: "Highest-priority device class — finger occlusion is worst here"

  - device_class: "iPhone (15+, X+, SE 2nd gen)"
    critical_items: [TV-1, TV-3, TV-5, TV-7]
    verification_steps:
      - "PWA installed + Safari tab modes both"
      - "Same as Android, plus VoiceOver test (TV-7)"
      - "iOS Safari: no vibration expected (TV-2 silent no-op)"
      - "iOS PWA: vibration expected (TV-2 active)"

  - device_class: "iPad (any)"
    critical_items: [TV-1, TV-3, TV-5, TV-7]
    verification_steps:
      - "Larger screen — finger occlusion less critical but TV-1 still helps"
      - "Test split-view to ensure pill (TV-3) doesn't overflow"

  - device_class: "Desktop (Chrome / Firefox / Safari)"
    critical_items: [TV-3, TV-5, TV-8]
    verification_steps:
      - "Mouse cursor doesn't occlude — TV-1 and TV-2 are nice-to-have"
      - "Pill (TV-3) confirms coords — important for power users"
      - "Right-click drops marker via contextmenu — verify TV-5 reacts"
      - "Tile-layer halo (TV-8) — switch to satellite, confirm pin visible"

  - device_class: "Touchscreen Windows laptop (Surface, Yoga)"
    critical_items: [TV-1, TV-2, TV-5]
    verification_steps:
      - "Touch tap should fire vibration (Windows haptic API support varies)"
      - "Pen tap should also work — pointerType === 'pen'"

  - device_class: "Low-end Android (KaiOS, Android Go)"
    critical_items: [TV-1, TV-5]
    verification_steps:
      - "Lower CPU — pulse animation must not jank (CSS-only, GPU-composited)"
      - "Vibration motor may be absent — TV-2 silent no-op"


# ─── Implementation order ─────────────────────────────────────────────────

implementation_order:
  recommended_sequence:
    - "Sprint 1: TV-1 (pulse halo) + TV-2 (haptic) — fastest visible win"
    - "Sprint 1: TV-5 (button state) — closes the workflow loop"
    - "Sprint 2: TV-3 (pill) + TV-7 (a11y) — verifiable + accessible"
    - "Sprint 3: TV-6 (reset) + TV-8 (halo)"
    - "Defer: TV-4 (clipboard), TV-9 (long-press undo)"
  total_effort: "~9 hours of code + 2-3 hours device QA"
  ship_unit: "Each TV-* is independently shippable; no cross-item blockers"


# ─── Risks and trade-offs ─────────────────────────────────────────────────

risks:
  - id: R1
    risk: "Pulse halo (TV-1) animations cause jank on low-end Android"
    likelihood: low
    mitigation: "Use CSS transforms only (translate, scale, opacity) — GPU compositor handles them"
    fallback: "Accept reduced framerate; dropping a frame is acceptable for a 600ms one-shot"

  - id: R2
    risk: "Haptic vibration (TV-2) annoys users who keep phone in pocket"
    likelihood: medium
    mitigation: >
      Single 40ms pulse — well below the 'notification' duration.
      User can disable system-wide via OS settings. No need for an
      in-app toggle (KISS — most users will not need it).
    measurement: "If support requests come in, add a toggle in /apoiar settings"

  - id: R3
    risk: "Coordinate pill (TV-3) overlaps map controls on small screens"
    likelihood: medium
    mitigation: >
      Position above InfoPanel rather than over the map. Use
      max-width with truncation for long reverse-geocoded labels.

  - id: R4
    risk: "Confirmar ponto state change (TV-5) confuses users who relied on the button being always-active for the GPS fallback"
    likelihood: low
    mitigation: >
      Use aria-disabled (semantic) instead of disabled (functional).
      Button stays clickable; subdued styling only signals 'no marker yet'.

  - id: R5
    risk: "Reset affordance (TV-6) accidentally clears the marker via mistap"
    likelihood: low
    mitigation: "Place reset button away from primary action; require small intentional tap"

  - id: R6
    risk: "aria-live (TV-7) spam during rapid re-tapping"
    likelihood: medium
    mitigation: "Throttle to 1 announcement per 500ms; aria-live='polite' queues without interrupting user"

  - id: R7
    risk: "TV-8 white stroke + shadow disrupts existing custom icons"
    likelihood: low
    mitigation: "Scope CSS selector tightly (.current-location-small only) — do not affect ICONS.HUB / GREEN / RED"


# ─── Public APIs introduced or relied on ──────────────────────────────────

public_apis:
  already_in_place:
    - name: "MARKER_PLACED_EVENT"
      file: "src/app/components/compatibility/components/mapComponents.js"
      type: "DOM CustomEvent"
      detail: "{ lat, lng, source, ts }"
      consumers_planned: [TV-3, TV-5, TV-7]
    - name: "envVariables.lastMarked"
      file: "src/app/components/compatibility/components/variaveisAmbiente.js"
      type: "module-scoped global (Leaflet marker | undefined)"
      consumers: ["App.js handleClickMap (read)", "CoffeeMap.handleMapClick (write)"]

  new_to_introduce:
    - name: "MARKER_CLEARED_EVENT"
      file: "src/app/components/compatibility/components/mapComponents.js"
      type: "DOM CustomEvent"
      detail: "{ ts }"
      purpose: "Signal reset (TV-6); receivers flip state back"
      added_in: TV-6


# ─── Verification protocol ────────────────────────────────────────────────

verification:
  per_phase:
    P1:
      manual:
        - "On Samsung A23: tap map, verify pulse halo expands past finger and fades by 600ms"
        - "On iPhone 13 Safari: tap map, verify haptic does NOT fire (no console error)"
        - "On iPhone 13 PWA: tap map, verify haptic fires"
        - "On Pixel 6: tap map, verify haptic fires"
      automated:
        - "test/mapClickHandler.test.js — assert dispatchMarkerPlaced still fires"
        - "Add test: assert navigator.vibrate is called when present"

    P2:
      manual:
        - "Tap map, verify pill appears with rounded coords"
        - "Wait 1s, verify pill updates with reverse-geocoded label"
        - "Resize window — pill stays within bounds, no horizontal scroll"
      automated:
        - "Add test: PinReadout responds to mdf:marker-placed event"

    P3:
      manual:
        - "Open app fresh — Confirmar ponto button is subdued"
        - "Tap map — button highlights"
        - "Click reset — button returns to subdued, pill clears"
      automated:
        - "RTL test: button has aria-disabled='true' before tap, 'false' after"

    P4:
      manual:
        - "Enable VoiceOver / TalkBack — tap map, hear announcement"
        - "Switch to Satellite tile layer — pin still visible"
      automated:
        - "Lighthouse a11y score on /index ≥ 95 (gated in CI via npm run a11y)"

  device_smoke_test:
    when: "Before merging any TV-* PR"
    devices: "Minimum: Samsung A23, iPhone (any), desktop Chrome"
    duration: "5 minutes per device"


