  # ─────────────────────────────────────────────
  # WHAT "RELATAR" DOES (end-to-end behavior of the reporter flow)
  # ─────────────────────────────────────────────
  relatar_flow:
    summary: >
      "Relatar" is the reporter path: a passerby marking the location of
      someone in street situation who needs help, in three actions. It never
      asks for identity, never requires an account, never leaves the map.

    entry_points:
      - label: "Header [Relatar] pill (brand red)"
        trigger: "click on the header button"
        coords_source: "envVariables.lastMarked → GPS → map center (whichever is first available)"
        handler: "App.js handleOpenReportSheet"
        analytics: "pin_report_started { entry_point: 'fab' }"
      - label: "Mobile FAB (+, 60×60 bottom-right, hidden ≥768px)"
        trigger: "tap the floating action button"
        coords_source: "same as header button"
        handler: "App.js handleOpenReportSheet"
        analytics: "pin_report_started { entry_point: 'fab' }"
      - label: "Map long-press / right-click"
        trigger: "long-press on touch, right-click on desktop"
        coords_source: "the tapped latlng"
        handler: "mapComponents.js MapClickHandler onMapLongPress → App.js handlePinDroppedOnMap"
        side_effects:
          - "drops the placeholder marker with the 240ms ease-out-back scale animation"
          - "suppresses the native browser context menu"
        analytics: "pin_report_started { entry_point: 'map_long_press' }"
      - label: "Tutorial chooser — 'Vi alguém precisando'"
        trigger: "pick the reporter flow in the first-visit guided tour"
        analytics: "pin_report_started { entry_point: 'tour_reporter' }"

    step_2_and_3_sheet:
      component: "src/app/components/compatibility/components/ux/ReportSheet.js"
      layout:
        mobile: "bottom sheet, 70dvh initial, draggable handle snaps to 70% or 95%"
        desktop: "right-side panel, 400px wide, full-height"
      content_top_to_bottom:
        - "drag handle (mobile only, 48×16 hit target)"
        - "title: 'O que a pessoa precisa agora?'"
        - "subtitle: 'Você pode escolher mais de uma.'"
        - "location preview: 'Ponto em: {lat}, {lng}'"
        - "category chips (multi-select): 🍞 Comida · 💧 Água · 👕 Roupa · 🧼 Higiene · 🏠 Abrigo"
        - "collapsed expander: Adicionar detalhe (opcional) — placeholder 'Ex: idoso, perto da farmácia'"
        - "collapsed expander: Seu contato — opcional — placeholder 'Ex: (81) 99999-0000 ou @seuperfil'"
        - "primary [Publicar ponto] + tertiary [Cancelar]"
      validation:
        - "zero categories → inline error above chips: 'Escolha pelo menos uma necessidade.' (does not block the sheet)"
      chip_state:
        - "unchecked: border + white bg"
        - "checked: filled bg + border emphasis + ✓ mark (never color-alone)"
      accessibility:
        - "role=checkbox + aria-checked per chip"
        - "role=dialog + aria-modal on sheet; ESC closes (unless publishing)"
        - "focus moves to first chip on open; returns to trigger on close"
        - "backdrop touch-action:none blocks Leaflet gestures on iOS Safari"

    publish_behavior:
      button_states:
        idle: "'Publicar ponto' — brand red"
        publishing: "'Publicando…' with inline spinner (≤100ms after tap)"
        success: "'Publicado ✓' on green for 1.2s, then sheet closes"
        error: "'Tentar de novo'; inline error: 'Não foi possível publicar. Verifique sua conexão e tente de novo.'"
      writer: "App.js writePinToSheets (low-level; shared with queue flush)"
      payload:
        schema: "existing Dados JSON blob in Google Sheet row"
        fixed_fields:
          - "Roaster = 'MoradorRua' (so legacy filters keep working)"
          - "DateISO = new Date().toISOString()"
          - "Coordinates = JSON-stringified [lat, lng]"
          - "Avaliacao scaffold (1..5 zeroed)"
          - "AlimentoEntregue = 0"
        m1_extensions:
          - "Categorias = string[] (e.g., ['comida','agua'])"
          - "Detalhe = optional free-text (omitted if blank)"
          - "RedeSocial = optional reporter contact (omitted if blank)"
      side_effects_on_success:
        - "pin_report_published event fires with { categories, has_detail, has_contact, time_from_start_ms }"
        - "map recenters on the published coords via pingCoords effect"
        - "one-shot 600ms ping-ring animation at those coords (no loop)"
        - "cell B1 of the sheet is stamped with new Date().toISOString() for cheap freshness checks"
      offline_behavior:
        - "navigator.onLine === false → enqueue payload in IndexedDB (mdf_publish_queue)"
        - "toast: 'Você está sem internet. O ponto foi salvo e será enviado quando a conexão voltar.'"
        - "network-shaped errors after online attempt → same enqueue fallback"
        - "online event → drain queue via bindOnlineFlush; result toast summarises succeeded/failed counts"

    dignity_invariants_enforced:
      - "no person name, photo, age, gender, or health status is requested"
      - "reporter contact is optional + explicitly labeled '(opcional)'"
      - "no share prompt, no gamification, no celebration on success"
      - "anonymous — no account required, works forever for walk-up users"

    three_step_invariants_preserved:
      - "entry → category pick → publish fits within ≤ 5 taps from cold landing"
      - "no step is a full-page navigation on mobile; map stays visible behind the sheet"
      - "step 3 confirm label is always 'Publicar ponto', never 'OK' / 'Submit' / 'Done'"

