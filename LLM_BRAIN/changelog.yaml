  ios_blue_pin_misplaced_fix:
    status: "done"
    summary: "iPhone tap → blue pin landed at the wrong latlng (and that wrong latlng was what 'Confirmar ponto' published). Race between iOS chrome-collapse and Leaflet's cached pixel origin."
    root_cause: >
      MapSizeInvalidator listens to visualViewport.resize, but that event
      fires AFTER the address bar has already collapsed and the user has
      tapped. By the time invalidateSize() runs, Leaflet has already
      handed us a stale `e.latlng` for the click. The blue pin is then
      placed at that stale latlng — visually off-target — and writePinToSheets
      reads from envVariables.lastMarked.getLatLng() so the published
      coords are wrong too.
    fix:
      - "MapClickHandler now calls map.invalidateSize({animate:false,pan:false}) at the START of every click/contextmenu handler, then re-derives the latlng from the original DOM event's clientX/Y against the live getBoundingClientRect — not from Leaflet's cached `e.latlng`."
      - "Falls back to changedTouches[0] when the synthetic click event lacks clientX/Y (rare on iOS Safari)."
      - "Re-imported `L` for L.point(); MapSizeInvalidator stays as the secondary safety net for when no click happens but the size genuinely changed."
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"
    why_safe:
      - "invalidateSize with pan:false animate:false is a no-op when size is unchanged, so the desktop path pays nothing."
      - "Re-deriving latlng from clientX/Y on the live rect is exactly what Leaflet does internally, just without the cache."

  sponsor_slot_tdz_crash_fix:
    status: "done"
    summary: "Client-side exception on every page load — SponsorSlot.js B11 useEffect referenced `pool` before its const declaration (temporal dead zone)"
    root_cause: >
      The B11 fix added a useEffect that iterates `pool` to schedule a
      precise expiry timer. I placed it BEFORE the `const { region, pool }
      = useMemo(...)` declaration. JavaScript const bindings are in the
      temporal dead zone until their declaration line executes, so reading
      `pool` from the new effect's dependency array threw
      ReferenceError: Cannot access 'pool' before initialization.
      Crash happened on initial render of every surface that mounts
      SponsorSlot (InfoPanel footer, /apoiar, /iniciativas).
    fix:
      - "Moved the new useEffect AFTER the useMemo that declares { region, pool }. Hook order is otherwise preserved."
    files_changed:
      - "src/app/components/compatibility/components/ux/SponsorSlot.js"

  ios_hardening_regression_fix:
    status: "done"
    summary: "Reverted three over-aggressive rules from the iOS hardening pass that caused fresh regressions: Android could not scroll the page, iOS could not drop the blue map pin"
    regressions_fixed:
      - symptom: "Android Chrome: vertical swipe-to-scroll did not move the page"
        root_cause: "globals.css applied `overscroll-behavior: contain` on html, body. Combined with the existing `overflow-x: hidden` on the same elements + sticky header, Chrome's scroll-container resolution broke and the document stopped scrolling."
        fix: "Removed `overscroll-behavior: contain` from html, body. Per-surface usage (sheets, list panels) was already in place and is sufficient."
      - symptom: "iOS Safari: tapping the map no longer dropped the blue CURRENT_LOCATION_SMALL pin"
        root_cause: "globals.css applied `-webkit-touch-callout: none; -webkit-user-select: none; user-select: none` to .leaflet-container *. Leaflet itself already sets user-select:none on .leaflet-container in leaflet.css; the descendant-wide selector was redundant and on iOS WebKit it interfered with click event propagation through interactive children."
        fix: "Narrowed selector to .leaflet-container alone, kept only `-webkit-touch-callout: none` (the long-press callout suppression we actually wanted)."
      - symptom: "Constant CSS-var recalc on Android during page scroll"
        root_cause: "IosKeyboardInset.js subscribed to visualViewport.scroll, which fires on every page-scroll event on Android Chrome (different semantics from iOS where keyboard adjusts visualViewport via resize)."
        fix: "Removed the `scroll` listener; kept only `resize` which is what actually fires when the iOS keyboard opens/closes."
    files_changed:
      - "src/app/globals.css"
      - "src/app/components/compatibility/components/ux/IosKeyboardInset.js"

