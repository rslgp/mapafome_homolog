  safari_map_click_fix:
    status: "done"
    summary: "Map tap on Safari (desktop + iOS) wasn't dropping the blue pin — regression in hit-testing"
    root_cause: >
      ICONS.CURRENT_LOCATION is a 150x150 halo Marker rendered at the map
      center with interactive={false}. Leaflet only assigns
      pointer-events:auto to elements carrying the .leaflet-interactive
      class; it does NOT set pointer-events:none on non-interactive marker
      icons. Browsers' default for <img> is pointer-events:auto, so the
      halo still absorbed taps before they bubbled to the Leaflet map's
      click listener. Chrome/Firefox hit-test the transparent PNG as a
      pass-through; Safari does not, which is why the bug was
      Safari-specific.
    changed:
      - path: "src/app/components/compatibility/App.css"
        change: "Added .leaflet-marker-icon:not(.leaflet-interactive) { pointer-events: none !important } so the halo (and any other non-interactive marker) stops eating taps"
      - path: "src/app/components/compatibility/components/map.js"
        change: "Removed dead eventHandlers={{click:e=>e.preventDefault()}} from the non-interactive CURRENT_LOCATION Marker (interactive=false ⇒ Leaflet never wires the click event anyway)"
    verified:
      - "handleMapClick in map.js now receives the click event on Safari and drops the CURRENT_LOCATION_SMALL pin + stores envVariables.lastMarked"
      - "Interactive markers (reporter pins, clusters, bean markers) still carry .leaflet-interactive and remain clickable"

