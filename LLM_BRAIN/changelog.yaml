  # MONETIZATION — Phase 1.1: description + placement + carousel
  # ─────────────────────────────────────────────
  monetization_phase_1_1:
    status: "shipped"
    summary: >
      Extended the sponsor data model with a 150-char description, an explicit
      placement field, and carousel rotation when >1 sponsor is eligible for a
      given (region, placement).
    modified:
      - path: "src/app/components/compatibility/components/ux/sponsors.js"
        changes:
          - "added PLACEMENTS export (info-panel-footer, info-panel-parceiros, apoiar-grid, initiatives-footer)"
          - "added description field (HARD LIMIT 150) + clampDescription() for render-time safety"
          - "replaced pickSponsor(regionSlug) signature with eligibleSponsors(placement, regionSlug) — returns full weighted-ordered array for carousel use; pickSponsor(placement, regionSlug) kept as single-pick"
          - "each sponsor entry now carries a placements[] so the same brand can appear in multiple slots"
      - path: "src/app/components/compatibility/components/ux/SponsorSlot.js"
        changes:
          - "accepts a placement prop (defaults to INFO_PANEL_FOOTER)"
          - "fetches pool via eligibleSponsors(); renders static for 1 sponsor, rotates for >1"
          - "auto-advance 7s default; pauses on hover + focus; respects prefers-reduced-motion"
          - "renders description paragraph under the banner (clamped to 150 chars)"
          - "dot navigation for manual selection with aria-selected + focus-visible ring"
          - "impression dedup per-session by {id|placement} so carousel views don't double-count an already-seen brand"
          - "sponsor_impression + sponsor_click payloads now include placement"
      - path: "src/app/components/compatibility/components/ux/SponsorSlot.css"
        changes:
          - "added .mdf-sponsor__head (label + 'n / N' counter)"
          - "added .mdf-sponsor__desc, .mdf-sponsor__dots, .mdf-sponsor__dot(—on) styles"
      - path: "src/app/components/compatibility/components/ux/analytics.js"
        change: "trackSponsorImpression + trackSponsorClick now forward the placement property"
      - path: "src/app/components/compatibility/components/InfoPanel.js"
        change: "<SponsorSlot placement={PLACEMENTS.INFO_PANEL_FOOTER} /> — explicit slot binding"
      - path: "public/sponsors/README.md"
        change: "documented the new description/placements/carousel contract"

  # ─────────────────────────────────────────────
  # MONETIZATION — Phase 1.2: time-bounded exposure windows
  # ─────────────────────────────────────────────
  monetization_phase_1_2:
    status: "shipped"
    summary: >
      Added startsAt / expiresAt fields to the sponsor schema so exposure
      can be sold by time. A sponsor paid through e.g. '2026-02-17' is live
      all day on Feb 17 local time and disappears at midnight.
    modified:
      - path: "src/app/components/compatibility/components/ux/sponsors.js"
        changes:
          - "added optional startsAt + expiresAt fields; accept ISO 'YYYY-MM-DD', US 'MM-DD-YYYY', and BR 'DD/MM/YYYY' for contract convenience"
          - "parseDate(): lenient parser returning END-OF-DAY local ms (so the paid day is fully honored)"
          - "isActiveNow(sponsor, now): window check; missing startsAt = anytime, missing expiresAt = evergreen; unparseable dates fail open to 'active'"
          - "eligibleSponsors() now filters by isActiveNow(); takes optional 'now' arg for testing and for the SponsorSlot expiry ticker"
          - "pickSponsor() also threads 'now' into the underlying eligibleSponsors() call"
      - path: "src/app/components/compatibility/components/ux/SponsorSlot.js"
        changes:
          - "added 10-minute nowTick interval so long-running sessions drop expired sponsors without a reload"
          - "useMemo pool derivation now depends on nowTick"
          - "bounds-check index when the pool shrinks (e.g. active sponsor just expired)"
      - path: "public/sponsors/README.md"
        change: "documented startsAt / expiresAt contract with the end-of-day semantics and the 10-minute live-refresh behavior"

  # ─────────────────────────────────────────────
  # MONETIZATION — Phase 1.3: paid geo reach (center + radius)
  # ─────────────────────────────────────────────
  monetization_phase_1_3:
    status: "shipped"
    summary: >
      Added `center` [lat,lng] + `radiusKm` to the sponsor schema so brands can
      pay for precise geographic reach (e.g. 3 km around a restaurant). When
      the user's GPS coords fall inside the paid radius, that sponsor is
      prioritized to the top of the carousel above any regions-only match.
    modified:
      - path: "src/app/components/compatibility/components/ux/sponsors.js"
        changes:
          - "added optional center: [lat, lng] and radiusKm: number fields"
          - "inlined Haversine distanceKm() to keep the module self-contained"
          - "added isInsideReach(sponsor, userCoords) — true only when sponsor has center+radiusKm AND user is within that circle"
          - "eligibleSponsors() now accepts userCoords; sponsors with center+radiusKm require a positive reach hit unless they also provide regions[]; carousel sorting puts reach hits first, then by weight"
          - "pickSponsor() forwards userCoords into the underlying eligibleSponsors() call"
      - path: "src/app/components/compatibility/components/ux/SponsorSlot.js"
        change: "passes envVariables.currentLocation into eligibleSponsors() so precise-reach targeting works at the render site"
      - path: "public/sponsors/README.md"
        change: "documented center + radiusKm fields and the priority-above-regions ordering rule"
    reverted:
      - "SponsorSlot.css CSS centering/radius layout tweak from previous exchange (it was not what the user wanted)"

  # ─────────────────────────────────────────────
