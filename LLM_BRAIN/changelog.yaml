  map_tap_pointer_event_rewrite:
    status: "done"
    summary: "Stopped depending on Leaflet's click event for tap detection. PointerEvents on the container drive tap → onMapClick directly. Fixes Samsung A54 + iPhone where Leaflet's click never fired (or fired with wrong coords)."
    user_report: "click on map not registering touched coordinates and blue-dot not marked, on galaxy samsung a23 is ok, but a54 samsung android is not working iphone is not working"
    why_a23_worked_but_a54_did_not: >
      Samsung A23 (older Chrome / Samsung Internet) lets the browser's
      native click event fire after a tap, so Leaflet's map.on('click')
      handler ran. Samsung A54 (newer browser) — and iPhone in WebKit —
      have stricter tap-cancel heuristics that interact with Leaflet's
      L.Map.Tap (tap:true on MapContainer). Net effect on those devices:
        • the click event either never fires, OR
        • L.Map.Tap synthesizes a click whose clientX/Y is 0 (the pin
          appears 'fixed' at the map's top-left), OR
        • some interaction between native click + synthetic click +
          Leaflet's drag/zoom gesture state suppresses one or the other.
      Six iterations on top of Leaflet's click pipeline did not converge.
    fix: >
      MapClickHandler now ignores Leaflet's click event entirely and
      detects taps from raw PointerEvents on map.getContainer():
        • pointerdown captures (clientX, clientY, t, pointerId) and
          arms a 600 ms long-press timer.
        • pointermove cancels the long-press timer if movement > 10 px
          (lets the user pan without firing tap or long-press).
        • pointerup fires onMapClick if dt ≤ 500 ms AND |dx|,|dy| ≤ 10 px
          (true tap), unless the long-press timer already fired.
        • pointercancel resets state.
      Conversion still uses Leaflet 1.9.4's public
      map.containerPointToLatLng([x, y]) API on coords that come straight
      from the PointerEvent — never trusts Leaflet's click event normalization.
    why_this_does_not_double_fire_on_markers: >
      isMapBackground() walks up the DOM from e.target looking for
      .leaflet-interactive (the class Leaflet attaches to markers,
      clusters, popups, controls). If found, our handler returns early —
      Leaflet's own click pipeline handles those targets. Only taps on the
      bare map background reach onMapClick.
    why_this_does_not_break_drag_or_zoom: >
      We do not call preventDefault() on pointerdown. Leaflet's drag and
      pinch-zoom handlers see the same events and operate independently.
      Movement > 10 px during the gesture cancels our tap detection, so
      ending a drag does not drop a pin.
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"
    test_path:
      - "Samsung A23: tap drops pin under finger (regression check, was working)"
      - "Samsung A54: tap drops pin under finger (was: nothing happened)"
      - "iPhone Safari: tap drops pin under finger (was: pin fixed at top-left or no pin)"
      - "Desktop click: pin under cursor"
      - "Desktop right-click: pin + ReportSheet via onPinDropped"
      - "Long-press (600 ms still finger): pin + ReportSheet on all platforms"
      - "Drag the map: no pin dropped on release"
      - "Pinch-zoom: no pin dropped"
      - "Tap a marker / cluster: Leaflet's marker click still fires; our handler does NOT also fire"
    invariants_preserved:
      - "tap={true} tapTolerance={15} on MapContainer untouched (Leaflet still uses them for its own gestures, but we no longer depend on them)"
      - "MapSizeInvalidator still keeps Leaflet's container-size cache fresh (cluster rendering depends on it)"
      - "M1 drop-in animation, ping-ring, ReportSheet on long-press all still wired from CoffeeMap.handleMapClick / handleMapLongPress"

  ios_tap_fixed_point_fix:
    status: "done"
    summary: "After the pure-Leaflet rewrite, iOS users reported the pin was 'fixed' and didn't track the touch. Restored pointer-coord capture, but kept Leaflet 1.9.4's containerPointToLatLng for the conversion."
    user_report: "the point is fixed and dont represent touched location on ios devices"
    root_cause: >
      L.Map.Tap (active when MapContainer has tap:true) synthesizes a click
      event from iOS touchstart/touchend. In modern iOS Safari that
      synthesized MouseEvent often has clientX/Y == 0 because:
        • the synthetic event is constructed without copying the touch's
          page coords reliably across Safari WebKit + React-Leaflet event
          normalization, AND
        • Leaflet's mouseEventToContainerPoint trusts originalEvent.clientX/Y
          verbatim.
      Result: containerPoint resolves to (≈0, ≈0) → the top-left corner of
      the visible map, every tap. From the user's perspective the pin
      appears 'fixed' to one location.
      The previous (changelog § map_click_pure_leaflet_1_9_4) attempt
      removed the only coord source that survives this drift — the raw
      pointerdown/touchstart clientX/Y captured at the container BEFORE
      the synthetic click runs.
    fix:
      - "Re-added pointerdown + touchstart listeners on map.getContainer() to capture the real touch position into a small {x,y,t} cache (passive listeners — no preventDefault)."
      - "resolveLatLng now prefers the captured coords (fresh < 1000 ms), subtracts container.getBoundingClientRect() to get container-relative pixels, and calls map.containerPointToLatLng([x,y]) — Leaflet 1.9.4's PUBLIC API — to convert."
      - "Falls back to map.mouseEventToContainerPoint(e.originalEvent) when originalEvent has reliable clientX/Y (desktop, Android), then to e.latlng as final fallback."
      - "Removed map.invalidateSize() from inside the click handler. It is unnecessary: containerPointToLatLng uses the pixel origin (depends on center+zoom, NOT on container size cache). MapSizeInvalidator already handles size-cache freshness on mount + visualViewport resize."
    why_this_is_still_leaflet_1_9_4: >
      The user's directive was 'use Leaflet 1.9.4 package' for click→coord
      conversion. We do exactly that — map.containerPointToLatLng is
      Leaflet 1.9.4's documented public API for converting container-pixel
      coords to latlng. The pointerdown/touchstart capture is not
      reimplementing Leaflet's pipeline; it's only sourcing a *reliable
      input* (clientX/Y) that L.Map.Tap's synthetic click corrupts on iOS.
      Leaflet itself does the projection.
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"
    test_path:
      - "Desktop mouse click: handler uses fresh pointerdown coords; pin under cursor"
      - "Android Chrome tap: pin under finger"
      - "iOS Safari tap: pin under finger (no longer 'fixed' to top-left)"
      - "Pinch-zoom + tap on iOS: pin under finger (containerPointToLatLng is scale-aware)"
      - "Long-press / right-click: still drops pin AND opens ReportSheet via onPinDropped"
    invariants_preserved:
      - "tap={true} tapTolerance={15} unchanged — Leaflet's iOS hook stays installed; we just don't trust its synthetic click coords"
      - "MapSizeInvalidator unchanged — keeps size cache fresh for cluster rendering"
      - "M1 drop-in animation (.mdf-dropped-pin) and ping-ring still fire normally"

  map_click_pure_leaflet_1_9_4:
    status: "superseded_by_ios_tap_fixed_point_fix"
    summary: "Removed custom pointerdown/touchstart capture; map click → coordinate is now a pure Leaflet 1.9.4 pipeline"
    user_directive: "use leaflet 1.9.4 package on map click to choose coordinate"
    rationale: >
      Leaflet 1.9.4 already provides everything needed for accurate map-click
      coords across desktop and touch:
        • tap:true on MapContainer activates L.Map.Tap which converts iOS
          touchstart/touchend into a synthetic click at the actual finger
          position AND calls preventDefault to suppress iOS's own delayed
          synthetic click (which is what was drifting).
        • map.mouseEventToContainerPoint(originalEvent) is scale-aware
          (uses rect.width / offsetWidth), handling CSS transforms and
          pinch-zoom correctly.
        • map.containerPointToLatLng(point) finishes the conversion using
          the live pixel origin.
      My custom pointerdown/touchstart capture was duplicating what
      L.Map.Tap already does, fighting the library and adding surface area.
    fix:
      - "MapClickHandler now uses only Leaflet APIs: map.on('click', ...) → invalidateSize → mouseEventToContainerPoint → containerPointToLatLng"
      - "Removed pointerdown + touchstart DOM listeners and the captured-coord cache"
      - "tap={true} tapTolerance={15} on MapContainer remain — they are what makes the Leaflet pipeline accurate on iOS"
      - "map.invalidateSize call is preserved on entry so the size cache cannot be stale at click time (iOS chrome-collapse race)"
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"
    test_path:
      - "Mouse click on desktop: pin lands under cursor"
      - "Tap on Android Chrome: pin lands under finger"
      - "Tap on iOS Safari: pin lands under finger (relies on L.Map.Tap)"
      - "Pinch-zoom + tap on iOS: pin lands under finger (mouseEventToContainerPoint scale-aware)"

