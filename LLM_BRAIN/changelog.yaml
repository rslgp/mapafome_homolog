  ios_tap_precision_fix_v3:
    status: "done"
    summary: "Android tap → blue pin lands precisely; iOS still off after v2. Root cause: iOS click coords drift between touchend and synthetic click. Fix: capture pointerdown/touchstart coords as ground truth."
    user_report: "one tap should land blue dot mark of touched-location — works on android, not on ios"
    why_v2_was_insufficient: >
      v2 used map.mouseEventToContainerPoint(e.originalEvent) which is
      scale-aware. That fixes pinch-zoom and CSS transform cases. But it
      still trusts e.originalEvent.clientX/Y, which on iOS Safari can
      drift between the touchend and the dispatched synthetic click — the
      page may have scrolled, or iOS may anchor the synthetic click to the
      element center for tap-to-zoom heuristics. Android Chrome dispatches
      the click with the correct finger position, which is why the bug is
      iOS-specific.
    fix:
      - "MapClickHandler now installs pointerdown + touchstart capture listeners on the map container. They store {clientX, clientY, ts} the moment the user starts a tap — before any iOS drift can happen."
      - "When Leaflet's click event arrives, recomputeLatLng prefers the captured coords if they are <700ms old, falling back to e.originalEvent.clientX/Y otherwise."
      - "The captured slot is cleared after each click so a stale capture cannot leak into a later mouse interaction."
      - "Touchstart listener is registered alongside pointerdown because some older iOS Safari builds do not fire pointerdown reliably on plain divs."
    behaviour_preserved:
      - "Mouse interactions still work — pointerdown coords for a mouse click match the click coords, so the captured-coord path produces identical latlng to the originalEvent path."
      - "Drag-pan unaffected — Leaflet still controls drag detection; we only override the click position, not whether a click fires."
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"

  ios_tap_precision_fix_v2:
    status: "done"
    summary: "iOS tap registers but lands at wrong x,y — my hand-rolled coord math ignored CSS scale; replaced with Leaflet's scale-aware mouseEventToContainerPoint"
    root_cause: >
      The previous fix (changelog § ios_blue_pin_misplaced_fix) called
      invalidateSize() correctly but then re-derived latlng with naive
      `clientX - rect.left` math. That formula is wrong whenever any
      ancestor of .leaflet-container has a CSS transform (scale, translateZ
      for GPU compositing) OR the user has pinch-zoomed the page on iOS.
      In both cases getBoundingClientRect returns the visual width but
      clientX is in the un-scaled coordinate space. The result is a
      systematic offset from the tap position.
    fix:
      - "MapClickHandler.recomputeLatLng now calls map.mouseEventToContainerPoint(originalEvent) — the same helper Leaflet uses internally for click → latlng. It divides by getBoundingClientRect.width / element.offsetWidth, accounting for any scale transform on the container or its ancestors."
      - "Touch events without clientX/Y on the wrapping click event are synthesized from changedTouches[0] before being passed to mouseEventToContainerPoint."
      - "Wrapped in try/catch — if mouseEventToContainerPoint ever throws (would only happen if container is missing) we fall back to e.latlng instead of crashing the click handler."
      - "Removed now-unused `L` import."
    files_changed:
      - "src/app/components/compatibility/components/mapComponents.js"

