v5_audit:

  meta:
    version: "1.0"
    date_started: "2026-04-25"
    source: "LLM_BRAIN/v5_0_compact_software_engineer_principles.yaml"
    purpose: >
      Apply v5 principles to MAPA FOME starting with the highest-LOC files.
      Each entry: violation observed → v5 reference → planned action →
      status. Drives a multi-pass refactor; each pass must keep the app
      shippable (no big-bang rewrites — Newman, v5 § corrections).

  loc_inventory:
    captured: "2026-04-25"
    method: "wc -l on src/ + public/ excluding node_modules and .next"
    top_offenders:
      - path: "src/app/components/compatibility/App.js"
        loc_initial: 1496
        loc_after_pass_1: 1452
        loc_after_pass_2: 1206
        loc_reduction_total: 290
        v5_thresholds:
          file_ideal: 500
          file_acceptable: 1000
          status: "Still over acceptable, but no longer past hard limit"
      - path: "src/app/components/compatibility/components/map.backup.js"
        loc_initial: 1246
        status: "DELETED"
        rationale: "Dead/backup file with no imports — only referenced from stale .md summaries. v5 § engineering_leverage.levers: 'deletion is positive delta'."
      - path: "src/app/components/compatibility/App.css"
        loc: 655
        v5_thresholds:
          file_ideal: 500
          file_acceptable: 1000
          status: "Over ideal, within acceptable"
      - path: "src/app/components/compatibility/components/ux/reports.js"
        loc: 470
        status: "Within ideal"
      - path: "src/app/components/compatibility/components/ux/ReportSheet.css"
        loc: 416
        status: "Within ideal"
      - path: "src/app/components/compatibility/components/InfoPanel.css"
        loc: 397
        status: "Within ideal"
      - path: "src/app/relatorios/page.js"
        loc: 394
        status: "Within ideal"
      - path: "src/app/components/compatibility/components/ux/GuidedTutorial.js"
        loc: 368
        status: "Within ideal"
      - path: "src/app/components/compatibility/components/map.js"
        loc: 321
        status: "Within ideal"
      - path: "src/app/components/compatibility/components/ux/ReportSheet.js"
        loc: 311
        status: "Within ideal"

  app_js_violations:
    summary: >
      App.js is the central monolith — 1452 LOC class with state, sheet I/O,
      crypto, geo, every handler, and a 484-line componentDidMount. Multiple
      v5 violations stacked. Cannot be safely refactored in one pass — no
      test suite exists.
    violations:
      - id: "V1"
        v5_reference: "§ critical_metrics.size.files (≤500 ideal, ≤1000 acceptable, hard limit by extension)"
        observed: "1496 LOC initial, 1452 after Pass 1"
        severity: "blocker for v5 compliance"
      - id: "V2"
        v5_reference: "§ critical_metrics.size.functions (≤20 ideal, ≤65 good, 100 hard limit)"
        observed: "componentDidMount ~484 LOC; handleClickMap ~94 LOC"
        severity: "blocker"
      - id: "V3"
        v5_reference: "§ solid_quick.SRP — one class, one responsibility"
        observed: >
          App orchestrates: filters, form input, geo location, sheet auth,
          sheet write, sheet read, encryption, cookie state, sponsor metrics,
          tour, sheets, pin claims, telephone validation, region detection.
          'A module should be responsible to one and only one actor.' (Martin)
        severity: "blocker"
      - id: "V4"
        v5_reference: "§ critical_metrics.maintainability.duplication (<3%)"
        observed: "39 occurrences of useServiceAccountAuth/loadInfo/sheetsByIndex pattern"
        severity: "high"
      - id: "V5"
        v5_reference: "§ refactoring_patterns.code_smells_catalog.long_method"
        observed: "componentDidMount and handleClickMap are long-method smells"
        severity: "high"
      - id: "V6"
        v5_reference: "§ defensive_programming.barricade_pattern"
        observed: "Phone, address, telefoneEncryptado validation scattered throughout class methods"
        severity: "medium"
      - id: "V7"
        v5_reference: "§ best_practices.error_handling — 'Never swallow exceptions silently'"
        observed: >
          Multiple sheet-I/O methods catch errors with bare alert('ERRO, tente novamente')
          and log nothing. No structured error event. Per § observability we should at
          minimum console.error or fire an analytics event so failures are visible.
        severity: "medium"
      - id: "V8"
        v5_reference: "§ corrections.security_phases — 'Security is not a phase. Designed in.'"
        observed: >
          NEXT_PUBLIC_* prefixes on service-account creds expose the Sheets credentials
          to every browser session. This is a known architectural choice (no backend),
          but per v5 § security_engineering.secrets_management it is a 'never'. The
          mitigating control is sheet-level write throttling + the staging design in
          B12 of bugfixes.yaml; that decision needs an ADR.
        severity: "blocker (architectural)"

  prerequisite_for_safe_refactor:
    rule: >
      v5 § refactoring_patterns.principle: 'Always have a passing test suite
      before starting'. v5 § context_adjustments.legacy: 'Characterization
      tests first'.
    blocker: "MAPA FOME has no automated test suite of any kind."
    minimum_safety_net_before_pass_2:
      - "Add Vitest + React Testing Library to package.json"
      - "Smoke tests for App component mount + initial state assertions"
      - "Characterization tests for the 13 sheet-I/O methods (mock sheetsClient)"
      - "Manual regression checklist: tap → blue pin, publish, ratings, scroll on iOS+Android"

  refactor_plan:
    pass_1_done:
      - "Created src/app/components/compatibility/components/googlesheets/sheetsClient.js — central auth + getSheet + appendRow"
      - "Migrated removerPonto and verificarPonto to use sheetsAppendRow (47 LOC removed)"
      - "Deleted map.backup.js (1246 LOC removed from repo)"
    pass_2_done:
      summary: "Migrated the read-find-update sheet methods + debug helpers + dropped a 110-LOC commented-out planilhacsv block"
      changes:
        - "Added updatePinDadosByCoords(envVariables, coordsStr, mutator) helper to sheetsClient.js"
        - "Migrated contabilizarClicado, clicouTelefone, entregarAlimento — each from ~35 LOC to ~6 LOC, all using the same mutator pattern"
        - "Migrated avaliar — preserved cookie gate, error toasts, no-reload behavior; replaced inline auth+find with helper call"
        - "Migrated window.fixarPonto and window.stats debug helpers to sheetsGetSheet(0)"
        - "Deleted the 110-line commented-out window.planilhacsv block (lines 1057-1166 of pre-pass-2 file). Per v5 § refactoring_patterns.code_smells_catalog.comments and § engineering_leverage."
      metrics:
        auth_blocks_remaining: 4
        loc_reduction_pass_2: 246
        callsites_migrated: 7
    pass_3_pending:
      blocker: "Test suite required — these are the M1 reporter hot path"
      tasks:
        - "writePinToSheets (line ~587) — has timeout wrapper + idempotency_key. Cannot extract without characterization tests."
        - "handleClickMap publish flow (line ~415) — 90+ LOC method that publishes a pin."
        - "componentDidMount initial fetch (line ~762) — first network call for the map shell."
        - "Estimated additional reduction: ~80 LOC across these three"
    pass_4_pending:
      tasks:
        - "Extract componentDidMount initialization sequence to src/app/components/compatibility/services/appBootstrap.js"
        - "Move IP→region detection, geolocation, cookie hydration, sheet preload into named services"
        - "Estimated reduction: ~400 LOC from App.js"
    pass_5_pending:
      tasks:
        - "Extract handleClickMap publish flow → publishPinFromMap.js service (Humble Object pattern, v5 § architecture_boundaries.humble_object_pattern)"
        - "Decompose handleChangeTelefone, handleChangeNumero, handleChangeRedeSocial into a useFormControls hook (or pure utility module since App is class-based)"
    pass_6_pending:
      tasks:
        - "Convert App from class to functional component, OR keep class and migrate to a state-machine module (XState or hand-rolled)."
        - "Type 1 decision per v5 § decision_frameworks.type1_type2 — needs ADR before execution."

  adrs_required:
    - id: "ADR-001"
      title: "Public service-account credentials for Google Sheets"
      status: "Proposed"
      context: >
        NEXT_PUBLIC_* env vars expose Sheets credentials to every browser session.
        This was an explicit choice (no backend, free hosting, community-edit model).
      decision_required: >
        Document the threat model + mitigating controls (sheet-level read/write
        scoping, append-only audit sheets, daily rotation) OR plan migration to
        a thin backend proxy.
    - id: "ADR-002"
      title: "App.js refactor target — class vs functional"
      status: "Proposed"
      context: "App.js is a 1452-LOC React class. v5 § solid_quick.SRP demands decomposition."
      decision_required: >
        Choose between (a) keep class, extract to service modules / (b) port to
        functional with hooks / (c) replace App.js with a route-driven shell.
        Type 1 decision — needs alternatives + trade-offs documented.

  reference: "LLM_BRAIN/v5_0_compact_software_engineer_principles.yaml"
