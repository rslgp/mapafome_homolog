# ─── Known failure modes (with diagnostic signature) ───────────────────────
# Each row is something we observed at least once. Use this to triage future
# bug reports by symptom — match the user's description to the signature
# column, jump to the fix.

failure_modes:
  - id: F1
    symptom: "Tap does nothing — no pin appears"
    devices_observed: ["A54", "iPhone (some configs)"]
    diagnostic_signature: >
      sessionStorage.mdf_analytics_events does NOT show any click-related
      entry after a tap. console has no errors. Other taps elsewhere in
      the page work fine.
    likely_cause: "Leaflet's click event never fires on these browsers (tap-cancel heuristic)"
    fix_applied: "PointerEvent rewrite (changelog § map_tap_pointer_event_rewrite)"

  - id: F2
    symptom: "Pin always lands at the top-left corner of the map ('fixed')"
    devices_observed: ["iPhone iOS 15+ Safari"]
    diagnostic_signature: >
      onMapClick fires (lat/lng appear in console) but lat,lng correspond
      to the visible top-left corner regardless of where the user tapped.
    likely_cause: "L.Map.Tap synthesized a click event with clientX=0, clientY=0"
    fix_applied: "PointerEvent rewrite (we no longer trust the synthetic click's coords)"

  - id: F3
    symptom: "Pin lands at the wrong lat/lng (offset by tens of pixels)"
    devices_observed: ["iPhone with browser chrome collapsing/expanding"]
    diagnostic_signature: >
      Pin is consistently off by a fixed Y offset that matches the iOS
      address-bar height. Reproducible by scrolling to collapse the
      chrome and then tapping.
    likely_cause: "Leaflet's container-size cache went stale after iOS chrome collapsed"
    fix_applied: "MapSizeInvalidator (changelog § ios_blue_pin_misplaced_fix) + MapContainer's pixel-origin recompute is now scale-aware"

  - id: F4
    symptom: "Pin lands wrong only when pinch-zoomed"
    devices_observed: ["iPhone, iPad"]
    diagnostic_signature: "Tap precision is fine at 1× zoom, off when pinch-zoom is active"
    likely_cause: "Hand-rolled clientX − rect.left math ignored CSS scale"
    fix_applied: "Using map.containerPointToLatLng (scale-aware via pixel origin)"

  - id: F5
    symptom: "First tap drops a pin in the wrong place; subsequent taps are fine"
    devices_observed: ["iPhone after orientation change"]
    diagnostic_signature: "Only the first tap after a viewport change is wrong"
    likely_cause: "Container-size cache stale until first invalidateSize"
    fix_applied: "MapSizeInvalidator listens to visualViewport.resize"

  - id: F6
    symptom: "Tap on a marker drops a NEW pin instead of opening the marker popup"
    devices_observed: ["regression_risk"]
    diagnostic_signature: "Marker click handler does not fire; instead onMapClick runs"
    likely_cause: "isMapBackground walk fails to detect .leaflet-interactive"
    fix_applied: "isMapBackground walks parents looking for .leaflet-interactive class"
    open_risk: "If a marker uses a custom div without .leaflet-interactive, this fails. ReporterMarkers and MarkerGroup use Leaflet defaults so this should be safe."

  - id: F7
    symptom: "Pin drops while the user is dragging the map"
    devices_observed: ["regression_risk"]
    diagnostic_signature: "Pan ends → pin appears at release point even though user was scrolling"
    likely_cause: "Tap-tolerance too loose"
    fix_applied: "TAP_MAX_DISTANCE_PX = 10 — release > 10 px from down position is not a tap"

  - id: F8
    symptom: "Long-press fires twice (two ReportSheets open)"
    devices_observed: ["regression_risk_android_only"]
    diagnostic_signature: "After holding 600 ms on Android, two onMapLongPress fire"
    likely_cause: >
      Both our 600 ms timer AND Leaflet's contextmenu event
      (Chrome-emulated long-press) fire onMapLongPress.
    open_risk: "ACTIVE — needs verification on Android"
    mitigation_idea: >
      If timer fired (longPressFired = true), set a flag to ignore the
      next contextmenu within 1000 ms. Or remove map.on('contextmenu')
      since Android Chrome emits both contextmenu AND pointerup with
      a long delay.

  - id: F9
    symptom: "Tap doesn't work after switching browser tabs and coming back"
    devices_observed: ["regression_risk"]
    diagnostic_signature: "Map looks right but no taps register until a touch-and-drag"
    likely_cause: "Pointer capture from another element"
    fix_applied: "pointercancel handler resets state"
    open_risk: "Verify on iOS where backgrounding the tab is common"


# ─── Test plan ─────────────────────────────────────────────────────────────
# Concrete steps QA / user can follow on each device. Sequence matters:
# regression checks first, then the previously-broken combos.

test_plan:
  preconditions:
    - "App built from main with the PointerEvent rewrite (changelog § map_tap_pointer_event_rewrite)"
    - "GPS permission granted (so the default Recife center is replaced with the actual location)"
    - "MAPA FOME tab in the foreground"

  steps:
    - id: T1
      device_filter: "any"
      name: "Single tap drops blue pin"
      do: "Tap once anywhere on the map background"
      expect:
        - "A blue pin (CURRENT_LOCATION_SMALL icon) appears under the finger within 100 ms"
        - "Pin has the M1 drop-in animation (.mdf-dropped-pin scale 0→1.1→1.0)"
        - "ReportSheet does NOT open"
      fails_if_blocked_by: ["F1", "F2", "F3", "F4", "F5"]

    - id: T2
      device_filter: "any"
      name: "Long-press drops pin AND opens ReportSheet"
      do: "Press and hold for 1 second on the map background"
      expect:
        - "Pin appears at the held position"
        - "ReportSheet (3-step flow) slides up"
        - "Only ONE ReportSheet (no double-fire — see F8)"

    - id: T3
      device_filter: "any"
      name: "Pan does not drop a pin"
      do: "Touch the map and drag > 30 px before releasing"
      expect:
        - "No pin appears"
        - "Map panned to the new position"

    - id: T4
      device_filter: "touch_capable"
      name: "Pinch zoom + tap precision"
      do: "Pinch to zoom in to roughly 2×, then tap a building"
      expect:
        - "Pin lands on the tapped building, not offset"

    - id: T5
      device_filter: "ios"
      name: "Browser chrome collapse / expand"
      do: "Scroll inside InfoPanel until iOS address bar collapses, scroll back, then tap the map"
      expect:
        - "Pin lands at the tapped position (no Y offset from F3)"

    - id: T6
      device_filter: "any"
      name: "Marker click does NOT drop a new pin"
      do: "Tap an existing marker (any roaster type)"
      expect:
        - "Marker popup opens"
        - "No NEW blue pin appears under the marker"

    - id: T7
      device_filter: "any"
      name: "ReportSheet open → map taps suppressed"
      do: "Open ReportSheet via long-press, then tap the visible map area through the sheet"
      expect:
        - "Tap does not change the pin (sheet is the active surface)"
      note: "This depends on z-index/pointer-events of the sheet, not on MapClickHandler. Verify it still works after the rewrite."


# ─── Open risks (what could still break) ───────────────────────────────────

open_risks:
  - id: R1
    risk: "PointerEvent not supported"
    likelihood: "very_low"
    blast_radius: "any tap on map"
    affected: "Browsers older than Chrome 55 (2016) / Safari 13 (2019) / Firefox 59 (2018)"
    mitigation: >
      Modern Next.js 16 already requires evergreen browsers. If a user
      with an ancient browser hits the page, taps will silently fail —
      acceptable per design_brief assumptions.

  - id: R2
    risk: "Long-press double-fire on Android (F8)"
    likelihood: "medium"
    blast_radius: "two ReportSheets open, user confusion"
    affected: "Android Chrome long-press"
    mitigation: "TBD — may need to suppress contextmenu after our timer fires"

  - id: R3
    risk: "Custom marker without .leaflet-interactive (F6)"
    likelihood: "low"
    blast_radius: "tapping that marker drops a new pin"
    affected: "Future markers added by other developers"
    mitigation: >
      Add a comment in MarkerGroup explaining that interactive markers
      MUST carry the .leaflet-interactive class (Leaflet does this by
      default; only custom L.divIcon may need explicit setup).

  - id: R4
    risk: "Pointer capture across orientation change"
    likelihood: "low"
    blast_radius: "first tap after rotation lost"
    affected: "iPhone, Android"
    mitigation: "pointercancel resets state; orientation API also fires resize"

  - id: R5
    risk: "Tap inside an iframe overlay"
    likelihood: "very_low"
    blast_radius: "tap goes to iframe instead of map"
    affected: "/creators (CreatorsMapaFome.js iframe — not currently mounted)"
    mitigation: "n/a until /creators ships"


# ─── Backlog ───────────────────────────────────────────────────────────────
# Prioritized work items derived from `matrix` actions, `failure_modes` open
# risks, `open_risks` mitigations, and `test_plan` steps that have not yet
# run. Each item carries its own acceptance criteria so we can close it
# without re-reading the rest of the file.
#
# Priority key:
#   P0 = active regression or unverified critical fix (must close before
#        declaring map-click "stable")
#   P1 = device coverage we promised in matrix.action and have not run yet
#   P2 = hardening / smoke tests for combos we have no signal on
#   P3 = future-proofing for surfaces not yet shipped (e.g. /creators)
#
# Status key:
#   open       = not started
#   in_review  = code/test exists, awaiting verification
#   blocked    = waiting on hardware, contact, or external dep
#   done       = closed; leave entry as historical record

backlog:
  - id: MC-1
    priority: P0
    title: "Verify PointerEvent rewrite on iPhone"
    type: verification
    references:
      matrix: ios_safari_modern
      failure_modes: [F1, F2]
      changelog: map_tap_pointer_event_rewrite
    depends_on: []
    estimate: "5 min user QA on real iPhone"
    status: open
    acceptance:
      - "T1 passes (single tap drops pin under finger)"
      - "T2 passes (long-press opens ReportSheet)"
      - "F2 cannot be reproduced (pin no longer fixed at top-left)"

  - id: MC-2
    priority: P0
    title: "Verify PointerEvent rewrite on Samsung A54"
    type: verification
    references:
      matrix: android_samsung_a54
      failure_modes: [F1]
      changelog: map_tap_pointer_event_rewrite
    depends_on: []
    estimate: "5 min user QA on real A54"
    status: open
    acceptance:
      - "T1 passes (single tap drops pin)"
      - "T4 passes (pinch-zoom + tap precise)"

  - id: MC-3
    priority: P0
    title: "Regression check on Samsung A23"
    type: regression_test
    references:
      matrix: android_samsung_a23
      changelog: map_tap_pointer_event_rewrite
    depends_on: []
    estimate: "3 min user QA on A23"
    status: open
    rationale: >
      A23 was the only device that worked before the rewrite. The
      rewrite removed dependency on map.on('click') — must confirm A23
      did not regress.
    acceptance:
      - "T1 still passes on A23 (pin under finger, was working)"
      - "T6 still passes (marker tap → popup, NOT new blue pin)"

  - id: MC-4
    priority: P0
    title: "Resolve F8: Android long-press double-fire risk"
    type: fix
    references:
      failure_modes: [F8]
      open_risks: [R2]
      matrix: android_chrome_long_press_contextmenu
      changelog: map_tap_pointer_event_rewrite_mc4
    depends_on: [MC-2]
    estimate: "30 min code + 10 min QA"
    status: in_review
    rationale: >
      Two long-press paths were wired: our 600 ms PointerEvent timer AND
      Leaflet's contextmenu event (Chrome emulates contextmenu on
      long-press). Both call onMapLongPress → two ReportSheets could open.
    chosen_solution: hybrid_a_plus_b
    shipped: >
      MapClickHandler now (1) skips arming the long-press timer when
      pointerType === 'mouse' and skips entirely when button !== 0
      (right/middle click), and (2) records lastLongPressFiredAt when the
      timer fires; handleContextmenu returns early if that timestamp is
      within LONG_PRESS_DEDUP_MS (1000 ms). Net effect: touch uses the
      PointerEvent timer; mouse uses contextmenu; Android Chrome's
      duplicate contextmenu is suppressed.
    acceptance:
      - "Long-press on Android Chrome opens exactly one ReportSheet — pending MC-2 device test"
      - "Right-click on desktop still opens ReportSheet — covered by mapClickHandler.test.js"

  - id: MC-5
    priority: P1
    title: "Smoke test on iPhone PWA standalone (Add to Home Screen)"
    type: smoke_test
    references:
      matrix: ios_pwa_standalone
      bugfixes: B5
    depends_on: [MC-1]
    estimate: "15 min — install + run T1, T2, T3, T5"
    status: blocked
    blocked_on: "physical iPhone with Add-to-Home-Screen install"
    acceptance:
      - "All map-click tests pass in standalone display mode"
      - "visualViewport.resize still fires (no chrome to collapse, but rotation triggers it)"

  - id: MC-6
    priority: P1
    title: "Smoke test on iPad split-view"
    type: smoke_test
    references:
      matrix: ipad_split_view
      bugfixes: B7
    depends_on: [MC-1]
    estimate: "10 min on physical iPad"
    status: blocked
    blocked_on: "iPad hardware"
    acceptance:
      - "T1 passes during 1/2 split"
      - "Resizing the split mid-tap does not produce an offset pin"

  - id: MC-7
    priority: P1
    title: "Smoke test on Pixel + Xiaomi/Motorola Android Chrome"
    type: smoke_test
    references:
      matrix: android_chrome_generic
      bugfixes: B9
    depends_on: [MC-2]
    estimate: "5 min per device"
    status: blocked
    blocked_on: "non-Samsung Android hardware"
