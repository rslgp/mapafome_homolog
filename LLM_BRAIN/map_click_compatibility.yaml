# ─── Reporting template (for new bug reports) ──────────────────────────────
# When a user reports another tap-on-map bug, copy this block, fill it in,
# and append to bugfixes.yaml or send to the developer.

reporting_template:
  device: "<vendor + model>"
  os: "<name + version>"
  browser: "<name + version>"
  display_mode: "<browser tab | PWA standalone>"
  steps_to_reproduce:
    - "Open MAPA FOME"
    - "..."
  expected: "<what should happen>"
  actual: "<what happens — match against failure_modes table above>"
  diagnostic:
    - "Open devtools (Safari Web Inspector / Chrome remote debug)"
    - "In console: sessionStorage.getItem('mdf_analytics_events')"
    - "Look for sponsor_*, pin_*, report_* events near the tap time"
    - "Note pointerdown coords vs reported lat/lng"
  matched_failure_mode: "<F1..F9 or 'new'>"


# ─── How to add a new device row ───────────────────────────────────────────
# 1) Append under matrix: with a new id (snake_case).
# 2) Set status: untested initially; update after testing.
# 3) If tested and broken, also add a row under failure_modes.
# 4) If a fix lands, add a changelog entry and reference it under
#    meta.related_changelog_entries.
