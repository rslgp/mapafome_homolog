# map_click_compatibility.yaml
#
# Source of truth for the "tap on map → drop blue pin → onMapClick fires
# with the touched lat/lng" flow across every device/browser combination
# we know about, plus the open risks we have not yet tested.
#
# Sibling files:
#   bugfixes.yaml          → backlog of bugs (B1..B19); this file zooms in on
#                            map-click only and tracks per-device behavior.
#   changelog.yaml         → history of fixes applied (search "tap" / "click"
#                            / "ios" / "map_tap" / "MapClickHandler").
#   v5_milestones.yaml     → SE-quality refactor milestones, separate scope.
#
# Code under test:
#   src/app/components/compatibility/components/mapComponents.js
#     → MapClickHandler (PointerEvent rewrite, current production code)
#     → MapSizeInvalidator (keeps Leaflet container-size cache fresh)
#   src/app/components/compatibility/components/map.js
#     → MapContainer with tap={true} tapTolerance={15}
#     → CoffeeMap.handleMapClick (drops L.marker with ICONS.CURRENT_LOCATION_SMALL)
#     → CoffeeMap.handleMapLongPress (also opens ReportSheet via onPinDropped)
#   src/app/components/compatibility/App.css
#     → .leaflet-marker-icon:not(.leaflet-interactive) { pointer-events: none !important }
#       (Safari halo-PNG hit-test fix from changelog § safari_map_click_fix)
#   src/app/globals.css
#     → -webkit-tap-highlight-color: transparent (removes the gray flash)
#     → .leaflet-container { -webkit-touch-callout: none }
#
# Owner: this file. Update on every map-click fix or new device report.

meta:
  version: 1
  last_updated: "2026-04-28"
  related_changelog_entries:
    - safari_map_click_fix
    - safari_map_touch_fix
    - ios_tap_precision_fix
    - ios_general_hardening
    - ios_full_resolution
    - ios_hardening_regression_fix
    - ios_blue_pin_misplaced_fix
    - ios_tap_precision_fix_v2
    - ios_tap_precision_fix_v3
    - map_click_pure_leaflet_1_9_4
    - ios_tap_fixed_point_fix
    - map_tap_pointer_event_rewrite # current production fix


# ─── Architecture of the click pipeline (current code) ─────────────────────
# Single source of truth so future regressions can be diagnosed without
# re-reading six iterations of changelog entries.

pipeline:
  current_implementation: "PointerEvent rewrite (changelog § map_tap_pointer_event_rewrite)"
  steps:
    - id: 1
      name: pointerdown
      where: "MapClickHandler useEffect, on map.getContainer()"
      does:
        - "Records clientX, clientY, t = Date.now(), pointerId"
        - "Skips if e.target is .leaflet-interactive (markers/clusters/popups/controls)"
        - "Arms 600 ms long-press timer with the recorded coords"
    - id: 2
      name: pointermove
      where: "MapClickHandler useEffect"
      does:
        - "If movement > 10 px from down position: cancel long-press timer"
        - "Does not call preventDefault (lets Leaflet drag/zoom proceed)"
    - id: 3a
      name: pointerup_tap
      where: "MapClickHandler useEffect"
      does:
        - "Fires only if dt ≤ 500 ms AND |dx|,|dy| ≤ 10 px"
        - "Calls map.containerPointToLatLng([clientX-rect.left, clientY-rect.top])"
        - "Calls onMapClick(map, lat, lng)"
    - id: 3b
      name: longpress_timer
      where: "setTimeout in pointerdown"
      does:
        - "Fires if no cancel for 600 ms"
        - "Calls onMapClick AND onMapLongPress (the latter opens ReportSheet)"
    - id: 4
      name: pointercancel
      where: "MapClickHandler useEffect"
      does: ["Resets all state — used when pointer is captured by another element or touch is interrupted"]
    - id: 5
      name: contextmenu
      where: "Leaflet event"
      does:
        - "Desktop right-click and Android long-press (browser-emulated) path"
        - "preventDefault on originalEvent (suppress native menu)"
        - "Calls toLatLng from originalEvent clientX/Y"
        - "Calls onMapClick AND onMapLongPress"
  what_we_no_longer_depend_on:
    - "Leaflet's map.on('click', ...) event (was firing inconsistently across devices)"
    - "L.Map.Tap synthesized click clientX/Y (was 0,0 on modern iOS Safari)"
    - "map.mouseEventToContainerPoint(e.originalEvent) for touch (originalEvent unreliable)"
    - "Manual rect.width vs offsetWidth scale math (no longer needed; we own the clientX/Y)"
  what_we_still_use_from_leaflet_1_9_4:
    - "map.containerPointToLatLng([x,y]) for the actual coordinate conversion"
    - "map.getContainer() to find the listening element"
    - "map.on('contextmenu') for desktop right-click"
    - "L.marker / L.divIcon for rendering the pin (CoffeeMap.handleMapClick)"


