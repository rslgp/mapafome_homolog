  - id: MC-17
    priority: P0
    title: "Instrument the tap pipeline with structured analytics"
    type: observability
    references:
      changelog: map_click_observability_instrumentation
      v5_milestones: VM7
      failure_modes: [F1, F2, F3, F8]
    depends_on: []
    estimate: "1 hour"
    status: done
    rationale: >
      Six iterations shipped without telemetry, so every "doesn't work on
      device X" report was guesswork. Now every branch of the tap
      pipeline emits a typed event into sessionStorage + gtag + dataLayer:
        - map_tap                  (successful tap)
        - map_long_press           (timer or contextmenu)
        - map_tap_skipped          (with reason: leaflet_interactive |
                                    non_primary_button | movement |
                                    duration | pointer_cancel |
                                    contextmenu_dedup)
      Future bug reports collapse into:
        sessionStorage.getItem('mdf_analytics_events')
      → JSON list shows exactly which branch the pipeline took on the
      reporting device, with lat/lng + pointerType + dt.
    shipped:
      - "src/app/components/compatibility/components/ux/analytics.js — added trackMapTap, trackMapLongPress, trackMapTapSkipped (with round6 lat/lng + clamped duration_ms)"
      - "src/app/components/compatibility/components/mapComponents.js — fires the helpers at every branch of MapClickHandler"
      - "test/mapClickHandler.test.js — 9 new analytics assertions in a dedicated describe block"
    acceptance:
      - "[done] Every observable branch (tap, long-press, skip with each reason) emits a typed event"
      - "[done] Test suite mocks analytics module and asserts the helper is called with the right shape"
      - "[done] No PII or token fields in payloads (lat/lng rounded to 6 decimals; no user_agent / IP)"

  - id: MC-16
    priority: P3
    title: "Add an automated test for tap → onMapClick pipeline"
    type: test_infra
    references:
      changelog: map_tap_pointer_event_rewrite
      v5_milestones: VM0
    depends_on: []
    estimate: "1 day — originally Playwright; descoped to vitest unit test"
    status: in_review
    blocked_on: "npm install (lockfile reports ECOMPROMISED — env-side issue, not code)"
    rationale: >
      Six iterations of this bug landed in production because we had no
      automated guard. A unit test that dispatches synthetic
      pointerdown/up on a fake container and asserts onMapClick lat/lng
      catches F1/F2/F3-class regressions without Playwright overhead.
    shipped: >
      test/mapClickHandler.test.js (12 cases) exercises:
        - touch tap → onMapClick lat/lng
        - movement > 10 px → no tap (pan)
        - touch long-press 600 ms → onMapClick + onMapLongPress
        - mouse pointerType does NOT arm long-press timer (MC-4)
        - mouse tap fires onMapClick once
        - non-primary button (right-click) ignored
        - Leaflet contextmenu fires onMapClick + onMapLongPress
        - contextmenu within 1000 ms of timer is suppressed (F8 fix)
        - contextmenu allowed once dedup window elapses
        - .leaflet-interactive children skipped (F6 contract)
        - nested children of .leaflet-interactive skipped
        - pointermove cancels long-press timer
        - pointercancel resets state
      File parses cleanly via `node --check`. Full vitest run is blocked
      on the npm install env issue.
    acceptance:
      - "[done] test/mapClickHandler.test.js exists with the cases above"
      - "[done] react-leaflet is mocked so no real MapContainer is needed"
      - "[done] Cases cover both regression risks (F6, F7, F8, F9) and shipped behaviors"
      - "[pending] CI run after `npm install` succeeds"
    not_done:
      - "Playwright e2e — descoped; this unit test gives the same regression guard at lower cost"


